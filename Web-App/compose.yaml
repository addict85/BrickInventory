# ════════════════════════════════════════════════════════════════════════════════
# BrickInventory Manager — Docker Compose
#
# Einrichten und Starten: README.md, Abschnitt „Docker“. Kurz:
#   docker compose pull && docker compose up -d     signiertes Image von Docker Hub
#   docker compose up -d --build                    selbst aus diesem Ordner bauen
#
# Ressourcengrenzen je Dienst, damit ein Fehler in sharp/pdf-lib oder eine
# Anfrageflut einen Container füllt und nicht den Rechner. Die Vorgaben passen
# auf einen Raspberry Pi 4 mit 4 GB; anpassen in .env (APP_MEM_LIMIT, …).
# ════════════════════════════════════════════════════════════════════════════════

# Docker-Protokolle mit Grösse und Zahl begrenzt: Ohne Grenze wüchse json-file
# bis die Platte voll ist, und Fehlanmeldungen samt Adressen und das
# Startpasswort blieben für die Lebensdauer des Containers liegen.
x-protokoll: &protokoll
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── PostgreSQL Datenbank ─────────────────────────────────────────────────────
  postgres:
    # Eine neue Hauptversion liest die Daten der alten nicht, und ab 18 liegt
    # PGDATA eine Ebene tiefer: Ein Tausch des Tags allein schlägt fehl. Der
    # Weg (pg_dumpall, neues Verzeichnis, einspielen) steht in POSTGRES-18.md;
    # ./pgdata (16) bleibt als Rückfallebene liegen.
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: brickinventory-db
    logging: *protokoll
    restart: unless-stopped
    environment:
      POSTGRES_DB:       brickinventory
      POSTGRES_USER:     brickinventory
      # Passwörter nur als Dateien (secrets unten, scripts/geheimnisse-einrichten.sh):
      # Umgebungsvariablen zeigt `docker inspect` jedem mit Zugang zu Docker.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Für postgres/app-rolle.sh beim Anlegen einer neuen Datenbank.
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_password, db_app_password]
    command: postgres -c max_connections=200 -c shared_buffers=128MB
    # Ein Prozess je Verbindung: 200 Verbindungen plus Hintergrundprozesse.
    mem_limit: ${DB_MEM_LIMIT:-1g}
    pids_limit: 300
    cpus: ${DB_CPUS:-2}
    # Der Entrypoint des Images läuft als root: Er legt $PGDATA an (chmod 700),
    # richtet die Eigentümer per find/chown und wechselt mit gosu zu postgres.
    # Genau dafür reichen diese fünf; der Server selbst läuft ohne.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    # Schreiben nur in die Daten und den Socket-Ordner.
    read_only: true
    tmpfs:
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./pgdata18:/var/lib/postgresql
      - ./postgres/app-rolle.sh:/docker-entrypoint-initdb.d/10-app-rolle.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickinventory -d brickinventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Nur das interne Netz: Die Datenbank braucht keinen Weg nach draussen.
    networks:
      - db-net

  # ── Datenbankrolle der App ───────────────────────────────────────────────────
  # `brickinventory` ist der Superuser der Datenbank. App und Jobs
  # verbinden sich als `brickinventory_app` ohne Superuser-Rechte, der Datenbank
  # und Tabellen gehören. Dieser Dienst legt die Rolle bei jedem `up` an bzw.
  # richtet sie nach und endet dann (UPGRADE.md, Abschnitt 29).
  db-rolle:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: brickinventory-db-rolle
    logging: *protokoll
    restart: "no"
    user: postgres
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/rolle/app-rolle.sh"]
    mem_limit: 128m
    pids_limit: 32
    cpus: 0.5
    environment:
      PGHOST: postgres
      PGUSER: brickinventory
      PGDATABASE: brickinventory
      PGPASSWORD_FILE: /run/secrets/db_password
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      # Leserolle brickinventory_lesen (psql, README „Datenbank ansehen“); leere Datei = Rolle ohne Anmeldung.
      PGWEB_DB_PASSWORD_FILE: /run/secrets/pgweb_db_password
    secrets: [db_password, db_app_password, pgweb_db_password]
    volumes:
      - ./postgres/app-rolle.sh:/rolle/app-rolle.sh:ro
    networks:
      - db-net

  # ── Datenschlüssel anlegen ───────────────────────────────────────────────────
  # Legt ./schluessel/datenschluessel beim ersten Start an (32 Zufallsbyte,
  # base64, nur für brickinv lesbar) und endet. app und jobs sehen den Ordner
  # danach nur lesend. Liegt noch ein alter Schlüssel in data/.datenschluessel,
  # legt er keinen neuen an: Der Server meldet dann den Umzug (UPGRADE.md).
  schluessel:
    # Dasselbe Image wie app (siehe dort).
    image: ${BRICK_IMAGE:?BRICK_IMAGE fehlt in .env - einmal sh scripts/image-pruefen.sh ausfuehren (UPGRADE.md, Abschnitt 42)}
    pull_policy: missing
    container_name: brickinventory-schluessel
    logging: *protokoll
    restart: "no"
    user: root
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    mem_limit: 64m
    pids_limit: 16
    cpus: 0.5
    entrypoint: ["sh", "/app/schluessel-anlegen.sh"]
    volumes:
      - ./schluessel:/app/schluessel
      - ./data:/app/data:ro

  # ── Rechte an ./data ─────────────────────────────────────────────────────────
  # Übergibt ./data bei jedem `up` an brickinv (Eigentümer reparieren, Marke,
  # Unterordner) und endet; app und jobs laufen danach nie als root. Root sieht
  # hier nur ./data und kein Netz: Ein Symlink, den der Dienst dort ablegt,
  # führt chown höchstens ins schreibgeschützte Image. BRICKINV_CHOWN gilt hier.
  daten-rechte:
    # Dasselbe Image wie app (siehe dort).
    image: ${BRICK_IMAGE:?BRICK_IMAGE fehlt in .env - einmal sh scripts/image-pruefen.sh ausfuehren (UPGRADE.md, Abschnitt 42)}
    pull_policy: missing
    container_name: brickinventory-daten-rechte
    logging: *protokoll
    restart: "no"
    user: root
    network_mode: none
    # chown und das Lesen fremder Ordner (CHOWN, DAC_OVERRIDE); Marke und
    # Unterordner schreibt su-exec als brickinv (SETUID, SETGID).
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    read_only: true
    mem_limit: 64m
    pids_limit: 16
    cpus: 0.5
    entrypoint: ["sh", "/app/daten-rechte.sh"]
    environment:
      BRICKINV_CHOWN: ${BRICKINV_CHOWN:-auto}
    volumes:
      - ./data:/app/data

  # ── BrickInventory Manager App ───────────────────────────────────────────────
  app:
    # Ein Image für schluessel, daten-rechte, app und jobs, als Digest: Ein Tag lässt sich
    # umhängen. scripts/image-pruefen.sh prüft die Signatur und trägt
    # BRICK_IMAGE in .env ein. Wer selbst baut, setzt BRICK_IMAGE auf einen
    # eigenen Namen; nur `app` hat `build:`, damit `--build` einmal baut.
    image: ${BRICK_IMAGE:?BRICK_IMAGE fehlt in .env - einmal sh scripts/image-pruefen.sh ausfuehren (UPGRADE.md, Abschnitt 42)}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brickinventory-app
    logging: *protokoll
    restart: unless-stopped
    # Kleiner init-Prozess als PID 1: reicht Signale weiter und räumt
    # verwaiste Kindprozesse (Bildwerkzeuge, PDF) ab.
    init: true
    # Heap 384 MB (Dockerfile) plus sharp, PDF und Puffer.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    pids_limit: 256
    cpus: ${APP_CPUS:-2}
    # Als brickinv ohne jede Capability: ./data hat daten-rechte schon
    # übergeben. Schreiben darf der Server nur in ./data und /tmp.
    user: brickinv
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    depends_on:
      db-rolle:
        condition: service_completed_successfully
      schluessel:
        condition: service_completed_successfully
      daten-rechte:
        condition: service_completed_successfully
    # Kein veröffentlichter Port: Von aussen geht es nur über Caddy (HTTPS).
    # Bewusste Klartext-Ausnahme zum Ausprobieren: die zwei Zeilen
    # einkommentieren, in .env COOKIE_SECURE=0 und APP_BASE_URL=http://…
    # setzen (README.md, „Ohne HTTPS“). Passwörter gehen dann lesbar durchs LAN.
    # ports:
    #   - "${APP_BIND:-127.0.0.1}:3000:3000"
    volumes:
      # Alle Bilder samt Vorschaubildern liegen unter data/ (src/infra/appPaths.ts);
      # eine Sicherung von ./data erfasst sie mit.
      - ./data:/app/data
      # Der Datenschlüssel für gespeicherte Geheimnisse, getrennt von ./data:
      # Eine Sicherung von data/ (scripts/backup.sh) enthält ihn so nie. Nur
      # lesend: Angelegt wird er vom Dienst `schluessel`, ein Fehler im Server
      # kann ihn so nicht überschreiben.
      - ./schluessel:/app/schluessel:ro
      # Nur das öffentliche Wurzelzertifikat, das Caddy hineinkopiert (siehe
      # dort); Caddys Ordner mit dem Schlüssel der CA sieht die App nicht.
      - ca-wurzel:/caddy-ca:ro
    environment:

      # ── Geheimnisse als Dateien (secrets unten) ──────────────────────────────
      # scripts/geheimnisse-einrichten.sh legt sie an. Der Server liest X_FILE
      # und verweigert ein Sitzungsgeheimnis unter 32 Zeichen.
      SESSION_SECRET_FILE: /run/secrets/session_secret

      # ── App ──────────────────────────────────────────────────────────────────
      # Adresse, unter der der Server von aussen erreichbar ist: Mails, QR-Code,
      # Passkeys. Ohne Angabe https://BRICK_HOST — die Adresse von Caddy.
      APP_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
      # Wem X-Forwarded-For und X-Forwarded-Proto geglaubt wird: genau Caddy
      # (feste Adresse unten). Erst damit weiss der Server, dass die Anfrage
      # über TLS kam (Cookie mit Secure, HSTS).
      TRUST_PROXY: ${TRUST_PROXY:-172.28.73.10}
      # Das Wurzelzertifikat der CA für /ca.crt und den Fingerabdruck im QR-Code.
      CA_ZERTIFIKAT: /caddy-ca/root.crt
      # Legt der erste Start an. Ältere Installationen mit data/.datenschluessel
      # laufen weiter und bekommen beim Start den Umzug erklärt (UPGRADE.md).
      DATA_KEY_FILE: /app/schluessel/datenschluessel
      # Nur während eines Wechsels vorhanden (scripts/datenschluessel-wechseln.sh).
      DATA_KEY_ALT_FILE: /app/schluessel/datenschluessel.alt
      # Passkeys der Android-App und /.well-known/assetlinks.json (.env.example).
      PASSKEY_ANDROID_ZERTIFIKATE: ${PASSKEY_ANDROID_ZERTIFIKATE:-}
      PASSKEY_ANDROID_PAKET: ${PASSKEY_ANDROID_PAKET:-}
      # PORT: 3000
      # NODE_ENV: production
      # NODE_OPTIONS: "--max-old-space-size=384"

      # ── Rolle ────────────────────────────────────────────────────────────────
      # Dieser Dienst beantwortet nur Anfragen; die Hintergrundarbeit macht der
      # Dienst `jobs` unten aus demselben Image.
      ROLLE: web

      # ── Datenbank-Verbindung ─────────────────────────────────────────────────
      # Die eigene Rolle ohne Superuser-Rechte (Dienst db-rolle oben); das
      # Passwort des Superusers bekommt die App nicht.
      # PGHOST:     postgres
      # PGPORT:     5432
      PGUSER:     brickinventory_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      # PGDATABASE: brickinventory

      # ── DB-Verbindungspool ───────────────────────────────────────────────────
      # Höchste Zahl gleichzeitiger Verbindungen je Prozess (Vorgabe 15; app
      # und jobs zusammen also 30). Nur setzen, wenn die Postgres-Instanz ein
      # kleines max_connections hat.
      # PG_POOL_MAX: 15
      # PG_POOL_MIN:  2      # Immer warm gehaltene Verbindungen
      # PG_IDLE_MS:   30000  # Idle-Timeout in ms (Standard: 30 s)
      # PG_CONN_MS:   5000   # Verbindungs-Timeout in ms (Standard: 5 s)
      # PG_STMT_MS:   30000  # Max. Query-Laufzeit in ms (Standard: 30 s)
    secrets: [session_secret, db_app_password]

    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/api/v1/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - brickinventory-net
      - db-net

  # ── Hintergrundarbeit ────────────────────────────────────────────────────────
  # Derselbe Bau wie `app`, aber ROLLE=jobs: arbeitet die Auftragstabelle ab
  # (Preise, Bilder, Anleitungen, Importe, Zeitpläne) und nimmt keine Anfragen
  # an. Beim Beenden gibt er laufende Aufträge zurück; der nächste Start setzt
  # sie fort. Die Migrationen macht, wer zuerst startet — der andere wartet.
  jobs:
    # Dasselbe Image wie app (siehe dort).
    image: ${BRICK_IMAGE:?BRICK_IMAGE fehlt in .env - einmal sh scripts/image-pruefen.sh ausfuehren (UPGRADE.md, Abschnitt 42)}
    pull_policy: missing
    container_name: brickinventory-jobs
    logging: *protokoll
    restart: unless-stopped
    init: true
    mem_limit: ${JOBS_MEM_LIMIT:-1g}
    pids_limit: 256
    cpus: ${JOBS_CPUS:-1.5}
    # Dieselben Rechte wie `app` (siehe dort).
    user: brickinv
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    depends_on:
      db-rolle:
        condition: service_completed_successfully
      schluessel:
        condition: service_completed_successfully
      daten-rechte:
        condition: service_completed_successfully
    # Bilder, Anleitungen, PDFs und der Datenschlüssel liegen dort, wo auch
    # `app` sie sucht.
    volumes:
      - ./data:/app/data
      - ./schluessel:/app/schluessel:ro
    environment:
      ROLLE: jobs
      DATA_KEY_FILE: /app/schluessel/datenschluessel
      DATA_KEY_ALT_FILE: /app/schluessel/datenschluessel.alt
      PGUSER: brickinventory_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      # Für Links in Mails (Preisalarm), die der Job-Prozess verschickt.
      APP_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
      # Wer bei `app` DATA_KEY, TZ, ERFASSUNG_ZEITZONE oder PG_* setzt, setzt
      # sie hier gleich. TRUST_PROXY und CA_ZERTIFIKAT braucht er nicht: Er
      # nimmt keine Anfragen an und liefert kein Zertifikat aus.
    secrets: [db_app_password]
    # Lebenszeichen statt HTTP: Der Prozess schreibt alle 30 s eine Datei in /tmp.
    healthcheck:
      test: ["CMD", "node", "-e",
        "const t = require('fs').statSync('/tmp/brickinventory-jobs.lebt').mtimeMs; process.exit(Date.now() - t < 120000 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brickinventory-net
      - db-net

  # ── Caddy — HTTPS vor der App ────────────────────────────────────────────────
  #
  # Drei Wege zum Zertifikat für BRICK_HOST, gewählt beim Start:
  #   • eigene, auf BRICK_HOST beschränkte CA in ./caddy/ca (scripts/ca-einrichten.sh)
  #   • BRICK_TLS=acme: öffentlicher Name mit Let's Encrypt, ohne eigene CA
  #   • CA_OHNE_NAMENSBESCHRAENKUNG=ja: Caddys eigene CA, gilt auf jedem Gerät
  #     für jede Adresse — nur ausdrücklich, nie als stiller Rückfall.
  # Ohne einen davon startet Caddy nicht. Port 80 leitet um und liefert nur
  # /ca.crt im Klartext; den Fingerabdruck nennt das Protokoll zum Abgleich.
  # ── Rechte für Caddy ─────────────────────────────────────────────────────────
  # Caddy läuft ohne root als 10443:10443. Dieser Dienst übergibt ihm bei jedem
  # `up` seine Ordner, das Volume der Wurzel und den Schlüssel der eigenen CA
  # (ca-einrichten.sh legt ihn für root an) und endet.
  caddy-rechte:
    # Das hier gebaute Caddy-Image (siehe caddy): Das offizielle trüge ein
    # zweites, ungeprüftes Caddy-Binary in den Betrieb, obwohl hier nur chown läuft.
    # `never`: Gebaut wird es mit caddy im selben `up`, nie aus einem Register geholt.
    image: brickinventory-caddy:2.11.8
    pull_policy: never
    container_name: brickinventory-caddy-rechte
    logging: *protokoll
    restart: "no"
    user: root
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    read_only: true
    mem_limit: 64m
    pids_limit: 16
    cpus: 0.5
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        chown -R 10443:10443 /data /config /ca-wurzel
        chown 10443:10443 /ca-eigen
        if [ -e /ca-eigen/zwischen.key ]; then chown 10443:10443 /ca-eigen/zwischen.key; fi
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/ca:/ca-eigen
      - ca-wurzel:/ca-wurzel

  caddy:
    # Hier gebaut (Dockerfile.caddy: offizielle Basis per Digest, go-jose
    # nachgezogen); der erste `up` nach einem Update baut einige Minuten.
    image: brickinventory-caddy:2.11.8
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: brickinventory-caddy
    logging: *protokoll
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    pids_limit: 128
    cpus: ${CADDY_CPUS:-1}
    # Ohne root und ohne jede Capability: Die Ports 80 und 443 gibt die
    # Netz-Einstellung des Containers frei, nicht ein Recht des Prozesses.
    # Die Ordner übergibt ihm caddy-rechte (oben).
    user: "10443:10443"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      app:
        condition: service_started
      caddy-rechte:
        condition: service_completed_successfully
    # Nur root.crt verlässt Caddy: Die Schleife kopiert es in das Volume
    # ca-wurzel, das die App nur lesend sieht. Ein Datei-Mount von root.crt
    # taugt nicht — fehlt die Datei beim ersten Start, legt Docker an ihrer
    # Stelle ein Verzeichnis an, und Caddy kann seine CA nicht schreiben.
    # Der Aussteller wird hier gewählt: Ohne BRICK_TLS_AUSSTELLER ist das
    # Caddyfile ungültig, ein Start an diesem Skript vorbei fällt also nicht
    # still auf Caddys unbeschränkte CA zurück.
    command:
      - sh
      - -c
      - |
        q=
        if [ -s /ca-eigen/zwischen.key ]; then
          q=/ca-eigen/root.crt
          export BRICK_TLS_AUSSTELLER=internal BRICK_TLS_OPTIONEN='ca local'
          export BRICK_CA_EIGEN="$$(printf 'root {\ncert /ca-eigen/root.crt\n}\nintermediate {\ncert /ca-eigen/zwischen-kette.crt\nkey /ca-eigen/zwischen.key\n}')"
        elif [ "$${BRICK_TLS:-}" = acme ]; then
          case "$${ACME_EMAIL:-}" in
            *[!A-Za-z0-9@._+-]*) echo "[caddy] FEHLER: ACME_EMAIL enthält unerlaubte Zeichen." >&2; exit 1 ;;
          esac
          export BRICK_TLS_AUSSTELLER=acme BRICK_TLS_OPTIONEN="$${ACME_EMAIL:+email $$ACME_EMAIL}"
          # Eine Wurzel aus der Zeit davor gäbe die App sonst weiter als /ca.crt aus.
          rm -f /ca-wurzel/root.crt
        elif [ "$${CA_OHNE_NAMENSBESCHRAENKUNG:-}" = ja ]; then
          q=/data/caddy/pki/authorities/local/root.crt
          export BRICK_TLS_AUSSTELLER=internal BRICK_TLS_OPTIONEN=sign_with_root
          echo "[caddy] WARNUNG: Caddys eigene CA ohne Namensbeschränkung (CA_OHNE_NAMENSBESCHRAENKUNG=ja)." >&2
          echo "[caddy]   Jedes Gerät mit dieser Wurzel traut ihr für JEDE Adresse. Besser: sudo sh scripts/ca-einrichten.sh" >&2
        else
          echo "[caddy] FEHLER: keine eigene, auf BRICK_HOST beschränkte CA in ./caddy/ca." >&2
          echo "[caddy]   Einrichten: sudo sh scripts/ca-einrichten.sh (UPGRADE.md, Abschnitt 33)." >&2
          echo "[caddy]   Öffentlicher Name mit Let's Encrypt: BRICK_TLS=acme in .env." >&2
          echo "[caddy]   Caddys unbeschränkte CA nur ausdrücklich: CA_OHNE_NAMENSBESCHRAENKUNG=ja in .env." >&2
          exit 1
        fi
        if [ -n "$$q" ]; then
          gemeldet=
          while :; do
            if [ -f "$$q" ] && ! cmp -s "$$q" /ca-wurzel/root.crt; then
              cp "$$q" /ca-wurzel/root.crt.neu && chmod 644 /ca-wurzel/root.crt.neu && mv /ca-wurzel/root.crt.neu /ca-wurzel/root.crt
            fi
            if [ -f "$$q" ] && [ "$$gemeldet" != "$$(cksum < "$$q")" ]; then
              gemeldet=$$(cksum < "$$q")
              fp=$$(sed -n '/-BEGIN/,/-END/p' "$$q" | sed '1d;$$d' | base64 -d | sha256sum | cut -c1-64 | tr a-f A-F | sed 's/../&:/g;s/:$$//')
              echo "[caddy] Wurzel für /ca.crt, SHA-256-Fingerabdruck zum Abgleich auf dem Gerät: $$fp"
            fi
            sleep 5
          done &
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      BRICK_HOST: ${BRICK_HOST:?BRICK_HOST in .env setzen (Name oder IP des Servers) - siehe UPGRADE.md}
      BRICK_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
      BRICK_TLS: ${BRICK_TLS:-intern}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CA_OHNE_NAMENSBESCHRAENKUNG: ${CA_OHNE_NAMENSBESCHRAENKUNG:-nein}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${HTTPS_BIND:-0.0.0.0}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # CA (Wurzel und Schlüssel) und Zertifikate. Mitsichern: Geht die CA
      # verloren, muss jedes Gerät das neue Wurzelzertifikat bekommen.
      - ./caddy/data:/data
      # Die eigene, auf BRICK_HOST beschränkte CA, falls eingerichtet.
      - ./caddy/ca:/ca-eigen:ro
      - ./caddy/config:/config
      - ca-wurzel:/ca-wurzel
    networks:
      brickinventory-net:
        # Genau diese Adresse steht in TRUST_PROXY der App.
        ipv4_address: 172.28.73.10

volumes:
  # Allein das Wurzelzertifikat der CA, von Caddy geschrieben, von der App gelesen.
  ca-wurzel:

# Geheimnisse als Dateien unter /run/secrets/ statt als Umgebungsvariablen.
# Anlegen (und aus einer alten .env übernehmen): sh scripts/geheimnisse-einrichten.sh.
# Der Ordner ist nur für seinen Besitzer offen (700); die Dateien selbst sind
# lesbar (444) wie Docker-Secrets im Swarm, damit die Dienste sie ohne root lesen.
secrets:
  session_secret:
    file: ./geheimnisse/session_secret
  db_password:
    file: ./geheimnisse/db_password
  db_app_password:
    file: ./geheimnisse/db_app_password
  pgweb_db_password:
    file: ./geheimnisse/pgweb_db_password

networks:
  # Festes Netz: Ein Reverse-Proxy davor bekommt darin eine feste Adresse
  # (ipv4_address: 172.28.73.10), und TRUST_PROXY nennt genau diese. Ein
  # ganzes Docker-Netz zu vertrauen liesse jeden Container darin Adressen fälschen.
  brickinventory-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.73.0/24
  # Nur postgres, db-rolle, app und jobs, ohne Weg nach draussen: Die Datenbank
  # braucht keinen, und ein Fehler in ihr erreicht so kein fremdes Ziel.
  db-net:
    driver: bridge
    internal: true
