# ════════════════════════════════════════════════════════════════════════════════
# BrickInventory Manager — Docker Compose
#
# Alle Standardwerte sind im Dockerfile gesetzt und müssen hier nicht wiederholt
# werden. Nur was du anpassen möchtest, muss hier stehen.
#
# Start:
#   docker compose up -d --build
#
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Datenbank ─────────────────────────────────────────────────────
  postgres:
    # PostgreSQL 18.
    #
    # ⚠️  ACHTUNG BEIM UPDATE VON 16: Ein blosser Tausch des Tags reicht NICHT
    # und schlägt mit einer Fehlermeldung fehl. Ab Version 18 legt das offizielle
    # Image seine Daten in einem versionsspezifischen Unterverzeichnis ab
    # (/var/lib/postgresql/18/docker), und der Mount-Punkt ist deshalb das
    # ELTERNVERZEICHNIS /var/lib/postgresql statt wie bisher .../data.
    # Das Datenformat einer Hauptversion ist ausserdem nie direkt lesbar.
    #
    # Der Weg von 16 auf 18 steht Schritt für Schritt in UPGRADE.md unter
    # "PostgreSQL 18". Kurz: pg_dumpall mit dem ALTEN Container, neues
    # Verzeichnis, einspielen. Das alte ./pgdata bleibt dabei unangetastet und
    # ist die Rückfallebene.
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: brickinventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       brickinventory
      POSTGRES_USER:     brickinventory
      # Pflicht: DB_PASSWORD in .env (z. B. `openssl rand -base64 24`). Eine
      # bestehende Datenbank behält ihr Passwort; das alte Beispielpasswort
      # weist der Server beim Start ab (UPGRADE.md, Abschnitt 13).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen - siehe UPGRADE.md}
    command: postgres -c max_connections=200 -c shared_buffers=128MB
    # Der Entrypoint des Images läuft als root: Er legt $PGDATA an (chmod 700),
    # richtet die Eigentümer per find/chown und wechselt mit gosu zu postgres.
    # Genau dafür reichen diese fünf; der Server selbst läuft ohne.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    volumes:
      # Neuer Pfad UND neues Verzeichnis: ./pgdata (Version 16) bleibt liegen,
      # damit ein Rückfall auf die alte compose.yaml jederzeit möglich ist.
      - ./pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickinventory -d brickinventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - brickinventory-net

  # ── BrickInventory Manager App ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brickinventory-app
    restart: unless-stopped
    # Kleiner init-Prozess als PID 1: reicht Signale weiter und räumt
    # verwaiste Kindprozesse (Bildwerkzeuge, PDF) ab.
    init: true
    # docker-entrypoint.sh läuft als root und braucht genau vier Rechte:
    # mkdir/Marke im Datenordner, der brickinv gehört (DAC_OVERRIDE), chown
    # (CHOWN) und den Wechsel zu brickinv per su-exec (SETUID, SETGID). Der
    # Server danach läuft ohne. Schreiben darf er nur in ./data und /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    # Kein veröffentlichter Port: Von aussen geht es nur über Caddy (HTTPS).
    #
    # BEWUSSTE AUSNAHME Klartext (z. B. ohne Namen/IP für Caddy, zum Testen):
    # die drei Zeilen einkommentieren und in .env COOKIE_SECURE=0 und
    # APP_BASE_URL=http://… setzen. Passwort, Sitzung und App-Token gehen dann
    # lesbar durchs LAN; „unbegrenzt“ beim QR-Code und Passkeys gibt es dann
    # nicht (README.md, „Ohne HTTPS“).
    # ports:
    #   - "${APP_BIND:-127.0.0.1}:3000:3000"
    volumes:
      # EIN Volume genügt. Set-, Teile- und Minifiguren-Bilder liegen unter
      # data/images/ (siehe utils/appPaths.ts) und sind damit von ./data
      # miterfasst — inklusive der Vorschaubilder, die als <name>_thumb.jpg
      # NEBEN dem Original liegen, nicht in einem eigenen Unterordner.
      #
      # VORHER stand hier zusätzlich `- ./images:/app/public/images/sets`.
      # Das war der alte Ablageort. Der Code schreibt dort längst nicht mehr
      # hin, die Zeile blieb aber stehen — Ergebnis: ein Ordner ./images neben
      # ./data, der nach der einmaligen Migration leer zurückbleibt und nur
      # noch verwirrt. Ausserdem mountete er in public/, das seit dem
      # dist/-Umbau wieder reiner, unveränderlicher Build-Inhalt sein soll.
      #
      # Wer ./images noch aus einer älteren Installation hat: siehe UPGRADE.md,
      # Abschnitt 10 — die Dateien einmal von Hand nach ./data/images/sets/
      # verschieben, danach kann der Ordner weg.
      - ./data:/app/data
      # Caddys CA, nur lesend. Der Entrypoint kopiert daraus allein das
      # öffentliche Wurzelzertifikat nach CA_ZERTIFIKAT; die Schlüssel daneben
      # sind nur für root lesbar, der Server läuft als brickinv.
      - ./caddy/data/caddy/pki/authorities/local:/caddy-ca:ro
    environment:

      # ── PFLICHT: in .env setzen (Vorlage: .env.example) ──────────────────────
      # Eigenen Zufallswert, z. B.:  openssl rand -base64 48
      # Ohne Wert startet Compose nicht; der Server verweigert einen Wert unter
      # 32 Zeichen.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET in .env setzen, siehe .env.example}

      # ── App ──────────────────────────────────────────────────────────────────
      # Adresse, unter der der Server von aussen erreichbar ist: Mails, QR-Code,
      # Passkeys. Ohne Angabe https://BRICK_HOST — die Adresse von Caddy.
      APP_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
      # Wem X-Forwarded-For und X-Forwarded-Proto geglaubt wird: genau Caddy
      # (feste Adresse unten). Erst damit weiss der Server, dass die Anfrage
      # über TLS kam (Cookie mit Secure, HSTS).
      TRUST_PROXY: ${TRUST_PROXY:-172.28.73.10}
      # Das Wurzelzertifikat der CA (kopiert vom Entrypoint) für /ca.crt und
      # den Fingerabdruck im QR-Code.
      CA_ZERTIFIKAT: /tmp/ca/root.crt
      # PORT: 3000
      # NODE_ENV: production
      # NODE_OPTIONS: "--max-old-space-size=384"

      # ── Cluster / Worker ─────────────────────────────────────────────────────
      # Anzahl paralleler Node.js-Prozesse.
      # 0 = automatisch (Anzahl CPU-Kerne, mind. 2) — empfohlen für Produktion.
      # 1 = kein Clustering (nützlich zum Debuggen oder auf schwacher Hardware).
      WEB_WORKERS: 0

      # ── Datenbank-Verbindung ─────────────────────────────────────────────────
      # PGHOST:     postgres
      # PGPORT:     5432
      # PGUSER:     brickinventory
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen - siehe UPGRADE.md}
      # PGDATABASE: brickinventory

      # ── DB-Verbindungspool ───────────────────────────────────────────────────
      # Maximale gleichzeitige DB-Verbindungen pro Worker-Prozess.
      # Gesamtverbindungen = PG_POOL_MAX × WEB_WORKERS (oder CPU-Kerne).
      # Beispiel: 4 Worker × 20 = 80 Verbindungen — PostgreSQL max_connections
      # prüfen (Standard: 100). Bei Bedarf PG_POOL_MAX reduzieren.
      # PG_POOL_MAX bewusst nicht gesetzt: db/database.ts rechnet
      # min(15, 80 / Anzahl Worker) selbst aus. Nur setzen, wenn die Postgres-
      # Instanz ein abweichendes max_connections hat.
      # PG_POOL_MAX: 20
      # PG_POOL_MIN:  2      # Immer warm gehaltene Verbindungen
      # PG_IDLE_MS:   30000  # Idle-Timeout in ms (Standard: 30 s)
      # PG_CONN_MS:   5000   # Verbindungs-Timeout in ms (Standard: 5 s)
      # PG_STMT_MS:   30000  # Max. Query-Laufzeit in ms (Standard: 30 s)

    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - brickinventory-net

  # ── Caddy — HTTPS vor der App ────────────────────────────────────────────────
  #
  # TLS mit eigener CA (`tls internal`) für BRICK_HOST aus .env, einen Namen
  # (nas.local) oder eine IP-Adresse. Port 443 für HTTPS, Port 80 leitet um und
  # liefert nur /ca.crt im Klartext. Das Wurzelzertifikat liegt danach unter
  # ./caddy/data/caddy/pki/authorities/local/root.crt und kommt auf die Geräte
  # (UPGRADE.md, Abschnitt 14).
  caddy:
    # Fest per Digest wie pgweb; Renovate schlägt neue Fassungen vor.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: brickinventory-caddy
    restart: unless-stopped
    # Caddy läuft als root im Container und braucht nur die Ports unter 1024.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - app
    environment:
      BRICK_HOST: ${BRICK_HOST:?BRICK_HOST in .env setzen (Name oder IP des Servers) - siehe UPGRADE.md}
      BRICK_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${HTTPS_BIND:-0.0.0.0}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # CA (Wurzel und Schlüssel) und Zertifikate. Mitsichern: Geht die CA
      # verloren, muss jedes Gerät das neue Wurzelzertifikat bekommen.
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      brickinventory-net:
        # Genau diese Adresse steht in TRUST_PROXY der App.
        ipv4_address: 172.28.73.10

  # ── pgweb — Datenbank im Browser ansehen (OPTIONAL) ──────────────────────────
  #
  # Start NUR auf Anforderung:
  #     docker compose --profile tools up -d pgweb
  # Danach im Browser:  http://localhost:8081
  # Wieder abschalten:  docker compose --profile tools down pgweb
  #
  # Warum ein Profil? Ohne `--profile tools` startet dieser Dienst NICHT mit —
  # `docker compose up -d` bringt weiterhin nur Datenbank und App hoch. Ein
  # Werkzeug, das man dreimal im Jahr braucht, soll nicht dauerhaft mitlaufen.
  #
  # ⚠️  SICHERHEIT — der wichtigste Punkt an diesem Dienst:
  # pgweb bringt KEINE Anmeldung mit. Wer die Seite erreicht, hat vollen Zugriff
  # auf die Datenbank: alle Konten, alle Sitzungen, alle Daten — und kann sie
  # ändern. Deshalb:
  #   • Die Portangabe beginnt mit 127.0.0.1 — damit ist der Dienst NUR auf dem
  #     Server selbst erreichbar, nicht aus dem Netz. Ein blosses "8081:8081"
  #     würde ihn an alle Schnittstellen binden und wäre je nach Router von
  #     aussen offen. Diese Bindung bitte nicht ändern.
  #   • Von einem anderen Rechner aus per SSH-Tunnel arbeiten:
  #         ssh -L 8081:127.0.0.1:8081 <benutzer>@<server>
  #     Dann im lokalen Browser http://localhost:8081 öffnen.
  #   • Nach getaner Arbeit wieder herunterfahren (Befehl oben).
  pgweb:
    # Fest per Digest: Ein Werkzeug mit Zugang zur ganzen Datenbank soll nicht
    # unbemerkt durch ein umgehängtes Tag ersetzt werden.
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    container_name: brickinventory-pgweb
    # Ein Webserver auf Port 8081 braucht keine Capability.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    profiles: ["tools"]
    restart: "no"          # bewusst nicht "unless-stopped": Werkzeug auf Zeit
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dieselben Zugangsdaten wie oben beim Dienst `postgres`. Wer sie dort
      # ändert, muss sie hier mitändern — der Verbindungsstring ist die einzige
      # Stelle, an der pgweb sie erfährt.
      PGWEB_DATABASE_URL: postgres://brickinventory:${DB_PASSWORD:?DB_PASSWORD in .env setzen - siehe UPGRADE.md}@postgres:5432/brickinventory?sslmode=disable
    # --readonly erlaubt ausschliesslich lesende Abfragen. Zum Nachsehen ist
    # das die richtige Voreinstellung; für Reparaturen die Zeile auskommentieren
    # und den Dienst neu starten. Lieber bewusst freischalten als versehentlich
    # ein UPDATE ohne WHERE absetzen.
    command: ["--bind=0.0.0.0", "--listen=8081", "--readonly"]
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - brickinventory-net

networks:
  # Festes Netz: Ein Reverse-Proxy davor bekommt darin eine feste Adresse
  # (ipv4_address: 172.28.73.10), und TRUST_PROXY nennt genau diese. Ein
  # ganzes Docker-Netz zu vertrauen liesse jeden Container darin Adressen fälschen.
  brickinventory-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.73.0/24
