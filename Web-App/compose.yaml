# ════════════════════════════════════════════════════════════════════════════════
# BrickInventory Manager — Docker Compose
#
# Alle Standardwerte sind im Dockerfile gesetzt und müssen hier nicht wiederholt
# werden. Nur was du anpassen möchtest, muss hier stehen.
#
# Start:
#   docker compose up -d --build
#
# Ressourcengrenzen (mem_limit, pids_limit, cpus) je Dienst: Ein Fehler in
# einer nativen Bibliothek (sharp, pdf-lib) oder eine Flut von Anfragen soll
# einen Container füllen, nicht den ganzen Rechner. NODE_OPTIONS begrenzt nur
# den JavaScript-Heap, nicht den Speicher von sharp. Die Vorgaben passen auf
# einen Raspberry Pi 4 mit 4 GB; auf einem kleineren Gerät oder bei grossen
# Sammlungen in .env anpassen (APP_MEM_LIMIT, JOBS_MEM_LIMIT, DB_MEM_LIMIT …,
# UPGRADE.md, Runde 7). Wer an eine Grenze stösst, sieht im Protokoll
# „OOMKilled" (docker inspect) bzw. „Resource temporarily unavailable".
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Datenbank ─────────────────────────────────────────────────────
  postgres:
    # PostgreSQL 18.
    #
    # ⚠️  ACHTUNG BEIM UPDATE VON 16: Ein blosser Tausch des Tags reicht NICHT
    # und schlägt mit einer Fehlermeldung fehl. Ab Version 18 legt das offizielle
    # Image seine Daten in einem versionsspezifischen Unterverzeichnis ab
    # (/var/lib/postgresql/18/docker), und der Mount-Punkt ist deshalb das
    # ELTERNVERZEICHNIS /var/lib/postgresql statt wie bisher .../data.
    # Das Datenformat einer Hauptversion ist ausserdem nie direkt lesbar.
    #
    # Der Weg von 16 auf 18 steht Schritt für Schritt in UPGRADE.md unter
    # "PostgreSQL 18". Kurz: pg_dumpall mit dem ALTEN Container, neues
    # Verzeichnis, einspielen. Das alte ./pgdata bleibt dabei unangetastet und
    # ist die Rückfallebene.
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: brickinventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       brickinventory
      POSTGRES_USER:     brickinventory
      # Pflicht: DB_PASSWORD in .env (z. B. `openssl rand -base64 24`). Eine
      # bestehende Datenbank behält ihr Passwort; das alte Beispielpasswort
      # weist der Server beim Start ab (UPGRADE.md, Abschnitt 13).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen - siehe UPGRADE.md}
      # Für postgres/app-rolle.sh beim Anlegen einer neuen Datenbank.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD in .env setzen - siehe UPGRADE.md}
    command: postgres -c max_connections=200 -c shared_buffers=128MB
    # Ein Prozess je Verbindung: 200 Verbindungen plus Hintergrundprozesse.
    mem_limit: ${DB_MEM_LIMIT:-1g}
    pids_limit: 300
    cpus: ${DB_CPUS:-2}
    # Der Entrypoint des Images läuft als root: Er legt $PGDATA an (chmod 700),
    # richtet die Eigentümer per find/chown und wechselt mit gosu zu postgres.
    # Genau dafür reichen diese fünf; der Server selbst läuft ohne.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    volumes:
      # Neuer Pfad UND neues Verzeichnis: ./pgdata (Version 16) bleibt liegen,
      # damit ein Rückfall auf die alte compose.yaml jederzeit möglich ist.
      - ./pgdata18:/var/lib/postgresql
      - ./postgres/app-rolle.sh:/docker-entrypoint-initdb.d/10-app-rolle.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickinventory -d brickinventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - brickinventory-net

  # ── Datenbankrolle der App ───────────────────────────────────────────────────
  # `brickinventory` ist der Superuser der Datenbank. App, Jobs und pgweb
  # verbinden sich als `brickinventory_app` ohne Superuser-Rechte, der Datenbank
  # und Tabellen gehören. Dieser Dienst legt die Rolle bei jedem `up` an bzw.
  # richtet sie nach und endet dann (UPGRADE.md, Abschnitt 29).
  db-rolle:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: brickinventory-db-rolle
    restart: "no"
    user: postgres
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/rolle/app-rolle.sh"]
    mem_limit: 128m
    pids_limit: 32
    cpus: 0.5
    environment:
      PGHOST: postgres
      PGUSER: brickinventory
      PGDATABASE: brickinventory
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen - siehe UPGRADE.md}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD in .env setzen - siehe UPGRADE.md}
      # Leserolle brickinventory_lesen für pgweb; leer = Rolle ohne Anmeldung.
      PGWEB_DB_PASSWORD: ${PGWEB_DB_PASSWORD:-}
    volumes:
      - ./postgres/app-rolle.sh:/rolle/app-rolle.sh:ro
    networks:
      - brickinventory-net

  # ── Datenschlüssel anlegen ───────────────────────────────────────────────────
  # Legt ./schluessel/datenschluessel beim ersten Start an (32 Zufallsbyte,
  # base64, nur für brickinv lesbar) und endet. app und jobs sehen den Ordner
  # danach nur lesend. Liegt noch ein alter Schlüssel in data/.datenschluessel,
  # legt er keinen neuen an: Der Server meldet dann den Umzug (UPGRADE.md).
  schluessel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brickinventory-schluessel
    restart: "no"
    user: root
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    mem_limit: 64m
    pids_limit: 16
    cpus: 0.5
    entrypoint: ["sh", "/app/schluessel-anlegen.sh"]
    volumes:
      - ./schluessel:/app/schluessel
      - ./data:/app/data:ro

  # ── BrickInventory Manager App ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brickinventory-app
    restart: unless-stopped
    # Kleiner init-Prozess als PID 1: reicht Signale weiter und räumt
    # verwaiste Kindprozesse (Bildwerkzeuge, PDF) ab.
    init: true
    # Heap 384 MB (Dockerfile) plus sharp, PDF und Puffer.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    pids_limit: 256
    cpus: ${APP_CPUS:-2}
    # docker-entrypoint.sh läuft als root und braucht genau vier Rechte:
    # mkdir/Marke im Datenordner, der brickinv gehört (DAC_OVERRIDE), chown
    # (CHOWN) und den Wechsel zu brickinv per su-exec (SETUID, SETGID). Der
    # Server danach läuft ohne. Schreiben darf er nur in ./data und /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db-rolle:
        condition: service_completed_successfully
      schluessel:
        condition: service_completed_successfully
    # Kein veröffentlichter Port: Von aussen geht es nur über Caddy (HTTPS).
    #
    # BEWUSSTE AUSNAHME Klartext (z. B. ohne Namen/IP für Caddy, zum Testen):
    # die drei Zeilen einkommentieren und in .env COOKIE_SECURE=0 und
    # APP_BASE_URL=http://… setzen. Passwort, Sitzung und App-Token gehen dann
    # lesbar durchs LAN; „unbegrenzt“ beim QR-Code und Passkeys gibt es dann
    # nicht (README.md, „Ohne HTTPS“).
    # ports:
    #   - "${APP_BIND:-127.0.0.1}:3000:3000"
    volumes:
      # EIN Volume genügt. Set-, Teile- und Minifiguren-Bilder liegen unter
      # data/images/ (siehe src/infra/appPaths.ts) und sind damit von ./data
      # miterfasst — inklusive der Vorschaubilder, die als <name>_thumb.jpg
      # NEBEN dem Original liegen, nicht in einem eigenen Unterordner.
      #
      # VORHER stand hier zusätzlich `- ./images:/app/public/images/sets`.
      # Das war der alte Ablageort. Der Code schreibt dort längst nicht mehr
      # hin, die Zeile blieb aber stehen — Ergebnis: ein Ordner ./images neben
      # ./data, der nach der einmaligen Migration leer zurückbleibt und nur
      # noch verwirrt. Ausserdem mountete er in public/, das seit dem
      # dist/-Umbau wieder reiner, unveränderlicher Build-Inhalt sein soll.
      #
      # Wer ./images noch aus einer älteren Installation hat: siehe UPGRADE.md,
      # Abschnitt 10 — die Dateien einmal von Hand nach ./data/images/sets/
      # verschieben, danach kann der Ordner weg.
      - ./data:/app/data
      # Der Datenschlüssel für gespeicherte Geheimnisse, getrennt von ./data:
      # Eine Sicherung von data/ (scripts/backup.sh) enthält ihn so nie. Nur
      # lesend: Angelegt wird er vom Dienst `schluessel`, ein Fehler im Server
      # kann ihn so nicht überschreiben.
      - ./schluessel:/app/schluessel:ro
      # Nur das öffentliche Wurzelzertifikat, das Caddy hineinkopiert (siehe
      # dort); Caddys Ordner mit dem Schlüssel der CA sieht die App nicht.
      - ca-wurzel:/caddy-ca:ro
    environment:

      # ── PFLICHT: in .env setzen (Vorlage: .env.example) ──────────────────────
      # Eigenen Zufallswert, z. B.:  openssl rand -base64 48
      # Ohne Wert startet Compose nicht; der Server verweigert einen Wert unter
      # 32 Zeichen.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET in .env setzen, siehe .env.example}

      # ── App ──────────────────────────────────────────────────────────────────
      # Adresse, unter der der Server von aussen erreichbar ist: Mails, QR-Code,
      # Passkeys. Ohne Angabe https://BRICK_HOST — die Adresse von Caddy.
      APP_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
      # Wem X-Forwarded-For und X-Forwarded-Proto geglaubt wird: genau Caddy
      # (feste Adresse unten). Erst damit weiss der Server, dass die Anfrage
      # über TLS kam (Cookie mit Secure, HSTS).
      TRUST_PROXY: ${TRUST_PROXY:-172.28.73.10}
      # Das Wurzelzertifikat der CA für /ca.crt und den Fingerabdruck im QR-Code.
      CA_ZERTIFIKAT: /caddy-ca/root.crt
      # Legt der erste Start an. Ältere Installationen mit data/.datenschluessel
      # laufen weiter und bekommen beim Start den Umzug erklärt (UPGRADE.md).
      DATA_KEY_FILE: /app/schluessel/datenschluessel
      # Passkeys der Android-App und /.well-known/assetlinks.json (.env.example).
      PASSKEY_ANDROID_ZERTIFIKATE: ${PASSKEY_ANDROID_ZERTIFIKATE:-}
      PASSKEY_ANDROID_PAKET: ${PASSKEY_ANDROID_PAKET:-}
      # PORT: 3000
      # NODE_ENV: production
      # NODE_OPTIONS: "--max-old-space-size=384"

      # ── Rolle ────────────────────────────────────────────────────────────────
      # Dieser Dienst beantwortet nur Anfragen; die Hintergrundarbeit macht der
      # Dienst `jobs` unten aus demselben Image.
      ROLLE: web

      # ── Datenbank-Verbindung ─────────────────────────────────────────────────
      # Die eigene Rolle ohne Superuser-Rechte (Dienst db-rolle oben); das
      # Passwort des Superusers bekommt die App nicht.
      # PGHOST:     postgres
      # PGPORT:     5432
      PGUSER:     brickinventory_app
      PGPASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD in .env setzen - siehe UPGRADE.md}
      # PGDATABASE: brickinventory

      # ── DB-Verbindungspool ───────────────────────────────────────────────────
      # Höchste Zahl gleichzeitiger Verbindungen je Prozess (Vorgabe 15; app
      # und jobs zusammen also 30). Nur setzen, wenn die Postgres-Instanz ein
      # kleines max_connections hat.
      # PG_POOL_MAX: 15
      # PG_POOL_MIN:  2      # Immer warm gehaltene Verbindungen
      # PG_IDLE_MS:   30000  # Idle-Timeout in ms (Standard: 30 s)
      # PG_CONN_MS:   5000   # Verbindungs-Timeout in ms (Standard: 5 s)
      # PG_STMT_MS:   30000  # Max. Query-Laufzeit in ms (Standard: 30 s)

    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/api/v1/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - brickinventory-net

  # ── Hintergrundarbeit ────────────────────────────────────────────────────────
  # Derselbe Bau wie `app`, aber ROLLE=jobs: arbeitet die Auftragstabelle ab
  # (Preise, Bilder, Anleitungen, Importe, Zeitpläne) und nimmt keine Anfragen
  # an. Beim Beenden gibt er laufende Aufträge zurück; der nächste Start setzt
  # sie fort. Die Migrationen macht, wer zuerst startet — der andere wartet.
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brickinventory-jobs
    restart: unless-stopped
    init: true
    mem_limit: ${JOBS_MEM_LIMIT:-1g}
    pids_limit: 256
    cpus: ${JOBS_CPUS:-1.5}
    # Dieselben Rechte wie `app` (siehe dort): der Entrypoint richtet ./data ein.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db-rolle:
        condition: service_completed_successfully
      schluessel:
        condition: service_completed_successfully
    # Bilder, Anleitungen, PDFs und der Datenschlüssel liegen dort, wo auch
    # `app` sie sucht.
    volumes:
      - ./data:/app/data
      - ./schluessel:/app/schluessel:ro
    environment:
      ROLLE: jobs
      DATA_KEY_FILE: /app/schluessel/datenschluessel
      PGUSER: brickinventory_app
      PGPASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD in .env setzen - siehe UPGRADE.md}
      # Für Links in Mails (Preisalarm), die der Job-Prozess verschickt.
      APP_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
      # Wer bei `app` DATA_KEY, TZ, ERFASSUNG_ZEITZONE oder PG_* setzt, setzt
      # sie hier gleich. TRUST_PROXY und CA_ZERTIFIKAT braucht er nicht: Er
      # nimmt keine Anfragen an und liefert kein Zertifikat aus.
    # Lebenszeichen statt HTTP: Der Prozess schreibt alle 30 s eine Datei in /tmp.
    healthcheck:
      test: ["CMD", "node", "-e",
        "const t = require('fs').statSync('/tmp/brickinventory-jobs.lebt').mtimeMs; process.exit(Date.now() - t < 120000 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brickinventory-net

  # ── Caddy — HTTPS vor der App ────────────────────────────────────────────────
  #
  # TLS mit eigener CA (`tls internal`) für BRICK_HOST aus .env, einen Namen
  # (nas.local) oder eine IP-Adresse. Port 443 für HTTPS, Port 80 leitet um und
  # liefert nur /ca.crt im Klartext. Das Wurzelzertifikat liegt danach unter
  # ./caddy/data/caddy/pki/authorities/local/root.crt und kommt auf die Geräte
  # (UPGRADE.md, Abschnitt 14).
  caddy:
    # Fest per Digest wie pgweb; Renovate (docker-compose) schlägt neue Fassungen vor.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: brickinventory-caddy
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    pids_limit: 128
    cpus: ${CADDY_CPUS:-1}
    # Caddy läuft als root im Container und braucht nur die Ports unter 1024.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - app
    # Nur root.crt verlässt Caddy: Die Schleife kopiert es in das Volume
    # ca-wurzel, das die App nur lesend sieht. Ein Datei-Mount von root.crt
    # taugt nicht — fehlt die Datei beim ersten Start, legt Docker an ihrer
    # Stelle ein Verzeichnis an, und Caddy kann seine CA nicht schreiben.
    # Liegt in ./caddy/ca eine eigene CA (scripts/ca-einrichten.sh), signiert
    # deren Zwischenstelle; den Schlüssel der Wurzel hat Caddy dann nicht.
    command:
      - sh
      - -c
      - |
        q=/data/caddy/pki/authorities/local/root.crt
        if [ -s /ca-eigen/zwischen.key ]; then
          q=/ca-eigen/root.crt
          export BRICK_CA_SIGNIEREN='ca local'
          export BRICK_CA_EIGEN="$$(printf 'root {\ncert /ca-eigen/root.crt\n}\nintermediate {\ncert /ca-eigen/zwischen-kette.crt\nkey /ca-eigen/zwischen.key\n}')"
        fi
        while :; do
          if [ -f "$$q" ] && ! cmp -s "$$q" /ca-wurzel/root.crt; then
            cp "$$q" /ca-wurzel/root.crt.neu && chmod 644 /ca-wurzel/root.crt.neu && mv /ca-wurzel/root.crt.neu /ca-wurzel/root.crt
          fi
          sleep 5
        done &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      BRICK_HOST: ${BRICK_HOST:?BRICK_HOST in .env setzen (Name oder IP des Servers) - siehe UPGRADE.md}
      BRICK_BASE_URL: ${APP_BASE_URL:-https://${BRICK_HOST}}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${HTTPS_BIND:-0.0.0.0}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # CA (Wurzel und Schlüssel) und Zertifikate. Mitsichern: Geht die CA
      # verloren, muss jedes Gerät das neue Wurzelzertifikat bekommen.
      - ./caddy/data:/data
      # Die eigene, auf BRICK_HOST beschränkte CA, falls eingerichtet.
      - ./caddy/ca:/ca-eigen:ro
      - ./caddy/config:/config
      - ca-wurzel:/ca-wurzel
    networks:
      brickinventory-net:
        # Genau diese Adresse steht in TRUST_PROXY der App.
        ipv4_address: 172.28.73.10

  # ── pgweb — Datenbank im Browser ansehen (OPTIONAL) ──────────────────────────
  #
  # Start NUR auf Anforderung:
  #     docker compose --profile tools up -d pgweb
  # Danach im Browser:  http://localhost:8081
  # Wieder abschalten:  docker compose --profile tools down pgweb
  #
  # Warum ein Profil? Ohne `--profile tools` startet dieser Dienst NICHT mit —
  # `docker compose up -d` bringt weiterhin nur Datenbank und App hoch. Ein
  # Werkzeug, das man dreimal im Jahr braucht, soll nicht dauerhaft mitlaufen.
  #
  # ⚠️  SICHERHEIT — der wichtigste Punkt an diesem Dienst:
  # Wer pgweb erreicht und anmeldet, liest fast die ganze Datenbank: alle
  # Konten und Daten, nur Passwort-Hashes, Tokens, Sitzungen und Schlüssel
  # nicht (Rolle brickinventory_lesen, postgres/app-rolle.sh). Deshalb eine
  # Anmeldung (PGWEB_USER, Vorgabe „pgweb", PGWEB_PASSWORD und
  # PGWEB_DB_PASSWORD in .env — ohne beide startet der Dienst nicht) und:
  #   • Die Portangabe beginnt mit 127.0.0.1 — damit ist der Dienst NUR auf dem
  #     Server selbst erreichbar, nicht aus dem Netz. Ein blosses "8081:8081"
  #     würde ihn an alle Schnittstellen binden und wäre je nach Router von
  #     aussen offen. Diese Bindung bitte nicht ändern.
  #   • Von einem anderen Rechner aus per SSH-Tunnel arbeiten:
  #         ssh -L 8081:127.0.0.1:8081 <benutzer>@<server>
  #     Dann im lokalen Browser http://localhost:8081 öffnen.
  #   • Nach getaner Arbeit wieder herunterfahren (Befehl oben).
  pgweb:
    # Fest per Digest: Ein Werkzeug mit Zugang zur ganzen Datenbank soll nicht
    # unbemerkt durch ein umgehängtes Tag ersetzt werden.
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    container_name: brickinventory-pgweb
    # Ein Webserver auf Port 8081 braucht keine Capability.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    profiles: ["tools"]
    restart: "no"          # bewusst nicht "unless-stopped": Werkzeug auf Zeit
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    depends_on:
      db-rolle:
        condition: service_completed_successfully
    environment:
      # Eine Leserolle, weder Superuser noch App: --readonly lässt sich per SET
      # TRANSACTION umgehen; die Rolle hat trotzdem nur SELECT ohne Geheimnisse.
      # Neue Tabellen sieht sie nach dem nächsten Lauf von db-rolle.
      PGWEB_DB_PASSWORD: ${PGWEB_DB_PASSWORD:-}
      PGWEB_DATABASE_URL: postgres://brickinventory_lesen:${PGWEB_DB_PASSWORD:-}@postgres:5432/brickinventory?sslmode=disable
      # HTTP-Basic-Anmeldung von pgweb. Ohne PGWEB_PASSWORD startet der Dienst
      # nicht (Prüfung unten); als :? stünde es hier, verlangte Compose es aber
      # auch für jedes `docker compose up` ohne Profil.
      PGWEB_AUTH_USER: ${PGWEB_USER:-pgweb}
      PGWEB_AUTH_PASS: ${PGWEB_PASSWORD:-}
    # --readonly zusätzlich zur Leserolle; Reparaturen mit psql als App-Rolle.
    # --lock-session: Die Oberfläche verbindet nur zu PGWEB_DATABASE_URL, nicht
    # zu beliebigen Hosts und Ports im Docker-Netz.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$PGWEB_AUTH_PASS" ]; then
          echo "pgweb: PGWEB_PASSWORD in .env setzen (Anmeldung im Browser) - siehe README." >&2
          exit 1
        fi
        if [ -z "$$PGWEB_DB_PASSWORD" ]; then
          echo "pgweb: PGWEB_DB_PASSWORD in .env setzen (Leserolle der Datenbank) - siehe UPGRADE.md." >&2
          exit 1
        fi
        exec /usr/bin/pgweb --bind=0.0.0.0 --listen=8081 --readonly --lock-session
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - brickinventory-net

volumes:
  # Allein das Wurzelzertifikat der CA, von Caddy geschrieben, von der App gelesen.
  ca-wurzel:

networks:
  # Festes Netz: Ein Reverse-Proxy davor bekommt darin eine feste Adresse
  # (ipv4_address: 172.28.73.10), und TRUST_PROXY nennt genau diese. Ein
  # ganzes Docker-Netz zu vertrauen liesse jeden Container darin Adressen fälschen.
  brickinventory-net:
    driver: bridge
