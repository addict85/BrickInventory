# Rules for detekt (convention brickinventory.detekt in build-logic, Detekt.kt).
#
# Based on detekt's defaults (buildUponDefaultConfig); only what deviates stands here,
# each with its reason. The baseline (baseline.xml) is empty: tools/detekt-limit.txt
# holds it at 0, so a finding is fixed, not recorded.

config:
  validation: true

complexity:
  # Length and branching with detekt's defaults (60 lines, 15 branches); a longer
  # function is split into named parts.
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  LongParameterList:
    # Composables too: a screen takes its UiState and an Actions interface, a section a
    # small state class, instead of a dozen loose values and callbacks. Defaults (Modifier,
    # options of a building block) do not count; what a caller must pass does.
    functionThreshold: 8
    ignoreDefaultParameters: true
    # Hilt providers list their dependencies, Room queries their columns: that is their contract.
    ignoreAnnotated: ['Provides', 'Query']
    # Query parameters of a Retrofit interface are the address, not a list of concerns.
    ignoreAnnotatedParameter: ['Query']
    # Test helpers with defaults for every variant (design, device, font).
    excludes: ['**/test/**', '**/testFixtures/**']
    # Hilt constructors; the longest (SessionService) has 14 parameters.
    constructorThreshold: 15
  NestedBlockDepth:
    threshold: 6
  TooManyFunctions:
    # Files are cut by area, not by number of functions.
    active: false
  ComplexCondition:
    threshold: 6
  LargeClass:
    excludes: ['**/test/**']

exceptions:
  # Caught broadly only in catchUnlessCancelled (passes a coroutine's cancellation on)
  # and in safeCall, the boundary network → Outcome.
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  InstanceOfCheckForException:
    active: true

naming:
  FunctionNaming:
    # Composables are named like classes (Compose convention).
    ignoreAnnotated: ['Composable']
  VariableNaming:
    # Local constants in UPPER CASE and `_name` for the mutable counterpart of a public value.
    variablePattern: '(_)?([a-z][A-Za-z0-9]*|[A-Z][A-Z0-9_]*)'
    privateVariablePattern: '(_)?([a-z][A-Za-z0-9]*|[A-Z][A-Z0-9_]*)'
  MatchingDeclarationName:
    # Files are named after their area (CatalogStates.kt), not after their first class.
    active: false

performance:
  SpreadOperator:
    # Only at start-up (migrations) and in test helpers; the copy costs nothing.
    active: false

style:
  MagicNumber:
    # Sizes, colors and durations stand in Compose where they take effect.
    active: false
  MaxLineLength:
    # Long lines are mostly Compose calls and test data; a wrapping pass over
    # about 1100 lines would only bring noise into every diff.
    active: false
  WildcardImport:
    # Star imports only for AndroidX building-block packages a screen takes dozens of
    # names from; own packages one by one, so an import reveals the module. The two
    # excluded files follow as soon as they are touched anyway.
    active: true
    excludeImports:
      - 'androidx.compose.material3.*'
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.runtime.*'
      - 'androidx.compose.material.icons.filled.*'
      - 'androidx.compose.foundation.lazy.grid.*'
      - 'androidx.compose.ui.text.input.*'
      - 'androidx.compose.animation.core.*'
      - 'androidx.compose.ui.unit.*'
      - 'androidx.compose.ui.text.*'
      - 'androidx.compose.ui.graphics.*'
      - 'androidx.navigation.compose.*'
      - 'androidx.camera.core.*'
    excludes: ['**/shared/ui/SetDetailComponents.kt', '**/management/ui/screens/MonitoringScreen.kt']
  ReturnCount:
    # Returning early instead of nesting is project style, also after a check in the
    # middle of a function (network responses, passkeys).
    active: false
  LoopWithTooManyJumpStatements:
    maxJumpCount: 4
    excludes: ['**/test/**']
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  ThrowsCount:
    max: 3

formatting:
  # Alignment with spaces (`val a   = …`) and long argument lists are project style;
  # ktlint's wrapping and indentation rules would rewrite almost every file.
  ArgumentListWrapping:
    active: false
  Wrapping:
    active: false
  Indentation:
    active: false
  MaximumLineLength:
    active: false
  ParameterListWrapping:
    active: false
  NoMultipleSpaces:
    active: false
  ModifierListSpacing:
    active: false
  FunctionReturnTypeSpacing:
    active: false
  MultiLineIfElse:
    active: false
  PropertyWrapping:
    active: false
  AnnotationOnSeparateLine:
    active: false
  SpacingBetweenDeclarationsWithComments:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  ImportOrdering:
    # IntelliJ's order (`*,java.**,javax.**,kotlin.**,^`): one fixed order keeps
    # import blocks out of merge conflicts; `-PdetektAutoCorrect` sorts them.
    active: true
    layout: '*,java.**,javax.**,kotlin.**,^'
  NoWildcardImports:
    active: false
  Filename:
    active: false
  NoConsecutiveBlankLines:
    # `npm run design:tokens` (Web-App) writes the two files; design-transcript.test.js
    # checks their form character by character.
    excludes: ['**/ui/theme/DesignTokens.kt', '**/ui/theme/DarkTokens.kt']
