org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Build-Cache AN (Nachtrag 116). Stand vorher auf false, zusammen mit
# ksp.incremental=false, als Teil des Windows-KSP-Workarounds unten. Der
# Workaround stammt aus einer früheren AGP/KSP-Generation; das Init-Skript
# allein hat den byRounds-Fehler seither zuverlässig verhindert.
#
# WENN der Fehler zurückkommt ("NoSuchFileException: byRounds/1/…
# _GeneratedInjector.java"), sind das die zwei Zeilen zum Zurückdrehen:
#   org.gradle.caching=false
#   ksp.incremental=false
# Bitte dann hier vermerken, dass es NICHT ging — sonst probiert es der
# nächste Durchgang wieder.
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official

# Kotlin daemon heap — separate from Gradle daemon, needs its own -Xmx
kotlin.daemon.jvm.options=-Xmx3g -XX:MaxMetaspaceSize=768m

# Windows KSP fix: init script deletes stale byRounds/ dir before every build.
# This is the only reliable fix for:
#   NoSuchFileException: byRounds/1/...BrickInventoryApp_GeneratedInjector.java
org.gradle.init.scripts=gradle/clean-ksp-shadow.init.gradle.kts

# Additional Windows build stability flags
# ksp.incremental: siehe Hinweis bei org.gradle.caching oben.
ksp.incremental=true

# ── Veraltete Gradle-Funktionen BENENNEN, nicht nur zaehlen ─────────────────
#
# Ohne das meldet Gradle am Ende eine Sammelzeile: „Deprecated Gradle features
# were used in this build, making it incompatible with Gradle 10." — und sagt
# NICHT, welche. Damit war die eine verbleibende Warnung des Zaehlers
# (tools/warnungen-zaehlen.py) nicht behebbar.
#
# Der Name ist nicht geraten, sondern in Gradles Quelle nachgelesen
# (docs.gradle.org ist aus der Entwicklungsumgebung gesperrt,
# raw.githubusercontent.com nicht):
#
#   LoggingConfigurationBuildOptions.java
#     LONG_OPTION     = "warning-mode"
#     GRADLE_PROPERTY = "org.gradle.warning.mode"
#   WarningMode.java   enum { All, Summary, None, Fail }
#
# Hier statt als Befehlszeilenschalter: So gilt es fuer JEDEN Aufruf — auch im
# Android Studio, wo die Veraltungen genauso auffallen sollen — und steht an
# einer Stelle statt an dreien.
#
# ACHTUNG fuer den Zaehler: Im Modus `all` erscheint die SAMMELZEILE NICHT
# mehr. GEMESSEN in LoggingDeprecatedFeatureHandler.java:
#
#   if (warningMode == WarningMode.Summary && deprecationsFound) { … }
#
# Wer also die Sammelzeile zaehlt, zaehlt ab jetzt null — und das saehe besser
# aus, waehrend die Veraltungen noch da sind. Gezaehlt werden deshalb die
# Einzelmeldungen.
org.gradle.warning.mode=all
