org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Der zweite Lauf überspringt die Konfiguration der 14 Module. Fundstellen melden
# statt abbrechen, bis die CI einen Lauf ohne Fund gezeigt hat; dann `fail`.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official

# Kotlin daemon heap — separate from Gradle daemon, needs its own -Xmx
kotlin.daemon.jvm.options=-Xmx3g -XX:MaxMetaspaceSize=768m

ksp.incremental=true

# Jede Gradle-Veraltung einzeln benennen statt einer Sammelzeile: Nur so kann
# tools/warnungen-zaehlen.py sie mit Namen zählen. Im Modus `all` entfällt die
# Sammelzeile; gezählt werden die Einzelmeldungen.
org.gradle.warning.mode=all
