org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# The second run skips configuring the modules. Report problems instead of
# aborting until CI has shown a run without any; then `fail`.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official

# Kotlin daemon heap — separate from Gradle daemon, needs its own -Xmx
kotlin.daemon.jvm.options=-Xmx3g -XX:MaxMetaspaceSize=768m

ksp.incremental=true

# Name every Gradle deprecation on its own instead of one summary line: only then can
# tools/warnings-count.py count them by name. Mode `all` drops the summary line.
org.gradle.warning.mode=all
