[versions]
camerax                     = "1.6.2"
mlkitBarcode                = "18.3.1"   # unbundled: das Modell liefern die Play-Dienste
# Texterkennung fest eingebaut (com.google.mlkit): kein Nachladen über Play, sofort
# offline nutzbar; kostet rund 4 MB APK.
mlkitTextRec                = "16.0.1"
# 9.5.0 bleibt aus: Dem Release-APK fehlten damit Texte, die erreichbarer Code benutzt
# („APK gegen R8-Verluste“ rot, mit 9.4.1 grün). Erst heben, wenn das geklärt ist.
agp                         = "9.4.1"
# KSP 2 läuft eigenständig und muss nicht zur Kotlin-Nummer passen (das galt für KSP 1).
# Compose-Compiler und Serialisierung tragen die Kotlin-Nummer (version.ref = "kotlin").
kotlin                      = "2.4.21"
ksp                         = "2.3.13"
coreKtx                     = "1.19.1"
coreSplashscreen            = "1.2.0"
lifecycleRuntimeKtx         = "2.11.0"
# Untergrenzen aller Android-Module (build-logic, androidxMindestens): Allein zöge ein schlankes
# Modul arch-core 2.0.0 und tracing 1.1.0, die nicht im Prüfsummenverzeichnis stehen.
archCore                    = "2.2.0"
tracing                     = "2.0.5"
activityCompose             = "1.13.0"
# Setzt die Fassungen der Compose-Artefakte; graphics-path steht unten eigens.
composeBom                  = "2026.09.00"
# Hilts Prozessor liest die Kotlin-Metadaten unserer Klassen; 2.60.1 bringt
# kotlin-metadata-jvm 2.3.21 mit, ältere Fassungen lesen die von Kotlin 2.4 nicht.
hilt                        = "2.60.1"
hiltNavigationCompose       = "1.4.0"
navigationCompose           = "2.10.2"
# Retrofit 3 verlangt okhttp 4.12 nur weich; Gradle nimmt okhttp 5 unten. Der Konverter
# bleibt 1.0.0 (neuer gibt es nicht), asConverterFactory ist in Retrofit 3 unverändert.
retrofit                    = "3.0.0"
# Für okhttp, okhttp-sse, logging-interceptor und mockwebserver. Ab 5.5 verlangt
# okhttp-android compileSdk 37 (siehe build-logic, Sdk.kt).
okhttp                      = "5.5.1"
kotlinxSerializationJson    = "1.12.0"
retrofitKotlinxSerialization = "1.0.0"
graphicsPath                = "1.1.0"   # 16 KB, siehe app/build.gradle.kts
# Die 16-KB-Ausrichtung prüft tools/apk-ausrichtung.py am gebauten APK, nicht die Nummer.
datastore                   = "1.3.0"
# Mindestfassung für Guava, das andere Bibliotheken mitbringen (CVE-2026-102554,
# behoben in 33.7.2). Gesetzt in build-logic, Gemeinsam.kt.
guavaMindestens             = "33.7.2-android"
appcompat                   = "1.8.0"
# Rückfrage per Gerätesperre vor heiklen Schritten (core-ui, Schrittschutz).
biometric                   = "1.1.0"
# Passkeys (feature-anmeldung); play-services-auth reicht sie vor Android 14 an Play weiter.
credentials                 = "1.6.0"
# Ab 3.6 verlangt coil-core-android compileSdk 37 (siehe build-logic, Sdk.kt).
coil                        = "3.6.3"
coroutines                  = "1.11.0"
# Preisalarm-Abruf. Ohne native .so, die 16-KB-Ausrichtung bleibt unberührt.
work                        = "2.12.0"
# Lokale Ablage und Ausgang; mindestens die Fassung, die WorkManager mitbringt.
room                        = "2.8.5"
# Verschlüsselte Ablage des Bestands; Maven Central, signiert von Zetetic
# (verification-keyring.keys), .so auf 16 KB ausgerichtet.
sqlcipher                   = "4.19.1"
junit                       = "4.13.2"
# org.json steckt in android.jar nur als Attrappe; mit isReturnDefaultValues gäbe
# optString("error") still "". Die echte Fassung liegt im Testklassenpfad davor.
orgJson                     = "20260814"
robolectric                 = "4.17"
roborazzi                   = "1.77.0"
androidxTestJunit           = "1.3.0"
glance                      = "1.2.0"
# detekt 1.23 läuft nur mit dem Kotlin, gegen das es gebaut ist (2.0.21 laut POM);
# die Konvention hält es darauf fest. detekt 2 gibt es nur als alpha.
detekt                      = "1.23.8"
detektKotlin                = "2.0.21"

[libraries]
junit                               = { group = "junit",                      name = "junit",                             version.ref = "junit" }
json                                = { group = "org.json",                   name = "json",                              version.ref = "orgJson" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",           version.ref = "coroutines" }
okhttp-mockwebserver                = { group = "com.squareup.okhttp3",       name = "mockwebserver",                     version.ref = "okhttp" }
androidx-core-ktx                   = { group = "androidx.core",              name = "core-ktx",                          version.ref = "coreKtx" }
androidx-core-splashscreen          = { group = "androidx.core",              name = "core-splashscreen",                 version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",             version.ref = "lifecycleRuntimeKtx" }
androidx-arch-core-common          = { group = "androidx.arch.core",         name = "core-common",                       version.ref = "archCore" }
androidx-arch-core-runtime         = { group = "androidx.arch.core",         name = "core-runtime",                      version.ref = "archCore" }
androidx-tracing                   = { group = "androidx.tracing",           name = "tracing",                           version.ref = "tracing" }
androidx-lifecycle-viewmodel         = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel",               version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",          name = "activity-compose",                  version.ref = "activityCompose" }
androidx-compose-bom                = { group = "androidx.compose",           name = "compose-bom",                       version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-navigation-compose         = { group = "androidx.navigation",        name = "navigation-compose",                version.ref = "navigationCompose" }
hilt-android                        = { group = "com.google.dagger",          name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",          name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",              name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }
# Dieselbe Reihe wie hilt-navigation-compose: androidx.hilt erscheint nur gemeinsam.
androidx-hilt-work                  = { group = "androidx.hilt",              name = "hilt-work",                         version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler              = { group = "androidx.hilt",              name = "hilt-compiler",                     version.ref = "hiltNavigationCompose" }
retrofit                            = { group = "com.squareup.retrofit2",      name = "retrofit",                          version.ref = "retrofit" }
okhttp                              = { group = "com.squareup.okhttp3",       name = "okhttp",                            version.ref = "okhttp" }
okhttp-logging                      = { group = "com.squareup.okhttp3",       name = "logging-interceptor",               version.ref = "okhttp" }
okhttp-sse                          = { group = "com.squareup.okhttp3",       name = "okhttp-sse",                        version.ref = "okhttp" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",        version.ref = "kotlinxSerializationJson" }
retrofit-kotlinx-serialization      = { group = "com.jakewharton.retrofit",   name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
androidx-datastore                  = { group = "androidx.datastore",         name = "datastore-preferences",             version.ref = "datastore" }
androidx-work                       = { group = "androidx.work",              name = "work-runtime-ktx",                  version.ref = "work" }
androidx-room-runtime               = { group = "androidx.room",              name = "room-runtime",                      version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",              name = "room-ktx",                          version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",              name = "room-compiler",                     version.ref = "room" }
sqlcipher-android                   = { group = "net.zetetic",                name = "sqlcipher-android",                 version.ref = "sqlcipher" }
androidx-graphics-path              = { group = "androidx.graphics",          name = "graphics-path",                     version.ref = "graphicsPath" }
androidx-appcompat                  = { group = "androidx.appcompat",         name = "appcompat",                         version.ref = "appcompat" }
androidx-biometric                  = { group = "androidx.biometric",         name = "biometric",                         version.ref = "biometric" }
androidx-credentials                = { group = "androidx.credentials",       name = "credentials",                       version.ref = "credentials" }
androidx-credentials-play-services  = { group = "androidx.credentials",       name = "credentials-play-services-auth",    version.ref = "credentials" }
coil-compose                        = { group = "io.coil-kt.coil3",           name = "coil-compose",                      version.ref = "coil" }
# Coil 3 lädt ohne dieses Artefakt nicht aus dem Netz, und zwar stumm.
coil-network-okhttp                 = { group = "io.coil-kt.coil3",           name = "coil-network-okhttp",               version.ref = "coil" }
# ImageLoader steht in der Schnittstelle der Datenschicht, und core-data hat kein Compose.
coil-core                           = { group = "io.coil-kt.coil3",           name = "coil-core",                         version.ref = "coil" }
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",        name = "ui-tooling" }
camerax-core                        = { group = "androidx.camera",            name = "camera-core",                       version.ref = "camerax" }
camerax-camera2                     = { group = "androidx.camera",            name = "camera-camera2",                    version.ref = "camerax" }
camerax-lifecycle                   = { group = "androidx.camera",            name = "camera-lifecycle",                  version.ref = "camerax" }
camerax-view                        = { group = "androidx.camera",            name = "camera-view",                       version.ref = "camerax" }
mlkit-barcode                       = { group = "com.google.android.gms",     name = "play-services-mlkit-barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-textrec                       = { group = "com.google.mlkit",           name = "text-recognition",                     version.ref = "mlkitTextRec" }
robolectric                         = { group = "org.robolectric",            name = "robolectric",                       version.ref = "robolectric" }
roborazzi                           = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                    version.ref = "roborazzi" }
roborazzi-compose                   = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",            version.ref = "roborazzi" }
roborazzi-junit-rule                = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",         version.ref = "roborazzi" }
androidx-test-ext-junit             = { group = "androidx.test.ext",          name = "junit",                             version.ref = "androidxTestJunit" }
androidx-ui-test-junit4             = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-ui-test-junit4-accessibility = { group = "androidx.compose.ui",      name = "ui-test-junit4-accessibility" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
glance-appwidget                    = { group = "androidx.glance",            name = "glance-appwidget",                  version.ref = "glance" }
glance-material3                    = { group = "androidx.glance",            name = "glance-material3",                  version.ref = "glance" }

# Was fast jedes Modul braucht, an einer Stelle — die Module nennen nur noch die Gruppe.
[bundles]
compose = [
    "androidx-ui", "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-material3",
    "androidx-material-icons-extended", "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose", "androidx-activity-compose", "hilt-navigation-compose",
    "coil-compose",
]
unit-tests = ["junit", "json", "kotlinx-coroutines-test", "okhttp-mockwebserver"]
camera = ["camerax-core", "camerax-camera2", "camerax-lifecycle", "camerax-view"]

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
android-library         = { id = "com.android.library",                        version.ref = "agp" }
# Lint für das reine Kotlin-Modul core-model, damit checkDependencies der App es mitprüft.
android-lint            = { id = "com.android.lint",                           version.ref = "agp" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",                   version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
roborazzi               = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }

# Konventionen aus build-logic, ohne Fassung: Sie kommen aus diesem Baum.
brickinventory-android-application = { id = "brickinventory.android.application" }
brickinventory-android-library     = { id = "brickinventory.android.library" }
brickinventory-android-unittests   = { id = "brickinventory.android.unittests" }
brickinventory-android-compose     = { id = "brickinventory.android.compose" }
brickinventory-android-hilt        = { id = "brickinventory.android.hilt" }
brickinventory-android-feature     = { id = "brickinventory.android.feature" }
brickinventory-detekt              = { id = "brickinventory.detekt" }
brickinventory-jvm-library         = { id = "brickinventory.jvm.library" }
