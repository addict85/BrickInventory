[versions]
camerax                     = "1.6.1"
mlkitBarcode                = "18.3.1"   # unbundled (Play-Dienste) — siehe 16-KB-Hinweis in app/build.gradle.kts
# Texterkennung FEST EINGEBAUT (com.google.mlkit statt com.google.android.gms):
# Marcos Wunsch — kein Nachladen über Play, funktioniert sofort und offline.
# Kostet rund 4 MB APK, dafür keine Überraschung beim ersten Scan.
mlkitTextRec                = "16.0.1"   # bundled — liegt IM APK, kein Play-Nachladen
accompanistPermissions      = "0.34.0"

agp                         = "9.2.1"
# ── Die beiden gehoeren ZUSAMMEN und werden nie einzeln gehoben ─────────
#
# GEMESSEN aus den POMs von symbol-processing-api (05.10.):
#   KSP 2.3.6              → erwartet Kotlin 2.3.0
#   KSP 2.3.7 und hoeher   → erwartet Kotlin 2.3.20
#
# ── Warum ueberhaupt (05.10.) ───────────────────────────────────────────
#
# Drei Abhaengigkeiten standen auf einem Deckel, und es war DERSELBE:
#
#   kotlinx-serialization-json 1.11.0 → verlangt kotlin-stdlib 2.3.20
#   hilt 2.60.1 (ueber KSP-API 2.3.7) → verlangt Kotlin 2.3.20
#   coil3 3.4.0                       → verlangt kotlin-stdlib 2.3.10
#
# Jede einzeln zu heben war unmoeglich; alle drei haengen am Uebersetzer.
# Deshalb steht hier die Werkzeugkette allein in einem Schritt — was sie
# freigibt, kommt danach und einzeln.
#
# ── Das Risiko, das sich hier nicht pruefen laesst ──────────────────────
#
# Der Compose-Compiler ist ein Kotlin-Plugin und traegt dieselbe Nummer
# (siehe [plugins] unten: kotlin-compose → version.ref = "kotlin"). Er
# verlangt eine Mindestfassung der Compose-LAUFZEIT, und die kommt aus der
# BOM, die hier auf 2024.09.03 steht. Ob 2.3.20 damit zufrieden ist, konnte
# ich nicht nachsehen: Die BOM liegt auf Google-Maven, und das ist aus
# diesem Container nicht erreichbar (HTTP 000; Maven Central geht).
# Die GitHub-Action ist an dieser Stelle die einzige Auskunft.
kotlin                      = "2.3.20"
ksp                         = "2.3.12"
coreKtx                     = "1.13.1"
lifecycleRuntimeKtx         = "2.8.6"
activityCompose             = "1.9.2"
composeBom                  = "2024.09.03"
# BLEIBT auf 2.59. Es gibt 2.60.1, und der Sprung sieht nach einer
# Kleinigkeit aus — ist aber keiner: hilt-compiler 2.60.1 zieht die
# KSP-API 2.3.7, und die erwartet Kotlin 2.3.20. Unser Paar ist heute
# Kotlin 2.3.0 + KSP 2.3.6, und das passt zusammen (KSP 2.3.6 erwartet
# genau 2.3.0). Hilt zu heben heisst also, die ganze Werkzeugkette zu
# heben — das gehoert in einen eigenen Schritt und nicht hier mit hinein.
hilt                        = "2.59"
hiltNavigationCompose       = "1.2.0"
navigationCompose           = "2.8.3"
# NACHGESEHEN in der POM von 3.0.0: Retrofit 3 haengt selbst an okhttp
# 4.12.0 und kotlin-stdlib 2.1.21 — beides unter unserem Stand, also kein
# Zwang zu okhttp 5 und kein Konflikt mit Kotlin 2.3.0.
#
# Der Konverter (retrofitKotlinxSerialization) bleibt auf 1.0.0: Eine
# neuere gibt es nicht, und seine POM nennt retrofit 2.9.0 als Mindestmass.
# Die benutzte Stelle ist asConverterFactory() auf einer Converter.Factory,
# und die Schnittstelle ist in Retrofit 3 unveraendert.
retrofit                    = "3.0.0"
okhttp                      = "4.12.0"
# NICHT auf 1.11.0, obwohl es das gibt — GEMESSEN am 05.10. aus den
# Gradle-Metadaten der Artefakte selbst:
#   serialization-json 1.10.0 → kotlin-stdlib 2.3.0
#   serialization-json 1.11.0 → kotlin-stdlib 2.3.20
# Unser Compiler ist Kotlin 2.3.0 (siehe `kotlin` oben). Mit 1.11.0 zoege
# Gradle eine stdlib, die NEUER ist als der Uebersetzer, der sie benutzt —
# das meldet Kotlin bestenfalls als Warnung und bricht schlimmstenfalls
# erst an einer entlegenen Stelle ab. 1.10.0 verlangt genau unsere
# Fassung.
kotlinxSerializationJson    = "1.10.0"
retrofitKotlinxSerialization = "1.0.0"
graphicsPath                = "1.1.0"   # 16-KB-Versuch, siehe app/build.gradle.kts
datastore                   = "1.1.7"   # NICHT auf 1.2.0 heben: dort ist die native Bibliothek wieder 4-KB-ausgerichtet
appcompat                   = "1.7.0"
profileinstaller            = "1.4.1"
coil                        = "2.7.0"
# 1.11.0 verlangt kotlin-stdlib 2.2.20, liegt also UNTER unseren 2.3.0 —
# anders als serialization oben kein Konflikt. Ebenfalls aus den
# Gradle-Metadaten gelesen, nicht geschaetzt.
coroutines                  = "1.11.0"
# WorkManager fuer den stuendlichen Preisalarm-Abruf. Reine Java-/Kotlin-
# Bibliothek — sie bringt KEINE native .so mit und beruehrt die
# 16-KB-Ausrichtung deshalb nicht (siehe INVARIANTEN.md). Room und
# androidx.sqlite kommen transitiv mit, nutzen aber das SQLite des Systems;
# das gebuendelte SQLite waere ein eigener, hier nicht gezogener Artefakt.
work                        = "2.10.0"
junit                       = "4.13.2"
# org.json steckt in android.jar nur als Attrappe — siehe Kommentar bei
# testImplementation(libs.json) in app/build.gradle.kts.
orgJson                     = "20260814"
# Testabhängigkeiten (Nachtrag 117). Bis dahin war JUnit die EINZIGE, weshalb
# 41 von 47 Testdateien Quelltext lesen mussten statt Verhalten auszuführen.
# coroutinesTest folgt bewusst der coroutines-Version — die beiden müssen
# zusammenpassen, sonst scheitert runTest zur Laufzeit statt beim Übersetzen.

[libraries]
junit                               = { group = "junit",                      name = "junit",                             version.ref = "junit" }
json                                = { group = "org.json",                   name = "json",                              version.ref = "orgJson" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",           version.ref = "coroutines" }
okhttp-mockwebserver                = { group = "com.squareup.okhttp3",       name = "mockwebserver",                     version.ref = "okhttp" }
androidx-core-ktx                   = { group = "androidx.core",              name = "core-ktx",                          version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",             version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",          name = "activity-compose",                  version.ref = "activityCompose" }
androidx-compose-bom                = { group = "androidx.compose",           name = "compose-bom",                       version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-navigation-compose         = { group = "androidx.navigation",        name = "navigation-compose",                version.ref = "navigationCompose" }
hilt-android                        = { group = "com.google.dagger",          name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",          name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",              name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }
retrofit                            = { group = "com.squareup.retrofit2",      name = "retrofit",                          version.ref = "retrofit" }
okhttp-logging                      = { group = "com.squareup.okhttp3",       name = "logging-interceptor",               version.ref = "okhttp" }
okhttp-sse                          = { group = "com.squareup.okhttp3",       name = "okhttp-sse",                        version.ref = "okhttp" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",        version.ref = "kotlinxSerializationJson" }
retrofit-kotlinx-serialization      = { group = "com.jakewharton.retrofit",   name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
androidx-datastore                  = { group = "androidx.datastore",         name = "datastore-preferences",             version.ref = "datastore" }
androidx-work                       = { group = "androidx.work",              name = "work-runtime-ktx",                  version.ref = "work" }
androidx-graphics-path              = { group = "androidx.graphics",          name = "graphics-path",                     version.ref = "graphicsPath" }
androidx-appcompat                  = { group = "androidx.appcompat",         name = "appcompat",                         version.ref = "appcompat" }
androidx-profileinstaller           = { group = "androidx.profileinstaller",  name = "profileinstaller",                  version.ref = "profileinstaller" }
coil-compose                        = { group = "io.coil-kt",                 name = "coil-compose",                      version.ref = "coil" }
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",        name = "ui-tooling" }
camerax-core                        = { group = "androidx.camera",            name = "camera-core",                       version.ref = "camerax" }
camerax-camera2                     = { group = "androidx.camera",            name = "camera-camera2",                    version.ref = "camerax" }
camerax-lifecycle                   = { group = "androidx.camera",            name = "camera-lifecycle",                  version.ref = "camerax" }
camerax-view                        = { group = "androidx.camera",            name = "camera-view",                       version.ref = "camerax" }
mlkit-barcode                       = { group = "com.google.android.gms",     name = "play-services-mlkit-barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-textrec                       = { group = "com.google.mlkit",           name = "text-recognition",                     version.ref = "mlkitTextRec" }
accompanist-permissions             = { group = "com.google.accompanist",     name = "accompanist-permissions",           version.ref = "accompanistPermissions" }

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
