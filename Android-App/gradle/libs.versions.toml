[versions]
camerax                     = "1.6.2"
mlkitBarcode                = "18.3.1"   # unbundled: Play services deliver the model
# Text recognition bundled (com.google.mlkit): no download via Play, usable offline
# right away; costs about 4 MB of APK.
mlkitTextRec                = "16.0.1"
# 9.5.0 stays out: the release APK then lacked texts that reachable code uses
# (“APK against R8 losses” red, green with 9.4.1). Raise only once that is resolved.
agp                         = "9.4.1"
# KSP 2 runs on its own and need not match the Kotlin number (that applied to KSP 1).
# The Compose compiler and serialization carry the Kotlin number (version.ref = "kotlin").
kotlin                      = "2.4.21"
ksp                         = "2.3.13"
coreKtx                     = "1.19.1"
coreSplashscreen            = "1.2.0"
lifecycleRuntimeKtx         = "2.11.0"
# Lower bounds of all Android modules (build-logic, androidxAtLeast): on its own a lean
# module would pull arch-core 2.0.0, tracing 1.1.0, emoji2 1.2.0 and activity-ktx 1.7.1, which are not in
# the checksum directory; activity-ktx takes the version of activityCompose.
archCore                    = "2.2.0"
tracing                     = "2.0.5"
emoji2                      = "1.4.0"
activityCompose             = "1.13.0"
# Sets the versions of the Compose artifacts; graphics-path stands separately below.
composeBom                  = "2026.09.00"
# Hilt's processor reads the Kotlin metadata of our classes; 2.60.1 brings
# kotlin-metadata-jvm 2.3.21, older versions cannot read that of Kotlin 2.4.
hilt                        = "2.60.1"
hiltNavigationCompose       = "1.4.0"
navigationCompose           = "2.10.2"
# Retrofit 3 requires okhttp 4.12 only softly; Gradle takes okhttp 5 below. The converter
# stays 1.0.0 (there is no newer one), asConverterFactory is unchanged in Retrofit 3.
retrofit                    = "3.0.0"
# For okhttp, okhttp-sse, logging-interceptor and mockwebserver. From 5.5 on
# okhttp-android requires compileSdk 37 (see build-logic, Sdk.kt).
okhttp                      = "5.5.1"
kotlinxSerializationJson    = "1.12.0"
retrofitKotlinxSerialization = "1.0.0"
graphicsPath                = "1.1.0"   # 16 KB, see app/build.gradle.kts
# tools/apk-alignment.py checks the 16 KB alignment on the built APK, not the number.
datastore                   = "1.3.0"
# Minimum version for Guava, which other libraries bring along (CVE-2026-102554,
# fixed in 33.7.2). Set in build-logic, Shared.kt.
guavaAtLeast                = "33.7.2-android"
appcompat                   = "1.8.0"
# Confirmation via the device lock before delicate steps (core-ui, step guard).
biometric                   = "1.1.0"
# Passkeys (feature-login); play-services-auth passes them on to Play before Android 14.
credentials                 = "1.6.0"
# From 3.6 on coil-core-android requires compileSdk 37 (see build-logic, Sdk.kt).
coil                        = "3.6.3"
coroutines                  = "1.11.0"
# Price alert fetch. Without native .so, the 16 KB alignment stays untouched.
work                        = "2.12.0"
# Local store and outbox; at least the version that WorkManager brings along.
room                        = "2.8.5"
# Encrypted store of the stock; Maven Central, signed by Zetetic
# (verification-keyring.keys), .so aligned to 16 KB.
sqlcipher                   = "4.19.1"
junit                       = "4.13.2"
# org.json is only a stub in android.jar that throws in the JVM test. The real
# version comes before it on the test classpath.
orgJson                     = "20260814"
robolectric                 = "4.17"
roborazzi                   = "1.77.0"
androidxTestJunit           = "1.3.0"
# Device tests (Gradle Managed Devices, android.yml job geraetetests); matches ext-junit 1.3.0.
androidxTestRunner          = "1.7.0"
glance                      = "1.2.0"
# detekt 1.23 only runs with the Kotlin it is built against (2.0.21 per POM);
# the convention pins it there. detekt 2 only exists as alpha.
detekt                      = "1.23.8"
detektKotlin                = "2.0.21"
# Only @Qualifier for core-model; Hilt pulls the same version anyway.
javaxInject                 = "1"

[libraries]
javax-inject                        = { group = "javax.inject",               name = "javax.inject",                      version.ref = "javaxInject" }
junit                               = { group = "junit",                      name = "junit",                             version.ref = "junit" }
json                                = { group = "org.json",                   name = "json",                              version.ref = "orgJson" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",           version.ref = "coroutines" }
okhttp-mockwebserver                = { group = "com.squareup.okhttp3",       name = "mockwebserver",                     version.ref = "okhttp" }
androidx-core-ktx                   = { group = "androidx.core",              name = "core-ktx",                          version.ref = "coreKtx" }
androidx-core-splashscreen          = { group = "androidx.core",              name = "core-splashscreen",                 version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",             version.ref = "lifecycleRuntimeKtx" }
androidx-arch-core-common          = { group = "androidx.arch.core",         name = "core-common",                       version.ref = "archCore" }
androidx-arch-core-runtime         = { group = "androidx.arch.core",         name = "core-runtime",                      version.ref = "archCore" }
androidx-tracing                   = { group = "androidx.tracing",           name = "tracing",                           version.ref = "tracing" }
androidx-emoji2                    = { group = "androidx.emoji2",            name = "emoji2",                            version.ref = "emoji2" }
androidx-emoji2-views-helper       = { group = "androidx.emoji2",            name = "emoji2-views-helper",               version.ref = "emoji2" }
androidx-lifecycle-viewmodel         = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel",               version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",          name = "activity-compose",                  version.ref = "activityCompose" }
androidx-activity-ktx               = { group = "androidx.activity",          name = "activity-ktx",                      version.ref = "activityCompose" }
androidx-compose-bom                = { group = "androidx.compose",           name = "compose-bom",                       version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-navigation-compose         = { group = "androidx.navigation",        name = "navigation-compose",                version.ref = "navigationCompose" }
hilt-android                        = { group = "com.google.dagger",          name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",          name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",              name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }
# The same series as hilt-navigation-compose: androidx.hilt is only released together.
androidx-hilt-work                  = { group = "androidx.hilt",              name = "hilt-work",                         version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler              = { group = "androidx.hilt",              name = "hilt-compiler",                     version.ref = "hiltNavigationCompose" }
retrofit                            = { group = "com.squareup.retrofit2",      name = "retrofit",                          version.ref = "retrofit" }
okhttp                              = { group = "com.squareup.okhttp3",       name = "okhttp",                            version.ref = "okhttp" }
okhttp-logging                      = { group = "com.squareup.okhttp3",       name = "logging-interceptor",               version.ref = "okhttp" }
okhttp-sse                          = { group = "com.squareup.okhttp3",       name = "okhttp-sse",                        version.ref = "okhttp" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",        version.ref = "kotlinxSerializationJson" }
retrofit-kotlinx-serialization      = { group = "com.jakewharton.retrofit",   name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
androidx-datastore                  = { group = "androidx.datastore",         name = "datastore-preferences",             version.ref = "datastore" }
androidx-work                       = { group = "androidx.work",              name = "work-runtime-ktx",                  version.ref = "work" }
androidx-room-runtime               = { group = "androidx.room",              name = "room-runtime",                      version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",              name = "room-ktx",                          version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",              name = "room-compiler",                     version.ref = "room" }
sqlcipher-android                   = { group = "net.zetetic",                name = "sqlcipher-android",                 version.ref = "sqlcipher" }
androidx-graphics-path              = { group = "androidx.graphics",          name = "graphics-path",                     version.ref = "graphicsPath" }
androidx-appcompat                  = { group = "androidx.appcompat",         name = "appcompat",                         version.ref = "appcompat" }
androidx-biometric                  = { group = "androidx.biometric",         name = "biometric",                         version.ref = "biometric" }
androidx-credentials                = { group = "androidx.credentials",       name = "credentials",                       version.ref = "credentials" }
androidx-credentials-play-services  = { group = "androidx.credentials",       name = "credentials-play-services-auth",    version.ref = "credentials" }
coil-compose                        = { group = "io.coil-kt.coil3",           name = "coil-compose",                      version.ref = "coil" }
# Coil 3 does not load from the network without this artifact, and silently so.
coil-network-okhttp                 = { group = "io.coil-kt.coil3",           name = "coil-network-okhttp",               version.ref = "coil" }
# ImageLoader stands in the interface of the data layer, and core-data has no Compose.
coil-core                           = { group = "io.coil-kt.coil3",           name = "coil-core",                         version.ref = "coil" }
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",        name = "ui-tooling" }
camerax-core                        = { group = "androidx.camera",            name = "camera-core",                       version.ref = "camerax" }
camerax-camera2                     = { group = "androidx.camera",            name = "camera-camera2",                    version.ref = "camerax" }
camerax-lifecycle                   = { group = "androidx.camera",            name = "camera-lifecycle",                  version.ref = "camerax" }
camerax-view                        = { group = "androidx.camera",            name = "camera-view",                       version.ref = "camerax" }
mlkit-barcode                       = { group = "com.google.android.gms",     name = "play-services-mlkit-barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-textrec                       = { group = "com.google.mlkit",           name = "text-recognition",                     version.ref = "mlkitTextRec" }
robolectric                         = { group = "org.robolectric",            name = "robolectric",                       version.ref = "robolectric" }
roborazzi                           = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                    version.ref = "roborazzi" }
roborazzi-compose                   = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",            version.ref = "roborazzi" }
roborazzi-junit-rule                = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",         version.ref = "roborazzi" }
androidx-test-ext-junit             = { group = "androidx.test.ext",          name = "junit",                             version.ref = "androidxTestJunit" }
androidx-test-runner                = { group = "androidx.test",              name = "runner",                            version.ref = "androidxTestRunner" }
androidx-ui-test-junit4             = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-ui-test-junit4-accessibility = { group = "androidx.compose.ui",      name = "ui-test-junit4-accessibility" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
glance-appwidget                    = { group = "androidx.glance",            name = "glance-appwidget",                  version.ref = "glance" }
glance-material3                    = { group = "androidx.glance",            name = "glance-material3",                  version.ref = "glance" }

# What almost every module needs, in one place — the modules only name the group.
[bundles]
compose = [
    "androidx-ui", "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-material3",
    "androidx-material-icons-extended", "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose", "androidx-activity-compose", "hilt-navigation-compose",
    "coil-compose",
]
unit-tests = ["junit", "json", "kotlinx-coroutines-test", "okhttp-mockwebserver"]
camera = ["camerax-core", "camerax-camera2", "camerax-lifecycle", "camerax-view"]

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
android-library         = { id = "com.android.library",                        version.ref = "agp" }
# Lint for the pure Kotlin module core-model, so that the app's checkDependencies checks it too.
android-lint            = { id = "com.android.lint",                           version.ref = "agp" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",                   version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
roborazzi               = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }

# Conventions from build-logic, without a version: they come from this tree.
brickinventory-android-application = { id = "brickinventory.android.application" }
brickinventory-android-library     = { id = "brickinventory.android.library" }
brickinventory-android-unittests   = { id = "brickinventory.android.unittests" }
brickinventory-android-compose     = { id = "brickinventory.android.compose" }
brickinventory-android-hilt        = { id = "brickinventory.android.hilt" }
brickinventory-android-feature     = { id = "brickinventory.android.feature" }
brickinventory-detekt              = { id = "brickinventory.detekt" }
brickinventory-jvm-library         = { id = "brickinventory.jvm.library" }
