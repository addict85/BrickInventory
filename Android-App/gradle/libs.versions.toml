[versions]
camerax                     = "1.6.1"
mlkitBarcode                = "18.3.1"   # unbundled (Play-Dienste) — siehe 16-KB-Hinweis in app/build.gradle.kts
# Texterkennung FEST EINGEBAUT (com.google.mlkit statt com.google.android.gms):
# Marcos Wunsch — kein Nachladen über Play, funktioniert sofort und offline.
# Kostet rund 4 MB APK, dafür keine Überraschung beim ersten Scan.
mlkitTextRec                = "16.0.1"   # bundled — liegt IM APK, kein Play-Nachladen
accompanistPermissions      = "0.34.0"

agp                         = "9.2.1"
# ── Die Nummern der beiden muessen NICHT uebereinstimmen ────────────────
#
# Hier stand: „KSP 2.3.7 und hoeher erwartet Kotlin 2.3.20", gelesen aus der
# kotlin-stdlib-Zeile in der POM von symbol-processing-api. Das war ein
# FEHLSCHLUSS, und er hat die Werkzeugkette eine Nebenrunde lang
# kuenstlich festgehalten.
#
# Richtig ist: Das galt fuer KSP 1. Das war ein Compiler-Plugin und musste
# genau zum Uebersetzer passen — daher die alte Schreibweise
# `<kotlin>-1.0.x`, die bei `2.1.20-RC3-1.0.31` endet. KSP 2 laeuft
# EIGENSTAENDIG; seine kotlin-stdlib-Zeile ist seine eigene Laufzeit, keine
# Bindung an den Uebersetzer.
#
# BELEG, nicht Schlussfolgerung: Die Schnellstart-Seite von Kotlin selbst
# (kotlinlang.org/docs/ksp-quickstart.html, gelesen am 06.10.) zeigt im
# Beispiel genau diese Paarung —
#
#   kotlin("jvm") version "2.4.20"
#   id("com.google.devtools.ksp") version "2.3.10"
#
# Eine KSP-Fassung mit 2.4 gibt es nicht und wird auch nicht gebraucht.
# GEMESSEN am 06.10. an zwei unabhaengigen Quellen: das aus dem echten
# Inhalt erzeugte Verzeichnis auf Maven Central endet bei 2.3.12, und das
# Gradle-Plugin-Portal nennt <latest> und <release> ebenfalls 2.3.12.
# 2.3.12 ist damit die hoechste und die passende.
#
# ── Das Risiko, das sich hier nicht pruefen laesst ──────────────────────
#
# Der Compose-Compiler ist ein Kotlin-Plugin und traegt dieselbe Nummer
# (siehe [plugins] unten: kotlin-compose → version.ref = "kotlin"). Er
# verlangt eine Mindestfassung der Compose-LAUFZEIT, und die kommt aus der
# BOM, die hier auf 2024.09.03 steht. Ob 2.4.20 damit zufrieden ist, konnte
# ich nicht nachsehen: Die BOM liegt auf Google-Maven, und das ist aus
# diesem Container nicht erreichbar (HTTP 000; Maven Central geht).
# Die GitHub-Action ist an dieser Stelle die einzige Auskunft.
kotlin                      = "2.4.20"
ksp                         = "2.3.12"
coreKtx                     = "1.13.1"
lifecycleRuntimeKtx         = "2.8.6"
activityCompose             = "1.9.2"
composeBom                  = "2024.09.03"
# Gehoben von 2.59 auf 2.60.1, und zwar NICHT der Neuheit wegen, sondern
# weil Kotlin 2.4.20 es verlangt. GEMESSEN an den POMs von hilt-compiler:
#
#   2.59    → kotlin-metadata-jvm 2.2.20
#   2.59.2  → kotlin-metadata-jvm 2.2.20
#   2.60.1  → kotlin-metadata-jvm 2.3.21
#
# Mit dieser Bibliothek liest Hilts Prozessor die @Metadata-Annotationen
# UNSERER eigenen Klassen. Sie weigert sich, Metadaten zu lesen, die neuer
# sind als sie selbst — und Kotlin 2.4.20 schreibt Metadaten der 2.4er
# Reihe. 2.60.1 ist die hoechste, die es gibt, und liest bis 2.3.21.
#
# Ob das fuer 2.4er-Metadaten reicht, ist damit NICHT bewiesen. Es ist die
# wahrscheinlichste Stelle, an der dieser Sprung scheitert, und es ist der
# Grund, warum Hilt hier mitgeht statt stehen zu bleiben: Mit 2.59 waere
# der Abstand noch eine ganze Nebenversion groesser. Die GitHub-Action
# entscheidet; der frueher an dieser Stelle vermutete Grund (KSP muesse zur
# Kotlin-Nummer passen) war falsch, siehe den Block bei `kotlin`.
hilt                        = "2.60.1"
hiltNavigationCompose       = "1.2.0"
navigationCompose           = "2.8.3"
# NACHGESEHEN in der Metadatei von 3.0.0: Retrofit 3 verlangt okhttp
# 4.12.0 und kotlin-stdlib 2.1.21 — beides als `requires`, also WEICH.
# Gradle nimmt bei einem Streit die hoehere Fassung, hier also unsere
# okhttp 5.3.0 unten; es gibt keinen Zwangsabstieg auf 4.12.0.
#
# Dass Retrofit 3 mit okhttp 5 laeuft, ist damit NICHT bewiesen, nur
# nicht verboten: Retrofit 3 ist gegen die API von okhttp 4.12.0
# uebersetzt. Belegt wird es erst von den Tests, die mockwebserver
# benutzen und bei dieser Zusammenfuehrung erstmals beide Spruenge
# gemeinsam durchlaufen.
#
# Der Konverter (retrofitKotlinxSerialization) bleibt auf 1.0.0: Eine
# neuere gibt es nicht, und seine POM nennt retrofit 2.9.0 als Mindestmass.
# Die benutzte Stelle ist asConverterFactory() auf einer Converter.Factory,
# und die Schnittstelle ist in Retrofit 3 unveraendert.
retrofit                    = "3.0.0"
# Deckt vier Artefakte ab, alle ueber dieselbe Referenz: okhttp,
# okhttp-sse, logging-interceptor und mockwebserver. NACHGESEHEN, dass es
# alle vier auf 5.3.0 gibt — auch das alte `mockwebserver` (okhttp 5 bringt
# daneben ein neues `mockwebserver3`, das wir nicht brauchen).
#
# ── WARUM 5.3.0 UND NICHT 5.5.0 ─────────────────────────────────────────
#
# 5.5.0 war der erste Versuch, und der Lauf ist daran gescheitert — vor dem
# ersten Test, mit `Task :app:checkDebugAarMetadata FAILED`. Der Grund steht
# in den AAR-Metadaten des Pakets selbst, nachgelesen und nicht geraten:
#
#   okhttp-android 5.5.0 → minCompileSdk=37
#   okhttp-android 5.3.0 → minCompileSdk=1   (und ebenso 5.2.1, 5.1.0, 5.0.0)
#
# Wir fahren compileSdk 36. Auf 37 zu gehen waere keine Kleinigkeit: Der
# Kommentar bei compileSdk haelt ausdruecklich fest, dass compileSdk und
# targetSdk gleich bleiben sollen — ein compileSdk darueber hiesse, gegen
# eine API zu bauen, deren Verhalten man nicht uebernimmt. targetSdk zu
# heben ist eine eigene Entscheidung mit eigener Pruefung und gehoert nicht
# als Nebenwirkung in eine Abhaengigkeits-Auffrischung.
#
# 5.3.0 bringt denselben Hauptsprung ohne diesen Zwang. Sobald das Projekt
# ohnehin auf SDK 37 geht, ist 5.5.0 eine Zahl.
#
# Voraussetzungen geprueft: okhttp 5 will Android 5+ und Java 8+, wir fahren
# minSdk 26 und Java 17. kotlin-stdlib 2.2.21 liegt unter unseren 2.3.20.
okhttp                      = "5.3.0"
# GEMESSEN am 05.10. aus den Gradle-Metadaten der Artefakte selbst:
#   serialization-json 1.10.0 → kotlin-stdlib 2.3.0
#   serialization-json 1.11.0 → kotlin-stdlib 2.3.20
#
# Als diese Zahl gesetzt wurde, war unser Uebersetzer Kotlin 2.3.0, und
# 1.11.0 haette eine stdlib NEUER als den Uebersetzer gezogen. Dieser Grund
# ist inzwischen entfallen: `kotlin` steht oben auf 2.3.20, 1.11.0 waere
# also moeglich. Die Zahl bleibt trotzdem auf 1.10.0 — sie zu heben ist eine
# eigene Entscheidung mit eigenem Lauf und gehoert nicht als Nebenwirkung in
# die Aufloesung einer Zusammenfuehrung.
kotlinxSerializationJson    = "1.10.0"
retrofitKotlinxSerialization = "1.0.0"
graphicsPath                = "1.1.0"   # 16-KB-Versuch, siehe app/build.gradle.kts
datastore                   = "1.1.7"   # NICHT auf 1.2.0 heben: dort ist die native Bibliothek wieder 4-KB-ausgerichtet
appcompat                   = "1.7.0"
profileinstaller            = "1.4.1"
# NICHT 3.4.0 und nicht 3.6.3, obwohl es beide gibt. GEMESSEN aus den
# Gradle-Metadaten:
#   coil3 3.3.0 → kotlin-stdlib 2.2.0
#   coil3 3.4.0 → kotlin-stdlib 2.3.10
#   coil3 3.6.3 → kotlin-stdlib 2.4.10
#
# Als 3.3.0 gesetzt wurde, war unser Uebersetzer Kotlin 2.3.0 und 3.3.0
# damit die hoechste erreichbare. Mit Kotlin 2.3.20 aus #28 waere 3.4.0
# jetzt moeglich — der Kommentar sagte das voraus, und es trifft zu.
#
# Sie bleibt trotzdem auf 3.3.0, und zwar aus einem Grund, der nicht die
# Zahl ist: Der Sprung von coil 2 auf coil 3 hat 81 Stellen in 30 Dateien
# angefasst, und zwei Namen darin (OkHttpNetworkFetcherFactory,
# memoryCacheKeyExtra) wurden erst nach einem roten Lauf in den QUELLEN von
# 3.3.0 nachgesehen — die Dokumentation nannte die Java-Sicht. Diese
# Pruefung gilt fuer 3.3.0, nicht fuer 3.4.0. Auf 3.4.0 zu gehen heisst,
# sie zu wiederholen: eine eigene Aenderung mit eigenem Lauf, keine
# Nebenwirkung einer Zusammenfuehrung.
#
# 3.6.3 ist auf unabsehbare Zeit ausser Reichweite, weil es Kotlin 2.4
# verlangt. GEMESSEN am 06.10. an der maven-metadata.xml von
# symbol-processing-gradle-plugin: <latest> und <release> stehen beide auf
# 2.3.12, und eine KSP-Fassung fuer Kotlin 2.4 gibt es UEBERHAUPT NICHT —
# null Treffer auf "2.4" in der ganzen Metadatei. Kotlin selbst ist zu
# diesem Zeitpunkt bei 2.4.20 (stabil) bzw. 2.5.0-Beta1. Der Deckel ist
# also KSP, nicht Kotlin, und er sitzt hier fest, weil Hilts Codeerzeugung
# ueber KSP laeuft (app/build.gradle.kts: `ksp(libs.hilt.compiler)`).
coil                        = "3.3.0"
# 1.11.0 verlangt kotlin-stdlib 2.2.20, liegt also UNTER unseren 2.3.20 —
# anders als serialization oben kein Konflikt. Ebenfalls aus den
# Gradle-Metadaten gelesen, nicht geschaetzt.
coroutines                  = "1.11.0"
# WorkManager fuer den stuendlichen Preisalarm-Abruf. Reine Java-/Kotlin-
# Bibliothek — sie bringt KEINE native .so mit und beruehrt die
# 16-KB-Ausrichtung deshalb nicht (siehe INVARIANTEN.md). Room und
# androidx.sqlite kommen transitiv mit, nutzen aber das SQLite des Systems;
# das gebuendelte SQLite waere ein eigener, hier nicht gezogener Artefakt.
work                        = "2.10.0"
junit                       = "4.13.2"
# org.json steckt in android.jar nur als Attrappe — siehe Kommentar bei
# testImplementation(libs.json) in app/build.gradle.kts.
orgJson                     = "20260814"
# Testabhängigkeiten (Nachtrag 117). Bis dahin war JUnit die EINZIGE, weshalb
# 41 von 47 Testdateien Quelltext lesen mussten statt Verhalten auszuführen.
# coroutinesTest folgt bewusst der coroutines-Version — die beiden müssen
# zusammenpassen, sonst scheitert runTest zur Laufzeit statt beim Übersetzen.

[libraries]
junit                               = { group = "junit",                      name = "junit",                             version.ref = "junit" }
json                                = { group = "org.json",                   name = "json",                              version.ref = "orgJson" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",           version.ref = "coroutines" }
okhttp-mockwebserver                = { group = "com.squareup.okhttp3",       name = "mockwebserver",                     version.ref = "okhttp" }
androidx-core-ktx                   = { group = "androidx.core",              name = "core-ktx",                          version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",             version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",          name = "activity-compose",                  version.ref = "activityCompose" }
androidx-compose-bom                = { group = "androidx.compose",           name = "compose-bom",                       version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-navigation-compose         = { group = "androidx.navigation",        name = "navigation-compose",                version.ref = "navigationCompose" }
hilt-android                        = { group = "com.google.dagger",          name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",          name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",              name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }
retrofit                            = { group = "com.squareup.retrofit2",      name = "retrofit",                          version.ref = "retrofit" }
okhttp-logging                      = { group = "com.squareup.okhttp3",       name = "logging-interceptor",               version.ref = "okhttp" }
okhttp-sse                          = { group = "com.squareup.okhttp3",       name = "okhttp-sse",                        version.ref = "okhttp" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",        version.ref = "kotlinxSerializationJson" }
retrofit-kotlinx-serialization      = { group = "com.jakewharton.retrofit",   name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
androidx-datastore                  = { group = "androidx.datastore",         name = "datastore-preferences",             version.ref = "datastore" }
androidx-work                       = { group = "androidx.work",              name = "work-runtime-ktx",                  version.ref = "work" }
androidx-graphics-path              = { group = "androidx.graphics",          name = "graphics-path",                     version.ref = "graphicsPath" }
androidx-appcompat                  = { group = "androidx.appcompat",         name = "appcompat",                         version.ref = "appcompat" }
androidx-profileinstaller           = { group = "androidx.profileinstaller",  name = "profileinstaller",                  version.ref = "profileinstaller" }
coil-compose                        = { group = "io.coil-kt.coil3",           name = "coil-compose",                      version.ref = "coil" }
# Coil 3 ist mehrplattformfaehig und laedt deshalb NICHT mehr von sich aus
# aus dem Netz — der Weg ueber http(s) steckt in einem eigenen Artefakt.
# Ohne das zeigt die App stumm keine Bilder mehr.
coil-network-okhttp                 = { group = "io.coil-kt.coil3",           name = "coil-network-okhttp",               version.ref = "coil" }
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",        name = "ui-tooling" }
camerax-core                        = { group = "androidx.camera",            name = "camera-core",                       version.ref = "camerax" }
camerax-camera2                     = { group = "androidx.camera",            name = "camera-camera2",                    version.ref = "camerax" }
camerax-lifecycle                   = { group = "androidx.camera",            name = "camera-lifecycle",                  version.ref = "camerax" }
camerax-view                        = { group = "androidx.camera",            name = "camera-view",                       version.ref = "camerax" }
mlkit-barcode                       = { group = "com.google.android.gms",     name = "play-services-mlkit-barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-textrec                       = { group = "com.google.mlkit",           name = "text-recognition",                     version.ref = "mlkitTextRec" }
accompanist-permissions             = { group = "com.google.accompanist",     name = "accompanist-permissions",           version.ref = "accompanistPermissions" }

[plugins]
android-application     = { id = "com.android.application",                    version.ref = "agp" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
