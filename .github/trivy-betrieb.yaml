  # postgres:18-alpine (neuester Digest am 11.11.2026): krb5 und libxslt
  - id: CVE-2026-107364
    purls:
      - "pkg:apk/alpine/krb5-libs"
      - "pkg:apk/alpine/krb5-conf"
      - "pkg:apk/alpine/libxslt"
    expired_at: 2026-11-25
    statement: "krb5 trifft fast nur KDC und kadmind, die im Container nicht laufen; GSSAPI ist nicht eingerichtet. libxslt braucht nur die Erweiterung xml2, die nicht geladen wird. Behoben mit dem nächsten Bau des Images."
