# Bewusst hingenommene Lücken in den fremden Betriebs-Images aus
# Web-App/compose.yaml (PostgreSQL). Gelesen vom Job trivy-compose in
# .github/workflows/sicherheit.yml; jede Lücke, die hier nicht steht, macht
# den Lauf rot. Caddy wird hier gebaut und ohne Ausnahmen geprüft (trivy-eigenbau).
#
# Jede Ausnahme gilt nur für die genannte Datei (paths) bzw. die genannten
# Pakete (purls, ohne Fassung: jede Fassung): Taucht dieselbe Lücke in einem
# anderen Paket auf, ist der Lauf rot. Nach expired_at gilt sie nicht mehr.
# Eine Ausnahme ersetzt nie den neuen Digest, sie überbrückt nur die Zeit bis
# dahin. Format: Trivy „.trivyignore.yaml“; trivy-action erkennt es an der
# Endung .yaml und reicht es als TRIVY_IGNOREFILE weiter.
vulnerabilities:

  # postgres:18-alpine (neuester Digest am 06.11.2026): Go-stdlib in gosu
  - id: CVE-2025-61726
    paths:
      - "usr/local/bin/gosu"
    expired_at: 2026-12-01
    statement: "gosu gibt nur beim Start die Rechte ab und spricht kein Netz; behoben erst mit einem neuen Bau des Images."
