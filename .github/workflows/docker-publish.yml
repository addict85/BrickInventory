name: Docker-Image veroeffentlichen

# Baut das Image aus Web-App/ und veroeffentlicht es auf Docker Hub als
# docker.io/addict85/brickinventory.
#
# ── Warum zwei Jobs statt einem ──────────────────────────────────────────────
# Ein einzelner Job mit "platforms: linux/amd64,linux/arm64" muesste arm64 unter
# QEMU emulieren — fuer `npm ci` samt sharp und esbuild bedeutet das ein
# Vielfaches der Bauzeit und gelegentliche Abstuerze im Emulator.
#
# Dieses Repository ist oeffentlich, damit stehen GitHubs arm64-Runner
# (ubuntu-24.04-arm) kostenlos bereit. Jede Architektur baut deshalb NATIV auf
# ihrem eigenen Runner und schiebt das Ergebnis ohne Tag als reinen Digest
# hoch; der merge-Job fasst die Digests danach zu EINEM Multi-Arch-Manifest
# zusammen. Ein `docker pull addict85/brickinventory` holt anschliessend auf dem
# Pi automatisch arm64 und auf einem PC amd64.
on:
  push:
    branches: ["main"]
    paths:
      - "Web-App/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Zusaetzlicher Tag (optional, z. B. 2026.08.29)"
        type: string
        required: false

env:
  IMAGE: addict85/brickinventory
  CONTEXT: Web-App
  # Die Plattformen, die am Ende IM MANIFEST stehen muessen. Der letzte Schritt
  # prueft das und laesst den Lauf scheitern, wenn eine fehlt.
  #
  # Diese Liste und die build-Matrix unten muessen zusammenpassen — sie stehen
  # getrennt, weil die Matrix zusaetzlich den passenden Runner braucht.
  #
  # Warum genau diese zwei:
  #   linux/amd64  — PC, Server, NAS, jede x86-Cloud
  #   linux/arm64  — Raspberry Pi 3/4/5 und Zero 2 W mit 64-Bit-System,
  #                  Apple Silicon, ARM-Server (Graviton, Ampere)
  #
  # NICHT dabei ist linux/arm/v7 (32-Bit-Pi-OS), und das ist kein Versehen:
  # Dieses Image steht auf Alpine (musl), und fuer musl+armv7 gibt es kein
  # sharp-Paket — @img/sharp-linuxmusl-arm existiert auf npm nicht, nur die
  # glibc-Fassung. Ein armv7-Image liesse sich zwar bauen, die Bildverarbeitung
  # fiele darin aber still auf den deutlich langsameren Jimp-Rueckfall zurueck.
  # Ein Image zu veroeffentlichen, das nur so aussieht wie die anderen, ist
  # schlechter als keines. Wer armv7 wirklich braucht, muss zuerst das
  # Basis-Image auf Debian slim (glibc) umstellen.
  ERWARTETE_PLATTFORMEN: "linux/amd64 linux/arm64"


concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.plattform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            runner: ubuntu-latest
          - plattform: linux/arm64
            # Nativer ARM-Runner. Faellt GitHub die Bezeichnung weg, ist der
            # Rueckfall: runner ubuntu-latest + QEMU (Schritt unten einkommentieren)
            # — dann dauert dieser Job statt ~5 eher ~40 Minuten.
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # Frueh und mit klarer Meldung scheitern, statt spaeter im Login mit
      # "unauthorized: incorrect username or password".
      - name: Zugangsdaten vorhanden?
        env:
          NUTZER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$NUTZER" ] || [ -z "$TOKEN" ]; then
            echo "::error::Die Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN fehlen."
            echo "Anzulegen unter: Repository -> Settings -> Secrets and variables -> Actions."
            echo "Das Token kommt von https://app.docker.com/settings/personal-access-tokens"
            echo "und braucht das Recht 'Read & Write'."
            exit 1
          fi

      - name: Plattformnamen fuer Dateinamen ableiten
        run: echo "PAAR=${{ matrix.plattform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Beschriftungen erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Bauen und als Digest hochladen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: ${{ matrix.plattform }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: ohne Tag hochladen. Der Tag entsteht erst im
          # merge-Job, sonst wuerde die zweite Architektur die erste
          # ueberschreiben statt sich dazuzustellen.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plattform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plattform }}

      # Der Dateiname IST der Digest (ohne "sha256:"-Vorsatz). Der merge-Job
      # baut daraus wieder die vollstaendigen Referenzen zusammen.
      - name: Digest ablegen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PAAR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest zusammenfuehren
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags festlegen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Multi-Arch-Manifest erzeugen und pushen
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)

      # PRUEFEN, nicht nur anzeigen.
      #
      # Ohne diese Zusicherung koennte ein Manifest mit nur einer Architektur
      # veroeffentlicht werden — auf dem Entwicklungsrechner faellt das nie auf,
      # der Pi bekaeme aber beim Ziehen "no matching manifest for
      # linux/arm64/v8". Genau die Art Fehler, die erst beim Nutzer auftritt.
      #
      # Die "unknown"-Eintraege stammen von den Attestierungen, die buildx
      # mitschiebt; sie sind keine Architekturen und werden ausgefiltert.
      - name: Manifest pruefen — sind alle Plattformen drin?
        run: |
          set -eu
          TAG="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          echo "Geprueft wird: $TAG"
          docker buildx imagetools inspect "$TAG" --raw > manifest.json
          GEFUNDEN="$(jq -r '
            [ .manifests[]
              | select(.platform.os == "linux" and .platform.architecture != "unknown")
              | "linux/" + .platform.architecture
            ] | unique | join(" ")' manifest.json)"
          echo "Im Manifest: $GEFUNDEN"
          echo "Erwartet   : $ERWARTETE_PLATTFORMEN"
          fehlt=""
          for p in $ERWARTETE_PLATTFORMEN; do
            case " $GEFUNDEN " in (*" $p "*) ;; (*) fehlt="$fehlt $p" ;; esac
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Im veroeffentlichten Manifest fehlt:$fehlt (enthalten: $GEFUNDEN)"
            exit 1
          fi
          echo "Alle erwarteten Plattformen sind im Manifest."
          docker buildx imagetools inspect "$TAG"
