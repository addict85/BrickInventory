name: Web-App

# Baut die Images aus Web-App/ und veröffentlicht sie als docker.io/addict85/brickinventory
# (app, jobs, schluessel, …) und docker.io/addict85/brickinventory-caddy (Dockerfile.caddy).
#
# Je Architektur ein Job auf einem nativen Runner (arm64 unter QEMU dauerte ein
# Vielfaches und stürzte ab); der merge-Job fasst die Digests zu einem
# Multi-Arch-Manifest zusammen, signiert es und hängt Herkunft und Stückliste an.
# Gebaut wird nur nach grüner CI auf genau diesem Commit auf main, auch beim
# Handstart. Hochladen und Signieren laufen in der Umgebung `docker-hub`
# (docs/SICHERHEIT.md).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Zusaetzlicher Tag (optional, z. B. 2026.08.29)"
        type: string
        required: false

env:
  IMAGE: addict85/brickinventory
  # Caddy ist der einzige Dienst mit offenen Ports: signiert und bescheinigt wie das App-Image.
  CADDY_IMAGE: addict85/brickinventory-caddy
  CONTEXT: Web-App
  # Muss im Manifest stehen; der letzte Schritt prüft das. Passt zur Matrix
  # unten. Kein linux/arm/v7: Für Alpine (musl) auf armv7 gibt es kein sharp,
  # die Bildverarbeitung fiele still auf Jimp zurück. Ein Image, das nur so
  # aussieht wie die anderen, ist schlechter als keines.
  ERWARTETE_PLATTFORMEN: "linux/amd64 linux/arm64"


concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: CI gruen und Web-App geaendert?
    runs-on: ubuntu-latest
    # Nur ein Push auf main DIESES Repositorys. `branches: ["main"]` oben prueft
    # nur den Zweignamen des ausloesenden Laufs — auch ein Fork-PR aus einem
    # Zweig namens main passt darauf und baute sonst mit unseren Secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: read
    outputs:
      bauen: ${{ steps.p.outputs.bauen }}
      sha: ${{ steps.p.outputs.sha }}
      kurz: ${{ steps.p.outputs.kurz }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      # workflow_run kennt keinen paths-Filter. Der Vergleich mit dem ersten
      # Elternteil deckt auch einen Merge-Commit ab.
      - id: p
        env:
          EREIGNIS: ${{ github.event_name }}
          ERGEBNIS: ${{ github.event.workflow_run.conclusion }}
          # Nur über env, nie eingesetzt: Eine zweite Zeile im Tag stünde sonst
          # als weiterer Eintrag in tags/build-args. Erlaubt ist die Docker-Tag-Form.
          TAG_EINGABE: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -n "$TAG_EINGABE" ] && ! [[ "$TAG_EINGABE" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Ungültiger Tag (erlaubt: Buchstaben, Ziffern, _ . -, höchstens 128 Zeichen, einzeilig)."
            exit 1
          fi
          echo "tag=$TAG_EINGABE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "kurz=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EREIGNIS" = "workflow_dispatch" ]; then
            SHA=$(git rev-parse HEAD)
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Handstart nur auf main ($REF) — signiert wird nur, was die CI dort geprüft hat."
              exit 1
            fi
            gruen=$(gh api "repos/$REPO/actions/workflows/web-ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count') || gruen=0
            if ! [ "${gruen:-0}" -ge 1 ] 2>/dev/null; then
              echo "::error::Kein grüner CI-Lauf auf $SHA — kein Image."
              exit 1
            fi
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          elif [ "$ERGEBNIS" != "success" ]; then
            echo "CI auf diesem Commit: $ERGEBNIS — kein Image."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(Web-App/|\.github/workflows/docker-publish\.yml)'; then
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Aenderung an Web-App/ — kein Image."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.plattform }}
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'true'
    environment: docker-hub
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            runner: ubuntu-latest
          - plattform: linux/arm64
            # Rückfall ohne ARM-Runner: ubuntu-latest mit QEMU (rund 40 statt 5 Minuten).
            runner: ubuntu-24.04-arm

    steps:
      # Genau der Commit, auf dem die CI gruen war — nicht der neueste auf main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pruefen.outputs.sha }}
          persist-credentials: false

      # Frueh und mit klarer Meldung scheitern, statt spaeter im Login mit
      # "unauthorized: incorrect username or password".
      - name: Zugangsdaten vorhanden?
        env:
          NUTZER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$NUTZER" ] || [ -z "$TOKEN" ]; then
            echo "::error::Die Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN fehlen."
            echo "Anzulegen unter: Repository -> Settings -> Secrets and variables -> Actions."
            echo "Das Token kommt von https://app.docker.com/settings/personal-access-tokens"
            echo "und braucht das Recht 'Read & Write'."
            exit 1
          fi

      - name: Plattformnamen fuer Dateinamen ableiten
        run: echo "PAAR=${{ matrix.plattform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Beschriftungen erzeugen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      - name: Bauen und als Digest hochladen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: ${{ matrix.plattform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Die Version im Server (dist/version.json): der angegebene Tag, sonst der Commit.
          build-args: |
            APP_VERSION=${{ needs.pruefen.outputs.tag != '' && needs.pruefen.outputs.tag || format('sha-{0}', needs.pruefen.outputs.kurz) }}
          # push-by-digest: ohne Tag hochladen. Der Tag entsteht erst im
          # merge-Job, sonst wuerde die zweite Architektur die erste
          # ueberschreiben statt sich dazuzustellen.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Ohne Zwischenspeicher: Den GHA-Cache auf main beschreibt auch die CI
          # mit allen Entwicklungspaketen; eine vergiftete Schicht trüge sonst die Signatur.
          no-cache: true
          # Herkunft (SLSA) und Stückliste je Plattform hängen am Image. Der
          # Scanner der Stückliste fest per Digest wie jedes andere Image hier.
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

      # Der Dateiname IST der Digest (ohne "sha256:"-Vorsatz). Der merge-Job
      # baut daraus wieder die vollstaendigen Referenzen zusammen.
      - name: Digest ablegen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      # Die Hauptversionen der Actions sind an der Laufzeit (runs.using in
      # action.yml) nachgesehen, nicht von der Nachbarzeile abgeschrieben:
      # download-artifact wechselt erst mit v7 auf node24.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ env.PAAR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # Caddy wie das App-Image: ohne Cache, mit Herkunft und Stückliste je Plattform.
      - name: Caddy bauen und als Digest hochladen
        id: caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile.caddy
          platforms: ${{ matrix.plattform }}
          outputs: type=image,name=${{ env.CADDY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

      - name: Caddy-Digest ablegen
        env:
          DIGEST: ${{ steps.caddy.outputs.digest }}
        run: |
          mkdir -p /tmp/digests-caddy
          touch "/tmp/digests-caddy/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caddy-digest-${{ env.PAAR }}
          path: /tmp/digests-caddy/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest zusammenfuehren
    runs-on: ubuntu-latest
    needs: [pruefen, build]
    environment: docker-hub
    # id-token: write nur hier: cosign und die Attestierungen holen sich damit
    # ein kurzlebiges OIDC-Zertifikat von Sigstore (keyless). attestations:
    # write legt die Nachweise zusätzlich bei GitHub ab (gh attestation verify).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Für die npm-Stückliste: genau der Commit, aus dem das Image gebaut ist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pruefen.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests-caddy
          pattern: caddy-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags festlegen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ needs.pruefen.outputs.kurz }}
            type=raw,value=${{ needs.pruefen.outputs.tag }},enable=${{ needs.pruefen.outputs.tag != '' }}

      # Der Digest kommt aus der Ausgabe des Pushs, nicht aus einer späteren
      # Auflösung des Tags: Hinge jemand den Tag dazwischen um, signierte die
      # Pipeline sonst ein fremdes Manifest.
      - name: Multi-Arch-Manifest erzeugen und pushen
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/manifest-meta.json" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
          DIGEST="$(jq -r '.["containerimage.descriptor"].digest // .["containerimage.digest"] // empty' "$RUNNER_TEMP/manifest-meta.json")"
          case "$DIGEST" in (sha256:*) ;; (*) echo "::error::Kein Digest in der Ausgabe des Pushs"; cat "$RUNNER_TEMP/manifest-meta.json"; exit 1 ;; esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Prüfen, nicht nur anzeigen: Ein Manifest ohne arm64 fiele erst auf dem
      # Pi auf („no matching manifest“). Die „unknown“-Einträge sind
      # Attestierungen, keine Architekturen.
      - name: Manifest pruefen — sind alle Plattformen drin?
        run: |
          set -eu
          TAG="${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}"
          echo "Geprueft wird: $TAG"
          docker buildx imagetools inspect "$TAG" --raw > manifest.json
          GEFUNDEN="$(jq -r '
            [ .manifests[]
              | select(.platform.os == "linux" and .platform.architecture != "unknown")
              | "linux/" + .platform.architecture
            ] | unique | join(" ")' manifest.json)"
          echo "Im Manifest: $GEFUNDEN"
          echo "Erwartet   : $ERWARTETE_PLATTFORMEN"
          fehlt=""
          for p in $ERWARTETE_PLATTFORMEN; do
            case " $GEFUNDEN " in (*" $p "*) ;; (*) fehlt="$fehlt $p" ;; esac
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Im veroeffentlichten Manifest fehlt:$fehlt (enthalten: $GEFUNDEN)"
            exit 1
          fi
          echo "Alle erwarteten Plattformen sind im Manifest."
          docker buildx imagetools inspect "$TAG"

      # Vor der Signatur: Eine behebbare Lücke ab high hält die Veröffentlichung
      # auf, auch wenn der Workflow „Sicherheit“ für diesen Stand noch läuft.
      - name: Lücken im veröffentlichten Digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Keyless signiert: Die Signatur bindet den Digest an diesen Workflow auf
      # main, nachprüfbar ohne Schlüsselaustausch (Befehl im README, Abschnitt
      # Docker). --recursive signiert das Manifest und jede Plattform darin.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Image signieren
        id: signatur
        run: |
          set -eu
          DIGEST="${{ steps.manifest.outputs.digest }}"
          case "$DIGEST" in (sha256:*) ;; (*) echo "::error::Kein Digest aus dem Push ($DIGEST)"; exit 1 ;; esac
          cosign sign --yes --recursive "${{ env.IMAGE }}@$DIGEST"
          echo "Signiert: ${{ env.IMAGE }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Stückliste der npm-Abhängigkeiten im Image (CycloneDX) aus der
      # Lockfile, ohne Installation und ohne Install-Skripte.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Stückliste (CycloneDX) erzeugen
        working-directory: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          npm sbom --omit=dev --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/sbom.cdx.json"
          node -e 'const s = require(process.argv[1]); if (s.bomFormat !== "CycloneDX" || !(s.components || []).length) process.exit(1); console.log(s.components.length + " Pakete")' "$RUNNER_TEMP/sbom.cdx.json"

      # Nachweise am Digest: woher das Image kommt (Workflow, Commit) und was
      # darin steckt. Prüfen: gh attestation verify oci://docker.io/addict85/brickinventory@<digest> -R <owner>/<repo>
      - name: Herkunft bescheinigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.signatur.outputs.digest }}
          push-to-registry: true

      - name: Stückliste bescheinigen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.signatur.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.cdx.json
          push-to-registry: true

      # ── Caddy: dieselben Schritte für das zweite Image ─────────────────────
      - name: Caddy-Tags festlegen
        id: meta-caddy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.CADDY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ needs.pruefen.outputs.kurz }}
            type=raw,value=${{ needs.pruefen.outputs.tag }},enable=${{ needs.pruefen.outputs.tag != '' }}

      - name: Caddy-Manifest erzeugen und pushen
        id: manifest-caddy
        working-directory: /tmp/digests-caddy
        env:
          META: ${{ steps.meta-caddy.outputs.json }}
        run: |
          set -eu
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/caddy-meta.json" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META") \
            $(printf "${{ env.CADDY_IMAGE }}@sha256:%s " *)
          DIGEST="$(jq -r '.["containerimage.descriptor"].digest // .["containerimage.digest"] // empty' "$RUNNER_TEMP/caddy-meta.json")"
          case "$DIGEST" in (sha256:*) ;; (*) echo "::error::Kein Digest in der Ausgabe des Caddy-Pushs"; exit 1 ;; esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Caddy-Manifest pruefen — sind alle Plattformen drin?
        env:
          TAG: ${{ env.CADDY_IMAGE }}@${{ steps.manifest-caddy.outputs.digest }}
        run: |
          set -eu
          GEFUNDEN="$(docker buildx imagetools inspect "$TAG" --raw | jq -r '
            [ .manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown")
              | "linux/" + .platform.architecture ] | unique | join(" ")')"
          for p in $ERWARTETE_PLATTFORMEN; do
            case " $GEFUNDEN " in (*" $p "*) ;; (*) echo "::error::Im Caddy-Manifest fehlt $p (enthalten: $GEFUNDEN)"; exit 1 ;; esac
          done

      - name: Lücken im veröffentlichten Caddy-Digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CADDY_IMAGE }}@${{ steps.manifest-caddy.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Caddy signieren
        id: signatur-caddy
        run: |
          set -eu
          DIGEST="${{ steps.manifest-caddy.outputs.digest }}"
          case "$DIGEST" in (sha256:*) ;; (*) echo "::error::Kein Digest aus dem Caddy-Push ($DIGEST)"; exit 1 ;; esac
          cosign sign --yes --recursive "${{ env.CADDY_IMAGE }}@$DIGEST"
          echo "Signiert: ${{ env.CADDY_IMAGE }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Kein npm im Caddy-Image: Die Stückliste liest Trivy aus dem signierten Digest.
      - name: Caddy-Stückliste (CycloneDX) erzeugen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.CADDY_IMAGE }}@${{ steps.signatur-caddy.outputs.digest }}
          format: cyclonedx
          output: ${{ runner.temp }}/caddy.cdx.json
          exit-code: '0'
          skip-setup-trivy: true

      - name: Caddy-Stückliste pruefen
        run: |
          node -e 'const s = require(process.argv[1]); if (s.bomFormat !== "CycloneDX" || !(s.components || []).length) process.exit(1); console.log(s.components.length + " Pakete")' "$RUNNER_TEMP/caddy.cdx.json"

      - name: Caddy-Herkunft bescheinigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.CADDY_IMAGE }}
          subject-digest: ${{ steps.signatur-caddy.outputs.digest }}
          push-to-registry: true

      - name: Caddy-Stückliste bescheinigen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: index.docker.io/${{ env.CADDY_IMAGE }}
          subject-digest: ${{ steps.signatur-caddy.outputs.digest }}
          sbom-path: ${{ runner.temp }}/caddy.cdx.json
          push-to-registry: true
