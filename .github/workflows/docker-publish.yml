name: Web-App

# Baut das Image aus Web-App/ und veroeffentlicht es auf Docker Hub als
# docker.io/addict85/brickinventory.
#
# ── Warum zwei Jobs statt einem ──────────────────────────────────────────────
# Ein einzelner Job mit "platforms: linux/amd64,linux/arm64" muesste arm64 unter
# QEMU emulieren — fuer `npm ci` samt sharp und esbuild bedeutet das ein
# Vielfaches der Bauzeit und gelegentliche Abstuerze im Emulator.
#
# Dieses Repository ist oeffentlich, damit stehen GitHubs arm64-Runner
# (ubuntu-24.04-arm) kostenlos bereit. Jede Architektur baut deshalb NATIV auf
# ihrem eigenen Runner und schiebt das Ergebnis ohne Tag als reinen Digest
# hoch; der merge-Job fasst die Digests danach zu EINEM Multi-Arch-Manifest
# zusammen. Ein `docker pull addict85/brickinventory` holt anschliessend auf dem
# Pi automatisch arm64 und auf einem PC amd64.
#
# Gebaut wird erst, wenn die CI auf demselben Commit grün ist (workflow_run):
# Ein Image aus einem Stand mit roten Tests landete sonst als `latest` auf
# jedem Pi, der neu zieht.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Zusaetzlicher Tag (optional, z. B. 2026.08.29)"
        type: string
        required: false

env:
  IMAGE: addict85/brickinventory
  CONTEXT: Web-App
  # Die Plattformen, die am Ende IM MANIFEST stehen muessen. Der letzte Schritt
  # prueft das und laesst den Lauf scheitern, wenn eine fehlt.
  #
  # Diese Liste und die build-Matrix unten muessen zusammenpassen — sie stehen
  # getrennt, weil die Matrix zusaetzlich den passenden Runner braucht.
  #
  # Warum genau diese zwei:
  #   linux/amd64  — PC, Server, NAS, jede x86-Cloud
  #   linux/arm64  — Raspberry Pi 3/4/5 und Zero 2 W mit 64-Bit-System,
  #                  Apple Silicon, ARM-Server (Graviton, Ampere)
  #
  # NICHT dabei ist linux/arm/v7 (32-Bit-Pi-OS), und das ist kein Versehen:
  # Dieses Image steht auf Alpine (musl), und fuer musl+armv7 gibt es kein
  # sharp-Paket — @img/sharp-linuxmusl-arm existiert auf npm nicht, nur die
  # glibc-Fassung. Ein armv7-Image liesse sich zwar bauen, die Bildverarbeitung
  # fiele darin aber still auf den deutlich langsameren Jimp-Rueckfall zurueck.
  # Ein Image zu veroeffentlichen, das nur so aussieht wie die anderen, ist
  # schlechter als keines. Wer armv7 wirklich braucht, muss zuerst das
  # Basis-Image auf Debian slim (glibc) umstellen.
  ERWARTETE_PLATTFORMEN: "linux/amd64 linux/arm64"


concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: CI gruen und Web-App geaendert?
    runs-on: ubuntu-latest
    # Nur ein Push auf main DIESES Repositorys. `branches: ["main"]` oben prueft
    # nur den Zweignamen des ausloesenden Laufs — auch ein Fork-PR aus einem
    # Zweig namens main passt darauf und baute sonst mit unseren Secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      bauen: ${{ steps.p.outputs.bauen }}
      sha: ${{ steps.p.outputs.sha }}
      kurz: ${{ steps.p.outputs.kurz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      # workflow_run kennt keinen paths-Filter. Der Vergleich mit dem ersten
      # Elternteil deckt auch einen Merge-Commit ab.
      - id: p
        env:
          EREIGNIS: ${{ github.event_name }}
          ERGEBNIS: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "kurz=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EREIGNIS" = "workflow_dispatch" ]; then
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          elif [ "$ERGEBNIS" != "success" ]; then
            echo "CI auf diesem Commit: $ERGEBNIS — kein Image."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(Web-App/|\.github/workflows/docker-publish\.yml)'; then
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Aenderung an Web-App/ — kein Image."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.plattform }}
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            runner: ubuntu-latest
          - plattform: linux/arm64
            # Nativer ARM-Runner. Faellt GitHub die Bezeichnung weg, ist der
            # Rueckfall: runner ubuntu-latest + QEMU (Schritt unten einkommentieren)
            # — dann dauert dieser Job statt ~5 eher ~40 Minuten.
            runner: ubuntu-24.04-arm

    steps:
      # Genau der Commit, auf dem die CI gruen war — nicht der neueste auf main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.pruefen.outputs.sha }}

      # Frueh und mit klarer Meldung scheitern, statt spaeter im Login mit
      # "unauthorized: incorrect username or password".
      - name: Zugangsdaten vorhanden?
        env:
          NUTZER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$NUTZER" ] || [ -z "$TOKEN" ]; then
            echo "::error::Die Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN fehlen."
            echo "Anzulegen unter: Repository -> Settings -> Secrets and variables -> Actions."
            echo "Das Token kommt von https://app.docker.com/settings/personal-access-tokens"
            echo "und braucht das Recht 'Read & Write'."
            exit 1
          fi

      - name: Plattformnamen fuer Dateinamen ableiten
        run: echo "PAAR=${{ matrix.plattform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Beschriftungen erzeugen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      - name: Bauen und als Digest hochladen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: ${{ matrix.plattform }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: ohne Tag hochladen. Der Tag entsteht erst im
          # merge-Job, sonst wuerde die zweite Architektur die erste
          # ueberschreiben statt sich dazuzustellen.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plattform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plattform }}

      # Der Dateiname IST der Digest (ohne "sha256:"-Vorsatz). Der merge-Job
      # baut daraus wieder die vollstaendigen Referenzen zusammen.
      - name: Digest ablegen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      # ── Fassungen: nachgesehen, nicht geraten ─────────────────────────────
      #
      # Hier standen checkout@v4, upload-artifact@v4 und download-artifact@v4.
      # In android.yml steht seit laengerem ein Absatz dazu, dass v4 und v5 auf
      # Node 20 laufen und bei jedem Lauf warnen — die Recherche wurde einmal
      # gemacht, dort aufgeschrieben, und diese Datei blieb stehen. Dieselbe
      # Regel an zwei Stellen, eine davon gepflegt.
      #
      # Am Tag der Aenderung abgerufen (runs.using aus der action.yml):
      #
      #   checkout            v4 node20   v5 node24   v6 node24
      #   upload-artifact     v4 node20   v5 node20   v6 node24
      #   download-artifact   v4 node20   v5 node20   v6 node20   v7 node24
      #
      # Beachten: Bei download-artifact haette der naheliegende Sprung auf v6 —
      # gleiche Zahl wie bei den anderen — die Warnung NICHT beseitigt. Erst v7
      # wechselt die Laufzeit. Wer hier wieder anfasst: nachsehen, nicht die
      # Nummer der Nachbarzeile abschreiben.
      #
      # Geprueft wurde ausserdem, dass die benutzten Eingaben es noch gibt:
      # `pattern` und `merge-multiple` stehen auch in v7; die Aenderung in v5
      # betrifft die Ablage EINZELNER Artefakte ohne merge-multiple.
      #
      # ── Nachtrag: eine Hauptversion weiter, aus anderem Grund ─────────────
      #
      # Die Tabelle darueber bleibt richtig. Gehoben wurde jetzt NICHT wegen
      # einer Warnung, sondern weil die Frage „sind alle verwendeten Fassungen
      # die neuesten" auch fuer die Actions gilt — und die standen in keinem
      # Katalog und in keiner package.json, also hat sie niemand gemessen.
      #
      # Gemessen wurde mit demselben Handgriff wie oben, nur umgedreht: ob ein
      # hoeherer Haupt-Tag UEBERHAUPT existiert. api.github.com ist aus dieser
      # Umgebung gesperrt (403), raw.githubusercontent.com nicht:
      #
      #     raw.githubusercontent.com/<action>/v7/action.yml  -> 200 = gibt es
      #                                      .../v9, v42, v99 -> 404 = gibt es nicht
      #
      # Die Gegenprobe mit v9, v42, v99 und vXYZ war noetig: Ohne sie waere
      # „200 bei jedem geprueften Tag" nicht von „der Abruf antwortet immer
      # 200" zu unterscheiden gewesen.
      #
      # Jede neue Hauptversion laeuft auf node24 — die Laufzeit aendert sich
      # also nicht, es gibt hier keine Warnung zu beseitigen und auch keine
      # einzufangen.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ env.PAAR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest zusammenfuehren
    runs-on: ubuntu-latest
    needs: [pruefen, build]
    # id-token: write nur hier: cosign holt sich damit ein kurzlebiges
    # OIDC-Zertifikat von Sigstore (keyless), es gibt keinen Schlüssel zu hüten.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags festlegen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ needs.pruefen.outputs.kurz }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Multi-Arch-Manifest erzeugen und pushen
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)

      # PRUEFEN, nicht nur anzeigen.
      #
      # Ohne diese Zusicherung koennte ein Manifest mit nur einer Architektur
      # veroeffentlicht werden — auf dem Entwicklungsrechner faellt das nie auf,
      # der Pi bekaeme aber beim Ziehen "no matching manifest for
      # linux/arm64/v8". Genau die Art Fehler, die erst beim Nutzer auftritt.
      #
      # Die "unknown"-Eintraege stammen von den Attestierungen, die buildx
      # mitschiebt; sie sind keine Architekturen und werden ausgefiltert.
      - name: Manifest pruefen — sind alle Plattformen drin?
        run: |
          set -eu
          TAG="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          echo "Geprueft wird: $TAG"
          docker buildx imagetools inspect "$TAG" --raw > manifest.json
          GEFUNDEN="$(jq -r '
            [ .manifests[]
              | select(.platform.os == "linux" and .platform.architecture != "unknown")
              | "linux/" + .platform.architecture
            ] | unique | join(" ")' manifest.json)"
          echo "Im Manifest: $GEFUNDEN"
          echo "Erwartet   : $ERWARTETE_PLATTFORMEN"
          fehlt=""
          for p in $ERWARTETE_PLATTFORMEN; do
            case " $GEFUNDEN " in (*" $p "*) ;; (*) fehlt="$fehlt $p" ;; esac
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Im veroeffentlichten Manifest fehlt:$fehlt (enthalten: $GEFUNDEN)"
            exit 1
          fi
          echo "Alle erwarteten Plattformen sind im Manifest."
          docker buildx imagetools inspect "$TAG"

      # Keyless signiert: Die Signatur bindet den Digest an diesen Workflow auf
      # main, nachprüfbar ohne Schlüsselaustausch (Befehl im README, Abschnitt
      # Docker). --recursive signiert das Manifest und jede Plattform darin.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Image signieren
        run: |
          set -eu
          TAG="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$DIGEST" in (sha256:*) ;; (*) echo "::error::Kein Digest für $TAG ($DIGEST)"; exit 1 ;; esac
          cosign sign --yes --recursive "${{ env.IMAGE }}@$DIGEST"
          echo "Signiert: ${{ env.IMAGE }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
