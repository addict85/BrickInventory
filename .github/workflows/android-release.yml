name: Android-Release

# Signiert und veröffentlicht ein Etikett android-v…. Läuft immer in der Fassung
# auf main: nach einem grünen Lauf von Android-App zum Etikett oder von Hand mit
# dem Etikett als Eingabe. Das Etikett ist nur Datenquelle (Artefakte nach
# Prüfsumme); sein eigener Workflow kommt an keine Environment (docs/ANDROID-RELEASE.md).
on:
  workflow_run:
    workflows: [Android-App]
    types: [completed]
  workflow_dispatch:
    inputs:
      etikett:
        description: 'Etikett android-v…, dessen grüner Baulauf signiert und veröffentlicht wird'
        type: string
        required: true

permissions:
  contents: read

jobs:
  # ── Etikett prüfen: welches, welcher Commit, welcher Baulauf ─────────────
  #
  # Kein Checkout, keine Secrets. Ein Zweig namens android-v… zählt nicht: Das
  # Etikett muss es geben und auf genau den gebauten Commit zeigen.
  etikett:
    name: Etikett prüfen
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'android-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      etikett: ${{ steps.etikett.outputs.etikett }}
      commit: ${{ steps.etikett.outputs.commit }}
      lauf: ${{ steps.etikett.outputs.lauf }}
      sha256_apk: ${{ steps.summen.outputs.sha256_apk }}
      sha256_aab: ${{ steps.summen.outputs.sha256_aab }}
    steps:
      - name: Etikett zeigt auf den gebauten Commit
        id: etikett
        env:
          GH_TOKEN: ${{ github.token }}
          EINGABE: ${{ inputs.etikett }}
          AUS_LAUF: ${{ github.event.workflow_run.head_branch }}
          LAUF_COMMIT: ${{ github.event.workflow_run.head_sha }}
          LAUF_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          NAME="${EINGABE:-$AUS_LAUF}"
          if ! printf '%s' "$NAME" | grep -Eq '^android-v[0-9A-Za-z._-]{1,64}$'; then
            echo "::error::„$NAME“ ist kein Etikett android-v…. Nichts wird signiert."
            exit 1
          fi
          if ! REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NAME" --jq '"\(.object.type) \(.object.sha)"'); then
            echo "::error::Es gibt kein Etikett $NAME (ein Zweig dieses Namens zählt nicht). Nichts wird signiert."
            exit 1
          fi
          ART=${REF% *}; COMMIT=${REF#* }
          # Ein annotiertes Etikett zeigt erst auf sein Etikett-Objekt.
          if [ "$ART" = tag ]; then COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$COMMIT" --jq .object.sha); fi
          if [ -n "$LAUF_ID" ]; then
            LAUF="$LAUF_ID"
            if [ "$COMMIT" != "$LAUF_COMMIT" ]; then
              echo "::error::$NAME zeigt auf $COMMIT, gebaut wurde $LAUF_COMMIT. Nichts wird signiert."
              exit 1
            fi
          else
            LAUF=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?event=push&branch=$NAME&head_sha=$COMMIT&status=success&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
          fi
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$' || ! printf '%s' "$LAUF" | grep -Eq '^[0-9]+$'; then
            echo "::error::Für $NAME gibt es keinen grünen Baulauf. Nichts wird signiert."
            exit 1
          fi
          { echo "etikett=$NAME"; echo "commit=$COMMIT"; echo "lauf=$LAUF"; } >> "$GITHUB_OUTPUT"
          echo "$NAME → $COMMIT, Baulauf $LAUF"

      # Ein Etikett kann jeder mit Schreibrecht auf jeden Commit setzen; signiert
      # wird nur, was schon auf main liegt, also durch Review und CI ging.
      - name: Etikett liegt auf main
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKETT: ${{ steps.etikett.outputs.etikett }}
          COMMIT: ${{ steps.etikett.outputs.commit }}
        run: |
          set -euo pipefail
          STAND=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$COMMIT" --jq .status)
          case "$STAND" in
            identical|behind) echo "$ETIKETT ($COMMIT) liegt auf main." ;;
            *) echo "::error::$ETIKETT zeigt auf $COMMIT, der nicht auf main liegt ($STAND). Nichts wird signiert."; exit 1 ;;
          esac

      # „Liegt auf main“ heisst nur dann „ging durch Review und CI“, wenn main das
      # erzwingt. Gelesen werden die Regeln des Zweigs (Ruleset).
      - name: main ist geschützt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! ARTEN=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[].type] | unique | join(",")'); then
            echo "::error::Die Regeln von main liessen sich nicht lesen. Nichts wird signiert."
            exit 1
          fi
          for regel in pull_request required_status_checks non_fast_forward; do
            case ",$ARTEN," in
              *",$regel,"*) ;;
              *) echo "::error::main hat keine Regel $regel (Settings → Rules → Rulesets, docs/ANDROID-RELEASE.md). Nichts wird signiert."; exit 1 ;;
            esac
          done
          echo "main: $ARTEN"

      # „Nur ein Admin setzt ein Etikett, keines wird umgehängt“ gilt nur mit dem
      # Tag-Ruleset (docs/ANDROID-RELEASE.md, Schritt 3). Gelesen werden die aktiven
      # Tag-Rulesets, die dieses Etikett treffen.
      - name: Etiketten sind geschützt
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKETT: ${{ steps.etikett.outputs.etikett }}
        run: |
          set -euo pipefail
          if ! LISTE=$(gh api "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&includes_parents=true&per_page=100"); then
            echo "::error::Die Tag-Rulesets liessen sich nicht lesen. Nichts wird signiert."
            exit 1
          fi
          ARTEN=","
          for ID in $(printf '%s' "$LISTE" | jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id'); do
            if ! REGELN=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ID?includes_parents=true"); then
              echo "::error::Das Tag-Ruleset $ID liess sich nicht lesen. Nichts wird signiert."
              exit 1
            fi
            TRIFFT=nein
            while IFS= read -r MUSTER; do
              [ -n "$MUSTER" ] || continue
              # shellcheck disable=SC2053 # das Muster ist ein Glob
              if [ "$MUSTER" = "~ALL" ] || [[ "refs/tags/$ETIKETT" == $MUSTER ]]; then TRIFFT=ja; fi
            done < <(printf '%s' "$REGELN" | jq -r '.conditions.ref_name.include[]?')
            while IFS= read -r MUSTER; do
              [ -n "$MUSTER" ] || continue
              # shellcheck disable=SC2053
              if [[ "refs/tags/$ETIKETT" == $MUSTER ]]; then TRIFFT=nein; fi
            done < <(printf '%s' "$REGELN" | jq -r '.conditions.ref_name.exclude[]?')
            if [ "$TRIFFT" = ja ]; then ARTEN="$ARTEN$(printf '%s' "$REGELN" | jq -r '[.rules[].type] | join(",")'),"; fi
          done
          for regel in creation update deletion; do
            case "$ARTEN" in
              *",$regel,"*) ;;
              *) echo "::error::Kein aktives Tag-Ruleset mit der Regel $regel trifft $ETIKETT (Settings → Rules → Rulesets, docs/ANDROID-RELEASE.md). Nichts wird signiert."; exit 1 ;;
            esac
          done
          echo "$ETIKETT: ${ARTEN//,/ }"

      # Die Lückenprüfung der Laufzeit-Abhängigkeiten (sicherheit.yml, Job
      # android-abhaengigkeiten) muss für genau diesen Commit grün sein.
      - name: Abhängigkeiten ohne bekannte Lücke
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.etikett.outputs.commit }}
        run: |
          set -euo pipefail
          LAUF=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sicherheit.yml/runs?head_sha=$COMMIT&status=completed&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
          if [ -z "$LAUF" ]; then
            echo "::error::Für $COMMIT gibt es noch keinen abgeschlossenen Sicherheitslauf. Abwarten, dann diesen Lauf neu starten."
            exit 1
          fi
          ERGEBNIS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LAUF/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("Trivy (Android-Abhängigkeiten")) | .conclusion] | first // "fehlt"')
          if [ "$ERGEBNIS" != success ]; then
            echo "::error::Die Lückenprüfung der Android-Abhängigkeiten war für $COMMIT nicht grün ($ERGEBNIS, Lauf $LAUF). Nichts wird signiert."
            exit 1
          fi
          echo "Android-Abhängigkeiten ohne bekannte Lücke (Sicherheitslauf $LAUF)."

      # Die Prüfsummen, die der Baujob gleich nach dem Bau mass, bezeugt der Job
      # „Übergabe an das Signieren“ (ohne Projektcode) als Anmerkung. Nur seine zählt.
      - name: Prüfsummen aus der Übergabe
        id: summen
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF: ${{ steps.etikett.outputs.lauf }}
        run: |
          set -euo pipefail
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LAUF/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Übergabe an das Signieren" and .conclusion == "success") | .id] | join(" ")')
          set -- $JOBS
          if [ "$#" -ne 1 ]; then
            echo "::error::Im Baulauf $LAUF gibt es nicht genau eine grüne Übergabe ($#). Nichts wird signiert."
            exit 1
          fi
          NOTIZ=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$1/annotations" \
            --jq '[.[] | select(.title == "Prüfsummen zum Signieren") | .message] | if length == 1 then .[0] else "" end')
          APK=$(printf '%s' "$NOTIZ" | sed -nE 's/^apk=([0-9a-f]{64}) aab=([0-9a-f]{64})$/\1/p')
          AAB=$(printf '%s' "$NOTIZ" | sed -nE 's/^apk=([0-9a-f]{64}) aab=([0-9a-f]{64})$/\2/p')
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "::error::Die Übergabe im Baulauf $LAUF nennt keine eindeutigen Prüfsummen. Nichts wird signiert."
            exit 1
          fi
          { echo "sha256_apk=$APK"; echo "sha256_aab=$AAB"; } >> "$GITHUB_OUTPUT"

      # Signiert der Inhaber offline, braucht die Freigabe in release erst zu kommen, wenn
      # die signierten Dateien da sind. Sonst steht hier, was zu signieren ist.
      - name: Offline signierte Dateien vorhanden?
        if: vars.ANDROID_SIGNIERWEG == 'offline'
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKETT: ${{ steps.etikett.outputs.etikett }}
          LAUF: ${{ steps.etikett.outputs.lauf }}
          APK: ${{ steps.summen.outputs.sha256_apk }}
          AAB: ${{ steps.summen.outputs.sha256_aab }}
        run: |
          set -euo pipefail
          MUSTER="^signiert-$(printf '%s' "$ETIKETT" | sed 's/[.]/\\./g')(-[0-9]+)?\$"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
               --jq '.[] | select(.prerelease and (.draft | not)) | .tag_name' | grep -Eq "$MUSTER"; then
            {
              echo "## Offline signieren"
              echo ""
              echo "Aus dem Baulauf $LAUF das Artefakt \`apk-unsigniert\` holen und prüfen:"
              echo ""
              echo "    $APK  apk/release/app-release-unsigned.apk"
              echo "    $AAB  bundle/release/app-release.aab"
              echo ""
              echo "Dann signieren und als Vorab-Release \`signiert-$ETIKETT\` ablegen (docs/ANDROID-RELEASE.md, „Offline signieren“) und diesen Workflow von Hand mit dem Etikett neu starten."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Offline-Signatur fehlt::Noch keine Vorab-Release signiert-$ETIKETT (Anleitung in der Zusammenfassung dieses Laufs). Nichts wird signiert."
            exit 1
          fi

  # ── Signieren und prüfen: aus main, Schlüssel nur in den Environments ────
  signieren:
    needs: etikett
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/android-signieren.yml
    secrets: inherit
    with:
      echt: true
      lauf: ${{ needs.etikett.outputs.lauf }}
      etikett: ${{ needs.etikett.outputs.etikett }}
      commit: ${{ needs.etikett.outputs.commit }}
      sha256_apk: ${{ needs.etikett.outputs.sha256_apk }}
      sha256_aab: ${{ needs.etikett.outputs.sha256_aab }}

  # ── Herkunft bescheinigen: in einem eigenen, wiederverwendbaren Workflow ──
  #
  # Aussteller ist android-bescheinigung.yml; bescheinigt wird, was der Signierjob ausgab.
  bescheinigen:
    needs: signieren
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/android-bescheinigung.yml
    with:
      sha256_apk: ${{ needs.signieren.outputs.sha256_apk }}
      sha256_beschreibung: ${{ needs.signieren.outputs.sha256_beschreibung }}
      sha256_aab: ${{ needs.signieren.outputs.sha256_aab }}

  # ── Veröffentlichen: der einzige Job mit Schreibrecht ─────────────────────
  #
  # Was hier landet, holt sich jede installierte App als Update; darum auch hier
  # die Environment release und ihre Pflichtprüfer.
  release:
    needs: [etikett, signieren, bescheinigen]
    environment: release
    runs-on: ubuntu-24.04
    # Zwei Etiketten zugleich: Sonst prüften beide gegen dieselbe alte Fassung,
    # und das ältere könnte nach dem neueren als „Latest“ erscheinen.
    concurrency:
      group: android-release-neuste
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Signiertes APK holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-signiert
          path: Android-App/app/build/outputs

      # Jeder Job eines Laufs kann Artefakte ersetzen; veröffentlicht wird nur, was
      # der Signierjob ausgegeben hat.
      - name: Artefakt gegen die Prüfsummen des Signierjobs
        env:
          APK_SOLL: ${{ needs.signieren.outputs.sha256_apk }}
          BESCHREIBUNG_SOLL: ${{ needs.signieren.outputs.sha256_beschreibung }}
          AAB_SOLL: ${{ needs.signieren.outputs.sha256_aab }}
        run: |
          set -euo pipefail
          A=app/build/outputs
          printf '%s  %s\n' "$APK_SOLL" "$A/apk/release/BrickInventory.apk" \
            "$BESCHREIBUNG_SOLL" "$A/version-signiert.json" "$AAB_SOLL" "$A/bundle/release/app-release.aab" | sha256sum -c -

      # Ein Release-Anhang statt eines Artefakts: Artefakte liefert GitHub nur als
      # Zip, ein Anhang kommt roh, ohne Konto und ohne Verfall. Releases sind
      # unveränderlich („Immutable releases“): Alles kommt beim Anlegen mit, und der
      # feste Link folgt über /releases/latest/ der als „Latest“ markierten Fassung.
      - name: BrickInventory.apk als Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          QUELLE: ${{ needs.etikett.outputs.etikett }}
          COMMIT: ${{ needs.etikett.outputs.commit }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/BrickInventory.apk
          BESCHREIBUNG=app/build/outputs/version-signiert.json
          LINK="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/BrickInventory.apk"
          # Neuinstallationen prüfen gegen den festgenagelten Wert (sec17 B-N9), nicht gegen GitHub.
          ZERT=$(grep -Eo '^[0-9a-f]{64}' tools/release-certificate.sha256 | head -1)

          META=app/build/outputs/apk/release/output-metadata.json
          if [ ! -f "$META" ]; then
            echo "::error::$META fehlt — ohne die Werte von AGP koennte hier nur geraten werden."
            exit 1
          fi
          V_CODE=$(jq -r '.elements[0].versionCode' "$META")
          V_NAME=$(jq -r '.elements[0].versionName' "$META")
          if ! printf '%s' "$V_CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::versionCode aus $META ist \"$V_CODE\" — keine Zahl."
            exit 1
          fi
          if [ -z "$V_NAME" ] || [ "$V_NAME" = null ]; then
            echo "::error::versionName aus $META ist leer."
            exit 1
          fi

          # Dieselbe Regel wie im Job apk-pruefen (tools/release-check.py fassung),
          # hier unter der concurrency-Gruppe unmittelbar vor dem Anlegen. Ohne
          # Werkzeug aus dem Repository: Dieser Job hat Schreibrecht.
          if ! NEUSTE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || [ -z "$NEUSTE" ]; then
            echo "::error::Die als „Latest“ markierte Release liess sich nicht lesen. Nichts wird veröffentlicht."
            exit 1
          fi
          # Übergang: Die Fassungen bis android-v2026.11.12.1 tragen keine Beschreibung;
          # dann gilt der eingefrorene Stand von apk-neuste.
          ALT="$RUNNER_TEMP/version-alt.json"
          if gh release download "$NEUSTE" -p version-signiert.json -O "$RUNNER_TEMP/alt.json" --clobber ||
             gh release download apk-neuste -p version-signiert.json -O "$RUNNER_TEMP/alt.json" --clobber; then
            jq -r .daten "$RUNNER_TEMP/alt.json" | base64 -d > "$ALT"
          elif ! gh release download apk-neuste -p version.json -O "$ALT" --clobber; then
            ALT=
          fi
          if [ -n "$ALT" ]; then
            ALT_CODE=$(jq -r '.versionCode' "$ALT")
            ALT_COMMIT=$(jq -r '.commit' "$ALT")
            if ! printf '%s' "$ALT_CODE" | grep -Eq '^[0-9]+$' || [ "$V_CODE" -lt "$ALT_CODE" ] ||
               { [ "$V_CODE" -eq "$ALT_CODE" ] && [ "$ALT_COMMIT" != "$COMMIT" ]; }; then
              echo "::error::versionCode $V_CODE folgt nicht auf das veröffentlichte $ALT_CODE ($ALT_COMMIT). Nichts wird veröffentlicht."
              exit 1
            fi
          fi

          # Die signierte Beschreibung zeigt auf BrickInventory-<versionCode>.apk;
          # BrickInventory.apk ist dieselbe Datei unter dem Namen des festen Links.
          FASSUNG="BrickInventory-${V_CODE}.apk"
          cp "$APK" "$RUNNER_TEMP/$FASSUNG"
          TEXT="Gebaut aus dem Etikett \`$QUELLE\` ($COMMIT), Fassung $V_CODE, am $(date -u '+%d.%m.%Y %H:%M UTC').

          Signierzertifikat SHA-256: \`$ZERT\`
          Vor einer Neuinstallation prüfen: apksigner verify --print-certs BrickInventory.apk
          (die Zeile „certificate SHA-256 digest“ muss genau diesen Wert zeigen).
          Herkunft prüfen: gh attestation verify BrickInventory.apk --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/android-bescheinigung.yml

          Direkter Download (immer die neuste Fassung, kein Zip):
          $LINK"
          if ! gh release view "$QUELLE" >/dev/null 2>&1; then
            gh release create "$QUELLE" "$RUNNER_TEMP/$FASSUNG" "$APK" "$BESCHREIBUNG" \
              --verify-tag --latest --title "BrickInventory $V_NAME" --notes "$TEXT"
            DRAUSSEN_BESCHREIBUNG="$BESCHREIBUNG"
          else
            # Wiederholter Lauf: Die Release nimmt nichts mehr an, verglichen wird nur.
            # Die Beschreibung trägt je Lauf eine neue Signatur; sie muss nur dastehen.
            for NAME in "$FASSUNG" BrickInventory.apk; do
              if ! gh release download "$QUELLE" -p "$NAME" -O "$RUNNER_TEMP/vorhanden-$NAME" ||
                 ! cmp -s "$RUNNER_TEMP/vorhanden-$NAME" "$APK"; then
                echo "::error::$QUELLE trägt kein oder ein anderes $NAME; eine unveränderliche Release nimmt keinen Anhang an. Ein neues Etikett setzen, nur das Etikett, keine Release."
                exit 1
              fi
            done
            DRAUSSEN_BESCHREIBUNG="$RUNNER_TEMP/vorhanden-signiert.json"
            if ! gh release download "$QUELLE" -p version-signiert.json -O "$DRAUSSEN_BESCHREIBUNG"; then
              echo "::error::$QUELLE trägt keine version-signiert.json; ohne sie findet keine App das Update. Ein neues Etikett setzen."
              exit 1
            fi
          fi

          # Nicht der Ausgabe von `gh` glauben, sondern jeden Anhang zurückfragen: Ein
          # abgebrochener Upload liefert sonst einen Link auf ein halbes APK.
          for PAAR in "$FASSUNG=$APK" "BrickInventory.apk=$APK" "version-signiert.json=$DRAUSSEN_BESCHREIBUNG"; do
            NAME=${PAAR%%=*}; LOKAL=$(stat -c%s "${PAAR#*=}")
            DRAUSSEN=$(gh release view "$QUELLE" --json assets \
              --jq ".assets[] | select(.name==\"$NAME\") | .size")
            if [ "$DRAUSSEN" != "$LOKAL" ]; then
              echo "::error::$QUELLE meldet für $NAME $DRAUSSEN Bytes, lokal sind es $LOKAL. Anhang unvollstaendig; ein neues Etikett setzen."
              exit 1
            fi
          done

          {
            echo "## APK zum direkten Herunterladen"
            echo ""
            echo "**$LINK**"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Groesse | $(stat -c%s "$APK") Bytes |"
            echo "| Fassung | $V_CODE ($V_NAME) |"
            echo "| Gebaut aus | \`$QUELLE\` ($COMMIT) |"
            echo ""
            echo "> Kein Zip: Ein Release-Anhang wird roh ausgeliefert. Der Link folgt"
            echo "> der als „Latest“ markierten Release und braucht kein GitHub-Konto."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Google Play: das signierte Bundle in einen Test-Track einliefern ─────
  #
  # Ohne Checkout und ohne Drittaktion: nur curl, jq und openssl gegen die
  # Android Publisher API, damit das Dienstkonto keinen Projektcode sieht.
  # Fehlt PLAY_SERVICE_ACCOUNT_JSON, bleibt es bei einem Hinweis (GitHub-Release
  # genügt). Der erste Upload einer neuen App geht von Hand (docs/ANDROID-RELEASE.md).
  play:
    needs: [etikett, signieren, release]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Signiertes Bundle holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-signiert
          path: signiert

      - name: Bundle gegen die Prüfsumme des Signierjobs
        env:
          AAB_SOLL: ${{ needs.signieren.outputs.sha256_aab }}
        run: printf '%s  %s\n' "$AAB_SOLL" signiert/bundle/release/app-release.aab | sha256sum -c -

      # Eigener Schritt, wie der Signier- und der Beschreibungsschlüssel: Kein anderer Schritt
      # dieser Workflows sieht ein Secret (tools/release-paths.test.js).
      - name: Play-Schlüssel bereitstellen
        id: play_schluessel
        env:
          KONTO: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$KONTO" ]; then
            echo "::notice title=Google Play::PLAY_SERVICE_ACCOUNT_JSON fehlt in der Environment release; nichts eingeliefert."
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          S="$RUNNER_TEMP/play"; (umask 077; mkdir -p "$S"; printf '%s' "$KONTO" > "$S/konto.json"; jq -r .private_key "$S/konto.json" > "$S/key.pem")
          echo "vorhanden=true" >> "$GITHUB_OUTPUT"

      - name: In Google Play einliefern
        if: steps.play_schluessel.outputs.vorhanden == 'true'
        env:
          PAKET: ch.brickinventoryapp
          # Neue Apps nehmen nur Entwürfe an; nach der ersten Freigabe PLAY_STATUS=completed.
          TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          STATUS: ${{ vars.PLAY_STATUS || 'draft' }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/play"
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          JETZT=$(date +%s)
          KOPF=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          INHALT=$(jq -cn --arg iss "$(jq -r .client_email "$S/konto.json")" --arg aud "$(jq -r .token_uri "$S/konto.json")" \
            --argjson iat "$JETZT" --argjson exp "$((JETZT + 600))" \
            '{iss:$iss, scope:"https://www.googleapis.com/auth/androidpublisher", aud:$aud, iat:$iat, exp:$exp}' | b64url)
          SIG=$(printf '%s.%s' "$KOPF" "$INHALT" | openssl dgst -sha256 -sign "$S/key.pem" | b64url)
          TOKEN=$(curl -fsS "$(jq -r .token_uri "$S/konto.json")" \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d "assertion=$KOPF.$INHALT.$SIG" | jq -r .access_token)
          rm -f "$S/key.pem" "$S/konto.json"
          echo "::add-mask::$TOKEN"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PAKET"
          AUTH="Authorization: Bearer $TOKEN"
          EDIT=$(curl -fsS -X POST -H "$AUTH" "$API/edits" | jq -r .id)
          CODE=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/octet-stream' \
            --data-binary @signiert/bundle/release/app-release.aab \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PAKET/edits/$EDIT/bundles?uploadType=media" | jq -r .versionCode)
          jq -n --arg t "$TRACK" --arg c "$CODE" --arg s "$STATUS" '{track:$t, releases:[{versionCodes:[$c], status:$s}]}' \
            | curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: application/json' --data @- "$API/edits/$EDIT/tracks/$TRACK" > /dev/null
          curl -fsS -X POST -H "$AUTH" "$API/edits/$EDIT:commit" > /dev/null
          echo "## Google Play" >> "$GITHUB_STEP_SUMMARY"
          echo "versionCode $CODE im Track \`$TRACK\` (Status \`$STATUS\`) eingeliefert." >> "$GITHUB_STEP_SUMMARY"
