name: Android-App

# Läuft bei jedem Push auf JEDEN Zweig, bei jedem Pull-Request, der die App
# berührt — und von Hand über den Knopf "Run workflow".
#
# Zweck: Der Übersetzungs- und Testbefund kommt automatisch, ohne dass jemand
# lokal bauen muss. Am Ende steht eine installierbare BrickInventory.apk.
#
# ── Warum `'**'` und nicht mehr nur `main` (Nachtrag 125) ───────────────────
#
# Hier stand `branches: [main]`. Die Web-CI stand daneben auf `branches: ['**']`
# — dieselbe Regel in zwei Fassungen, und die App zog den Kürzeren: Ein Zweig
# ist genau der Ort, an dem man den Befund BRAUCHT, nämlich bevor etwas nach
# main geht.
#
# GEMESSEN an dieser Sitzung: vier Pushes auf einen Zweig, alle mit Änderungen
# unter Android-App/. Die Web-CI lief viermal von selbst. Der Android-Lauf kein
# einziges Mal — er musste jedes Mal von Hand angestossen werden. Dreimal wurde
# er dabei rot (Läufe 88, 89, 90), und jedes dieser drei Male stand der Fehler
# schon im gepushten Zweig, ohne dass irgendetwas es gesagt hätte.
#
# Android übersetzt in der Entwicklungsumgebung dieses Projekts nicht
# (dl.google.com antwortet mit 403). Diese Action ist damit der EINZIGE Ort, an
# dem Kotlin überhaupt übersetzt wird. Ein Übersetzer, der nur auf main läuft,
# sagt es erst, wenn es zu spät ist.
#
# Der concurrency-Block unten bricht ältere Läufe desselben Zweigs ab, die
# `paths`-Filter halten Läufe fern, die die App gar nicht berühren — die Kosten
# bleiben also da, wo sie hingehören.
on:
  push:
    branches: ['**']
    # Veröffentlicht wird nur aus einem Etikett android-v… auf einem Commit von
    # main (Job `signieren`), nicht aus jedem Push auf main. Für Etiketten wertet
    # GitHub den paths-Filter nicht aus.
    tags: ['android-v*']
    paths:
      - 'Android-App/**'
      # shared/ ist der gemeinsame Pruefkorpus beider Apps (siehe shared/README.md).
      # SetnummerKorpusTest liest ihn — wer nur dort etwas aendert, muss trotzdem
      # den Android-Lauf bekommen, sonst prueft ihn nur noch die Web-Seite.
      - 'shared/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android-App/**'
      - 'shared/**'
  workflow_dispatch:
    inputs:
      pruefsummen:
        description: 'Prüfsummen der Gradle-Abhängigkeiten neu erzeugen (verification-metadata.xml als Artefakt)'
        type: boolean
        default: false
      bildschirmfotos:
        description: 'Bildschirmfotos neu aufnehmen und als Referenz einchecken (nicht auf main)'
        type: boolean
        default: false

# Ein neuer Push bricht einen noch laufenden Bau desselben Zweigs ab — sonst
# stehen bei mehreren Pushes drei Läufe in der Schlange und der erste ist
# längst uninteressant.
concurrency:
  # Ein Prüfsummenlauf hat eine eigene Gruppe: Er bricht den Bau desselben
  # Zweigs sonst ab (gemessen am 30.10.: Lauf 41005196874 abgebrochen).
  group: android-${{ github.ref }}${{ inputs.pruefsummen && '-pruefsummen' || '' }}${{ inputs.bildschirmfotos && '-bildschirmfotos' || '' }}
  cancel-in-progress: true

jobs:
  build:
    # Ein Lauf nur für die Prüfsummen oder die Referenzbilder (Jobs unten) baut nicht mit.
    if: ${{ !inputs.pruefsummen && !inputs.bildschirmfotos }}
    runs-on: ubuntu-latest
    # Grüne Läufe brauchten 15–23 Minuten. Ein hängender Gradle-Daemon soll den
    # Runner nicht sechs Stunden halten; 60 lässt Raum für einen kalten Cache.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Android-App

    # Nur lesen: Bauen und Testen läuft mit allen Gradle-Plugins und auf jedem
    # Zweig — und ohne ein einziges Secret. Signiert wird im Job `signieren`,
    # schreiben darf allein `release`. Nicht genannte Bereiche stehen auf `none`.
    permissions:
      contents: read

    # Die Prüfsummen des unsignierten Ergebnisses, gemessen gleich nach dem Bau:
    # Der Signierjob signiert nur genau das (sec8 H10).
    outputs:
      sha256_apk: ${{ steps.pruefsumme.outputs.pruefsumme_apk }}
      sha256_aab: ${{ steps.pruefsumme.outputs.pruefsumme_aab }}

    steps:
      # Volle Historie samt Tags: versionCode zählt die Commits, versionName
      # kommt aus `git describe` (app/build.gradle.kts). Flach geklont wäre
      # jeder Bau Commit Nummer 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Der Bau führt Gradle-Plugins und Testcode aus; ein in .git/config
          # abgelegter Token wäre für jeden davon lesbar. Gebraucht wird er nicht.
          persist-credentials: false

      # JDK 17 — passt zu sourceCompatibility/targetCompatibility und jvmTarget
      # im app/build.gradle.kts. Verlangt AGP eine neuere Fassung, steht das
      # klar im Protokoll; dann hier auf '21' stellen. Die Zahlen im
      # Buildskript bleiben trotzdem auf 17.
      - name: JDK einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      # ── Vorabprüfung ────────────────────────────────────────────────────────
      #
      # Der Gradle-Wrapper besteht aus DREI Dateien, und zwei davon sind binär:
      # `gradle-wrapper.jar` kommt beim Zippen eines Projekts oft nicht mit, und
      # dann fehlt sie im Repository, ohne dass es jemandem auffällt.
      #
      # Ohne diese Prüfung scheitert der Lauf ein paar Schritte später mit einer
      # Meldung, die nicht sagt, was fehlt — `setup-gradle` prüft ab v4 die
      # Prüfsumme der Wrapper-JAR und bricht ab, `chmod` findet die Datei nicht,
      # oder Java meldet "Could not find or load main class
      # org.gradle.wrapper.GradleWrapperMain". Drei verschiedene Fehlerbilder für
      # dieselbe Ursache.
      - name: Gradle-Wrapper vorhanden?
        run: |
          set -eu
          fehlt=""
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] || fehlt="$fehlt $f"
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Im Repository fehlen:$fehlt"
            echo ""
            echo "Diese Dateien gehören ins Repository — ohne sie kann niemand bauen."
            echo "Aus dem lokalen Projekt nach Android-App/ kopieren und committen:"
            echo "  gradlew"
            echo "  gradlew.bat"
            echo "  gradle/wrapper/gradle-wrapper.jar"
            echo ""
            echo "Was tatsächlich da ist:"
            ls -la . gradle/wrapper 2>/dev/null || true
            exit 1
          fi
          echo "Wrapper vollständig."

      # ── Ist die festgenagelte Gradle-Prüfsumme die amtliche? ──────────────
      #
      # gradle-wrapper.properties nagelt die Verteilung auf eine sha256 fest.
      # Das ist der Riegel gegen ein ausgetauschtes Archiv — nur hat nie etwas
      # geprüft, ob die Zahl daneben die richtige IST. Eine beim Heben
      # verdrehte Ziffer bricht sofort und laut; eine Prüfsumme, die zu einem
      # FREMDEN Archiv passt, nicht.
      #
      # Der Schritt liest zusätzlich, welche Fassung die neueste ist und wie
      # IHRE Prüfsumme lautet — das ist die Zahl, die zum Heben nötig ist.
      # downloads.gradle.org ist aus der Entwicklungsumgebung gesperrt
      # (HTTP 000), von hier erreichbar. Erfinden ist keine Möglichkeit: Eine
      # falsche Zahl bricht jeden Build, eine entfernte Zeile wäre ein
      # geschwächter Riegel.
      #
      # Der Hinweis auf die neuere Fassung färbt NICHT rot — ob gehoben wird,
      # entscheidet ein Mensch. Rot ist die Abweichung, und rot ist auch ein
      # ausgefallener Abruf: ein stillschweigend übergangener Riegel ist
      # schlimmer als keiner.
      - name: Gradle-Prüfsumme gegen die amtliche
        run: python3 tools/gradle-wrapper-pruefen.py gradle/wrapper/gradle-wrapper.properties

      # Legt den Gradle-Cache an. Ohne das lädt jeder Lauf alle Abhängigkeiten
      # neu — mehrere Minuten pro Bau.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # Auf Windows committete Dateien tragen das Ausführbar-Bit oft nicht.
      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      # Bildschirmfotos: Liegen Referenzbilder im Repository, vergleicht der
      # Testlauf gegen sie und wird bei einer Abweichung rot; sonst nimmt er nur
      # auf. Eingecheckt werden sie mit workflow_dispatch bildschirmfotos=true
      # (Jobs `bildschirmfotos` und `bildschirmfotos-einchecken` unten).
      - name: Bildschirmfotos vergleichen oder aufnehmen?
        id: fotos
        run: |
          if [ -n "$(git ls-files 'app/src/test/bildschirmfotos/*.png')" ]; then
            echo "aufgabe=verifyRoborazziDebug" >> "$GITHUB_OUTPUT"
            echo "Referenzbilder eingecheckt: verglichen wird."
          else
            echo "aufgabe=recordRoborazziDebug" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bildschirmfotos::Keine Referenzbilder eingecheckt — nur aufgenommen. Einchecken: Workflow von Hand mit bildschirmfotos=true starten."
          fi

      # Zuerst die Tests: rund fünfzig Testdateien, die in Sekunden laufen und
      # das meiste abfangen, bevor der lange Übersetzungslauf beginnt.
      - name: Unit-Tests
        # tee: Gradle schreibt den Namen des roten Tests EINMAL, mitten in
        # hunderte Zeilen Aufgabenprotokoll. Ohne Mitschnitt ist er hinterher
        # nur ueber den Testbericht zu finden, und der liegt als Artefakt in
        # einer Ablage, die von hier aus nicht erreichbar ist.
        #
        # set -o pipefail: Ohne das bestimmt tee den Rueckgabewert, und ein
        # roter Testlauf ginge als Erfolg durch. Dieselbe Falle wie im
        # Web-Workflow.
        #
        # testDebugUnitTest läuft in jedem Android-Modul; core-model ist reines
        # Kotlin und hat stattdessen `test`.
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest :core-model:test ${{ steps.fotos.outputs.aufgabe }} 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Das Vergleichsbild liegt nur als Artefakt vor, das hier nicht abrufbar ist:
      # Lage und Grösse der Abweichung je rotem Foto stehen deshalb im Log.
      - name: Abweichende Fotos beschreiben
        if: failure()
        run: |
          for neu in app/build/outputs/roborazzi/*_actual.png; do
            [ -f "$neu" ] || continue
            name=$(basename "$neu" _actual.png)
            ref="app/src/test/bildschirmfotos/$name.png"
            [ -f "$ref" ] || continue
            pixel=$(compare -metric AE "$ref" "$neu" null: 2>&1 || true)
            feld=$(compare "$ref" "$neu" -compose src -highlight-color white -lowlight-color black miff:- 2>/dev/null \
              | convert - -trim -format '%wx%h+%X+%Y' info: 2>/dev/null || true)
            echo "::warning title=Foto weicht ab::$name: $pixel Pixel verschieden, Bereich $feld (Bild $(identify -format '%wx%h' "$ref"))"
          done

      # Room schreibt das Schema beim Übersetzen nach core-data/schemas und lässt eine
      # Datei stehen, solange ihr Aufbau gleich bleibt. Steht danach etwas
      # anderes da als eingecheckt, fehlt eine Fassung samt Migration.
      - name: Room-Schema eingecheckt?
        run: |
          geaendert=$(git status --porcelain -- core-data/schemas)
          if [ -n "$geaendert" ]; then
            echo "::error title=Room-Schema::Das Schema der Datenbank weicht vom eingecheckten ab — Fassung erhöhen, Migration schreiben, Datei einchecken:%0A$geaendert"
            git diff -- core-data/schemas > "$RUNNER_TEMP/schema.diff"
            head -80 "$RUNNER_TEMP/schema.diff"
            exit 1
          fi

      # ── Was rot war, als ANNOTATION ─────────────────────────────────────────
      #
      # Warum das noetig ist: Zweimal hintereinander war der Lauf rot, und die
      # einzige Annotation lautete „Process completed with exit code 1". Der
      # Testbericht liegt als Artefakt in einer Blob-Ablage, die der Proxy hier
      # mit 403 abweist — die Ursache war nur zu finden, indem das ganze
      # Protokoll durchgelesen wurde. GEMESSEN an den Laeufen 80 und 81.
      #
      # Der Web-Workflow macht das seit web-ci.yml genauso; hier fehlte es.
      #
      # BEIDE Faelle, aus demselben Grund wie dort: Ein Lauf kann rot sein,
      # OHNE dass ein einzelner Test fehlschlaegt — Lauf 81 scheiterte beim
      # UEBERSETZEN (ein fehlender Import), da gibt es keine „FAILED"-Zeile.
      # Eine Diagnose, die nur den erwarteten Ausgang abdeckt, schweigt genau
      # dann, wenn etwas Unerwartetes passiert.
      - name: Rote Tests auflisten
        if: failure()
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/test.log" ] || { echo "Kein Testprotokoll — der Lauf ist vorher gescheitert."; exit 0; }
          {
            echo "## Rote Tests"
            echo ""
            echo '```'
            grep -E '(FAILED$|^e: |error:)' "$RUNNER_TEMP/test.log" || echo "(keine — der Lauf ist an etwas anderem gescheitert)"
            echo '```'
            echo ""
            grep -E '[0-9]+ tests completed' "$RUNNER_TEMP/test.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

          # `FAILED$` trifft die Testzeile („Klasse > Name FAILED"); `^e: ` und
          # `error:` treffen Uebersetzungsfehler von Kotlin bzw. Gradle.
          rot=$(grep -E -c '(FAILED$|^e: )' "$RUNNER_TEMP/test.log" || true)
          if [ "${rot:-0}" -gt 0 ]; then
            while IFS= read -r zeile; do
              [ -n "$zeile" ] || continue
              echo "::error title=Android rot::${zeile}"
            done < <(grep -E -m 20 '(FAILED$|^e: )' "$RUNNER_TEMP/test.log" || true)
          else
            ende=$(tail -n 40 "$RUNNER_TEMP/test.log" | tr '\n' '~' | sed 's/%/%25/g; s/\r/%0D/g; s/~/%0A/g')
            echo "::error title=Lauf rot ohne einzelnen Fehlschlag::$ende"
          fi
          summe=$(grep -E '[0-9]+ tests completed' "$RUNNER_TEMP/test.log" | tr '\n' ' ' || true)
          echo "::notice title=Testsumme::${summe:-keine Summenzeile — der Lauf ist vor dem ersten Test gescheitert}"

      # Ohne Signier-Secrets: Gradle und alle Plugins laufen hier. Signiert wird
      # im Job `signieren`, der nur das Ergebnis dieses Jobs bekommt.
      - name: Release bauen
        id: bau
        # tee wie bei den Unit-Tests, aus einem zweiten Grund: Die
        # Warnungen des Übersetzers stehen NUR hier. Ohne Mitschnitt kann
        # `warnungen-zaehlen.py` weiter unten nichts zählen — und „0
        # Warnungen" wäre dann die beruhigendste aller Falschaussagen.
        #
        # set -o pipefail: ohne das bestimmt tee den Rückgabewert und ein
        # gescheiterter Bau ginge als Erfolg durch.
        run: |
          set -o pipefail
          # Ohne Build-Cache: Auf main kam R8 samt Ressourcen-Schrumpfen aus
          # dem Cache, und dem Ergebnis fehlten 80 Texte, die frisch gebaut
          # da sind. Das ausgelieferte APK wird deshalb immer frisch gerechnet.
          ./gradlew --no-daemon --no-build-cache assembleRelease bundleRelease 2>&1 \
            | tee "$RUNNER_TEMP/bau.log"

      # Gleich nach dem Bau, bevor Lint und weitere Gradle-Läufe Projektcode und
      # Plugins ausführen: Was danach am APK ändert, fällt im Signierjob auf.
      - name: Prüfsummen des unsignierten Ergebnisses
        id: pruefsumme
        run: |
          set -euo pipefail
          SUMME_APK=$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)
          SUMME_AAB=$(sha256sum app/build/outputs/bundle/release/app-release.aab | cut -d' ' -f1)
          echo "pruefsumme_apk=$SUMME_APK" >> "$GITHUB_OUTPUT"
          echo "pruefsumme_aab=$SUMME_AAB" >> "$GITHUB_OUTPUT"
          echo "unsigniert: APK $SUMME_APK, AAB $SUMME_AAB"

      # ── Warum ZUSÄTZLICH ein Bundle (.aab) ──────────────────────────────────
      #
      # Play nimmt seit August 2021 für neue Apps kein APK mehr an, nur noch ein
      # Android App Bundle. Das APK bleibt trotzdem: Es ist das, was man sich
      # hier aus den Artefakten zieht und direkt aufs Gerät schiebt. Ein .aab
      # lässt sich NICHT installieren — daraus schneidet erst Play die
      # geräte-passenden APKs.
      #
      # Beides entsteht im selben Gradle-Aufruf oben, damit der lange
      # Übersetzungslauf nur einmal stattfindet.

      # R8 läuft nur im Release-Build (isMinifyEnabled = true). Der Lint-Bericht
      # ist deshalb gerade hier interessant; abbrechen soll er nicht, das
      # entspricht abortOnError = false im Buildskript.
      #
      # Nur :app: — mit checkDependencies prüft sein Lauf alle Module mit, und
      # ein Bericht bleibt einer. Je Modul einzeln hielte Lint jeden Text in
      # core-ressourcen für unbenutzt, weil erst die Bereiche ihn lesen.
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintRelease 2>&1 | tee "$RUNNER_TEMP/lint.log"
        continue-on-error: true

      # ── Wie viele Warnungen wirft der Übersetzer? ──────────────────────────
      #
      # Auf die Frage „sind alle Warnungen beim Kompilieren gelöst" gab es hier
      # keine Antwort, nur zwei Zeilen, die das Gegenteil festlegen:
      #
      #     app/build.gradle.kts:177   abortOnError     = false
      #     app/build.gradle.kts:178   warningsAsErrors = false
      #
      # und `allWarningsAsErrors` für Kotlin ist nirgends gesetzt. Es gab also
      # keine Regel, die Warnungen verbietet — und niemand hat sie je GEZÄHLT.
      # Die Zahl stand in hunderten Zeilen Gradle-Protokoll, das GitHub nur als
      # Ganzes von einem Host ausliefert, den der Proxy hier mit 403 abweist.
      #
      # Warum nicht einfach allWarningsAsErrors = true: Das bricht den Bau ab
      # der ersten Warnung ab, auch bei einer aus generiertem Code (Hilt, KSP),
      # die hier niemand beheben kann. Eine Regel, die man danach sofort mit
      # Ausnahmen durchlöchern muss, ist keine. Stattdessen: zählen, jede
      # Warnung beim Namen nennen, und rot werden, sobald die Zahl STEIGT.
      #
      # `!cancelled()`: Der Befund ist gerade dann interessant, wenn der Bau
      # rot war — ein abgebrochener Lauf braucht ihn nicht mehr.
      # `steps.bau.outcome != 'skipped'`: Im Lauf 37584609538 waren die
      # Unit-Tests rot, der Bau lief damit nie — und dieser Schritt wurde
      # trotzdem rot, weil er kein Protokoll fand. Das ist ein zweiter roter
      # Schritt fuer EINEN Fehler, und er zeigt in die falsche Richtung.
      #
      # Das Werkzeug bleibt dabei rot bei fehlendem Protokoll: Lief der Bau und
      # ging der Mitschnitt verloren, ist „0 Warnungen" eine Falschaussage, und
      # genau die soll auffallen. Nur gefragt wird es nicht mehr, wenn gar nicht
      # gebaut wurde.
      - name: Warnungen zählen
        if: ${{ !cancelled() && steps.bau.outcome != 'skipped' }}
        run: |
          python3 tools/warnungen-zaehlen.py tools/warnungen-obergrenze.txt \
            "$RUNNER_TEMP/bau.log" "$RUNNER_TEMP/lint.log"

      # ── Die Lint-Befunde: benannt, nicht nur gezählt ───────────────────────
      #
      # Der Schritt darüber meldet „Lint-Warnungen: 58 (nicht in der Summe)" —
      # eine Zahl und sonst nichts. WELCHE 58 stand nur im XML-Bericht, und der
      # liegt als Artefakt in einer Ablage, die der Proxy der
      # Entwicklungsumgebung mit 403 abweist. Damit war die Zahl nicht
      # handhabbar: Sie sagt, DASS etwas da ist, nicht was zu tun wäre.
      #
      # Warum KEINE lint-Baseline: Eine Baseline macht bestehende Befunde
      # unsichtbar — sie stehen dann in einer Datei, die niemand liest, und
      # verschwinden aus jedem Bericht. Man sieht nicht mehr, dass es sie gibt,
      # und also auch nicht, dass man sie beheben könnte. Dieser Schritt macht
      # das Gegenteil: Er nennt jeden Befund nach Prüferkennung, mit Anzahl und
      # Fundorten, und wird rot, sobald die Summe steigt.
      #
      # Error und Fatal fallen NICHT unter die Obergrenze: Da ist die richtige
      # Zahl null, und sie unter einer Summe zu verstecken wäre genau die Art
      # Riegel, die nichts hält.
      #
      # `steps.lint.outcome != 'skipped'`: Lief Lint nicht, gibt es keinen
      # Bericht — dann wäre ein roter Schritt hier ein zweiter roter für EINEN
      # Fehler und zeigte in die falsche Richtung. Dieselbe Lehre wie beim
      # Schritt darüber (Lauf 37584609538).
      - name: Lint-Befunde zählen
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: |
          python3 tools/lint-zaehlen.py tools/lint-obergrenze.txt \
            app/build/reports/lint-results-release.xml

      # detekt je Modul (build-logic, Detekt.kt; Regeln in config/detekt/detekt.yml),
      # ohne Baseline: Jeder Fund macht den Lauf rot. Fehlen die Prüfsummen der
      # detekt-Artefakte, scheitert schon die Auflösung, und der Schritt sagt, was zu tun ist.
      - name: Kotlin prüfen (detekt)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --continue detekt 2>&1 | tee "$RUNNER_TEMP/detekt.log"; then
            if grep -q "Dependency verification failed" "$RUNNER_TEMP/detekt.log"; then
              echo "::error title=detekt ohne Prüfsummen::Die detekt-Artefakte fehlen in gradle/verification-metadata.xml. Workflow von Hand mit pruefsummen=true anstossen; pruefsummen-vorschlagen legt einen Pull-Request mit den Einträgen an."
            else
              echo "::error title=detekt meldet Funde::Liste oben im Protokoll und in */build/reports/detekt/detekt.txt (Artefakt testberichte)."
            fi
            exit 1
          fi

      # Den Namen vergibt GRADLE (Aufgabe copyReleaseApkAsBrickInventory in
      # app/build.gradle.kts), nicht dieser Schritt. Hier wird nur nachgesehen,
      # was dabei herausgekommen ist.
      #
      # Vorher stand die Regel doppelt: Gradle legte "Brickinventory.apk" ab
      # (kleines i), dieser Schritt schob app-release.apk nach
      # "BrickInventory.apk" (grosses I). Auf Linux sind das zwei Dateien; im
      # Protokoll lagen beide nebeneinander. Und das `mv` verschob genau die
      # Original-APK, die Gradle ausdrücklich stehen lässt, damit nachgelagerte
      # Schritte sie noch finden. Ein Name gehört an eine Stelle.
      #
      # Ein lokaler Bau bekommt damit denselben Dateinamen wie der Lauf hier —
      # vorher unterschied er sich in einem Buchstaben.
      - name: APK abgelegt?
        run: |
          set -eu
          cd app/build/outputs/apk/release
          ls -la
          if [ ! -f BrickInventory.apk ]; then
            echo "::error::BrickInventory.apk fehlt. Die Gradle-Aufgabe copyReleaseApkAsBrickInventory hat nicht gegriffen — ohne sie gibt es nichts zu signieren."
            exit 1
          fi

      # ── Sind die Abhängigkeiten aktuell? Gemessen, nicht geschätzt ─────────
      #
      # Die Frage „sind alle Libs auf der neuesten Major- und Minor-Version"
      # kam mehrfach, und ein Teil der Antwort war jedes Mal GESCHÄTZT: Die
      # androidx-Nummern stammten aus einer Doku-Seite, weil Google-Maven aus
      # der Entwicklungsumgebung nicht erreichbar ist — dl.google.com antwortet
      # dort mit HTTP 000, und maven.google.com leitet genau dorthin um.
      #
      # Dieser Runner erreicht es sehr wohl; von dort lädt der Build ja seine
      # Abhängigkeiten. Also wird hier gemessen, direkt aus group-index.xml
      # (Google) und maven-metadata.xml (Central).
      #
      # Der Schritt macht den Lauf NICHT rot, wenn etwas hinterherhinkt — ob
      # eine ältere Fassung richtig ist, entscheidet ein Mensch (bei okhttp und
      # coil entschied es `minCompileSdk`, nicht die Nummer). Rot wird er nur,
      # wenn er gar nichts messen konnte und sein Bericht damit nichts aussagt.
      #
      # `!cancelled()` statt `always()`: Der Bericht soll auch dann kommen,
      # wenn der Bau vorher rot war — aber ein abgebrochener Lauf (neuer Push
      # auf denselben Zweig) braucht ihn nicht mehr.
      - name: Sind die Abhängigkeiten auf der neuesten Fassung?
        if: ${{ !cancelled() }}
        run: python3 tools/fassungen-pruefen.py gradle/libs.versions.toml

      # `always()`: Die Berichte sind gerade dann interessant, wenn der Lauf rot
      # ist. Ohne das lädt GitHub sie bei einem Fehlschlag nicht hoch.
      # upload-artifact auf v6 (vorher v4).
      #
      # v4 läuft auf Node 20 und erzeugt seit dessen Abkündigung bei jedem Lauf
      # die Warnung "being forced to run on Node.js 24". Nachgesehen statt
      # geraten — und das Nachsehen hat sich gelohnt:
      #
      #     v4 -> runs.using: node20      (warnt)
      #     v5 -> runs.using: node20      (warnt EBENFALLS)
      #     v6 -> runs.using: node24      (still)
      #
      # Der naheliegende Sprung auf die nächste Hauptversion hätte die Warnung
      # also NICHT beseitigt. Wer hier wieder anfasst: Die Fassung am Tag
      # abrufen und in action.yml unter runs.using nachsehen, welches Node sie
      # startet — die Versionsnummer allein sagt es nicht.
      #
      #     curl https://raw.githubusercontent.com/actions/upload-artifact/v6/action.yml
      #
      # ── Nachtrag: eine Hauptversion weiter, aus anderem Grund ─────────────
      #
      # Die Tabelle darueber bleibt richtig. Gehoben wurde jetzt NICHT wegen
      # einer Warnung, sondern weil die Frage „sind alle verwendeten Fassungen
      # die neuesten" auch fuer die Actions gilt — und die standen in keinem
      # Katalog und in keiner package.json, also hat sie niemand gemessen.
      #
      # Gemessen wurde mit demselben Handgriff wie oben, nur umgedreht: ob ein
      # hoeherer Haupt-Tag UEBERHAUPT existiert. api.github.com ist aus dieser
      # Umgebung gesperrt (403), raw.githubusercontent.com nicht:
      #
      #     raw.githubusercontent.com/<action>/v7/action.yml  -> 200 = gibt es
      #                                      .../v9, v42, v99 -> 404 = gibt es nicht
      #
      # Die Gegenprobe mit v9, v42, v99 und vXYZ war noetig: Ohne sie waere
      # „200 bei jedem geprueften Tag" nicht von „der Abruf antwortet immer
      # 200" zu unterscheiden gewesen.
      #
      # Jede neue Hauptversion laeuft auf node24 — die Laufzeit aendert sich
      # also nicht, es gibt hier keine Warnung zu beseitigen und auch keine
      # einzufangen.
      # Aufgenommen (ohne Referenz) liegen die Bilder unter src/test; beim
      # Vergleich legt Roborazzi Ist-Bild und Unterschied unter build/outputs ab.
      - name: Bildschirmfotos sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bildschirmfotos
          path: |
            Android-App/app/src/test/bildschirmfotos/
            Android-App/app/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 30

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testberichte
          path: |
            Android-App/*/build/reports/tests/
            Android-App/*/build/reports/detekt/
            Android-App/app/build/reports/lint-results-release.html
          # Scheitert der Lauf VOR den Tests, gibt es keine Berichte. Das ist
          # dann kein zusätzlicher Fehler, sondern nur eine Folge — ohne diese
          # Zeile schreibt GitHub eine irreführende Warnung ins Protokoll.
          if-no-files-found: ignore
          retention-days: 14

      # Übergabe an den Job `signieren`: unsigniertes APK samt output-metadata.json
      # und Bundle, nach einem Tag weg. Ordner statt APK-Name: Ausgeliefert wird
      # der rohe Release-Anhang, nie ein Zip (ApkNameTest).
      - name: Unsigniertes APK an den Signierjob übergeben
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-unsigniert
          path: |
            Android-App/app/build/outputs/apk/release/
            Android-App/app/build/outputs/bundle/release/
          if-no-files-found: error
          retention-days: 1

  # ── Signieren: Secrets ohne Projektcode ──────────────────────────────────
  #
  # Der Schlüssel sieht weder Gradle noch ein Plugin noch ein Werkzeug aus dem
  # Repository: kein Checkout, nur das Artefakt des Bau-Jobs und apksigner/
  # zipalign aus dem SDK des Runners (Prüfsummen im Protokoll). Nur für ein
  # Etikett android-v… mit der Environment `release`: Nur dort liegen die
  # Secrets, und ihre Regeln (nur diese Etiketten, Pflichtprüfer) gelten. Sonst
  # derselbe Ablauf mit einem Wegwerfschlüssel, ohne Environment und ohne Secrets.
  signieren:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') && 'release' || '' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Unsigniertes APK holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-unsigniert
          path: ${{ runner.temp }}/eingang

      # Signiert wird nur, was der Baujob gleich nach dem Bau gemessen hat (sec8
      # H10): nicht, was spätere Schritte dort oder die Ablage daraus machten.
      - name: Artefakt gegen die Prüfsummen des Baujobs
        env:
          APK_SOLL: ${{ needs.build.outputs.sha256_apk }}
          AAB_SOLL: ${{ needs.build.outputs.sha256_aab }}
        run: |
          set -euo pipefail
          EIN="$RUNNER_TEMP/eingang"
          if ! printf '%s' "$APK_SOLL" | grep -Eq '^[0-9a-f]{64}$' || ! printf '%s' "$AAB_SOLL" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Der Baujob hat keine Prüfsummen gemeldet. Nichts wird signiert."
            exit 1
          fi
          printf '%s  %s\n' "$APK_SOLL" "$EIN/apk/release/app-release-unsigned.apk" | sha256sum -c -
          printf '%s  %s\n' "$AAB_SOLL" "$EIN/bundle/release/app-release.aab" | sha256sum -c -

      # Die Schutzregeln der Environment stehen nicht im Repository; ohne sie
      # genügte ein Etikett, um zu signieren. Darum hier erzwungen statt nur
      # beschrieben (README, Release signieren): mindestens ein Pflichtprüfer und
      # als einzige Bereitstellungsregel das Etikett android-v*.
      - name: Environment release ist geschützt
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! U=$(gh api "repos/$GITHUB_REPOSITORY/environments/release"); then
            echo "::error::Die Schutzregeln der Environment release liessen sich nicht lesen (actions: read). Nichts wird signiert."
            exit 1
          fi
          PRUEFER=$(printf '%s' "$U" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          EIGENE=$(printf '%s' "$U" | jq -r '.deployment_branch_policy.custom_branch_policies // false')
          if [ "$PRUEFER" -lt 1 ]; then
            echo "::error::Die Environment release hat keinen Pflichtprüfer (Settings → Environments → release → Required reviewers). Nichts wird signiert."
            exit 1
          fi
          if [ "$EIGENE" != true ]; then
            echo "::error::Die Environment release lässt jeden Zweig zu (Deployment branches and tags: Selected, nur das Etikett android-v*). Nichts wird signiert."
            exit 1
          fi
          REGELN=$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" \
            --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | sort | join(",")')
          if [ "$REGELN" != "tag:android-v*" ]; then
            echo "::error::Die Environment release erlaubt „$REGELN“ statt nur des Etiketts android-v*. Nichts wird signiert."
            exit 1
          fi
          echo "Environment release: $PRUEFER Pflichtprüfer, nur Etiketten android-v*."

      # Die Secrets nennt nur dieser Schritt, und er läuft nur dort, wo der Job in
      # der Environment `release` steht. Gleichnamige Repository-Secrets fände
      # GitHub sonst ebenfalls — sie gehören gelöscht (README, Release signieren).
      # Ein Etikett kann jeder mit Schreibrecht auf jeden Commit setzen; signiert
      # wird nur, was schon auf main liegt, also durch Review und CI ging.
      - name: Etikett liegt auf main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAND=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$STAND" in
            identical|behind) echo "$GITHUB_REF_NAME ($GITHUB_SHA) liegt auf main." ;;
            *) echo "::error::$GITHUB_REF_NAME zeigt auf $GITHUB_SHA, der nicht auf main liegt ($STAND). Nichts wird signiert."; exit 1 ;;
          esac

      - name: Release-Schlüssel bereitstellen
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORT }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORT }}
          BESCHREIBUNG_SCHLUESSEL: ${{ secrets.BESCHREIBUNG_SCHLUESSEL }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Für das Etikett fehlen Signier-Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORT, KEY_ALIAS, KEY_PASSWORT) — sie gehören in die Environment release; Repository-Secrets gleichen Namens löschen. Ohne Signatur wird nichts veröffentlicht."
            exit 1
          fi
          S="$RUNNER_TEMP/schluessel"; (umask 077; mkdir -p "$S")
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$S/signatur.jks"
          printf '%s' "$KS_PASS" > "$S/ks_pass"; printf '%s' "$KEY_PASS" > "$S/key_pass"; printf '%s' "$KEY_ALIAS" > "$S/alias"
          # Eigener Schlüssel für die Fassungsbeschreibung (sec11 H1), verschlüsselt abgelegt.
          # Fehlt er, trägt die Beschreibung nur die Signatur des APK-Schlüssels; ob die App
          # schon einen verlangt, prüft der Job apk-pruefen.
          if [ -n "$BESCHREIBUNG_SCHLUESSEL" ]; then
            printf '%s\n' "$BESCHREIBUNG_SCHLUESSEL" | openssl pkey -aes256 -passout env:KS_PASS -out "$S/beschreibung.pem"
          else
            echo "::warning title=Beschreibungsschlüssel fehlt::Die Fassungsbeschreibung wird nur mit dem APK-Schlüssel signiert (sec12 H1). Secret BESCHREIBUNG_SCHLUESSEL anlegen und den öffentlichen Schlüssel in beschreibungs_schluessel.pem eintragen (README, „Beschreibungsschlüssel“)."
          fi

      - name: Probe-Schlüssel erzeugen
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')) }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/schluessel"; (umask 077; mkdir -p "$S")
          P=probe-$RANDOM$RANDOM
          keytool -genkeypair -keystore "$S/signatur.jks" -storepass "$P" -keypass "$P" \
            -alias probe -keyalg RSA -keysize 2048 -validity 1 -dname CN=Probe >/dev/null
          printf '%s' "$P" > "$S/ks_pass"; printf '%s' "$P" > "$S/key_pass"; printf probe > "$S/alias"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -aes256 -pass "file:$S/ks_pass" -out "$S/beschreibung.pem"

      - name: Signieren
        env:
          ECHT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          set -euo pipefail
          WERKZEUGE=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Werkzeuge: $WERKZEUGE"
          sha256sum "$WERKZEUGE/zipalign" "$WERKZEUGE/lib/apksigner.jar"
          EIN="$RUNNER_TEMP/eingang"
          AUS="$RUNNER_TEMP/ausgang"
          mkdir -p "$AUS/apk/release" "$AUS/bundle/release"
          S="$RUNNER_TEMP/schluessel"
          trap 'rm -rf "$S"' EXIT
          KS="$S/signatur.jks"
          KS_PASS=$(cat "$S/ks_pass"); KEY_PASS=$(cat "$S/key_pass"); KEY_ALIAS=$(cat "$S/alias")
          export KS_PASS KEY_PASS
          # Ausrichten VOR dem Signieren; -P 16 hält native Bibliotheken auf
          # 16-KB-Seiten (geprüft im Job `apk-pruefen`).
          "$WERKZEUGE/zipalign" -f -P 16 4 "$EIN/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/ausgerichtet.apk"
          # v1 (JAR) braucht kein Gerät ab minSdk 30; v3 trägt eine spätere Schlüsselrotation.
          "$WERKZEUGE/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$AUS/apk/release/BrickInventory.apk" "$RUNNER_TEMP/ausgerichtet.apk"
          "$WERKZEUGE/apksigner" verify --print-certs "$AUS/apk/release/BrickInventory.apk" > "$RUNNER_TEMP/zertifikat.txt"
          head -3 "$RUNNER_TEMP/zertifikat.txt"
          install -m 644 "$EIN/apk/release/output-metadata.json" "$AUS/apk/release/output-metadata.json"
          install -m 644 "$EIN/bundle/release/app-release.aab" "$RUNNER_TEMP/bundle.aab"
          jarsigner -keystore "$KS" -storepass:env KS_PASS -keypass:env KEY_PASS "$RUNNER_TEMP/bundle.aab" "$KEY_ALIAS" >/dev/null
          jarsigner -verify "$RUNNER_TEMP/bundle.aab" >/dev/null

          # ── Signierte Fassungsbeschreibung (sec8 N4, sec11 H1) ────────────────
          #
          # Schreibrecht am Repository allein reicht so nicht, um ein Update zu
          # unterdrücken, auf ein anderes APK zu zeigen oder eine ältere Fassung
          # anzubieten. Die Adresse zeigt auf den unveränderlichen Anhang dieser
          # Fassung. `beschreibungssignatur` kommt vom eigenen Beschreibungsschlüssel;
          # eine App, die ihn kennt, nimmt nur sie. `signatur` (APK-Schlüssel) bleibt für
          # Fassungen ohne ihn (README, „Beschreibungsschlüssel“).
          # `ausgestellt`/`gueltigBis` (sec10 N1): Ohne Frist liesse sich eine ältere,
          # echt signierte Beschreibung still wieder hochladen. Auffrischen heisst:
          # ein neues Etikett, auch auf denselben Commit (README, „Frist“).
          META="$EIN/apk/release/output-metadata.json"
          APK_AUS="$AUS/apk/release/BrickInventory.apk"
          V_CODE=$(jq -r '.elements[0].versionCode' "$META")
          AUSGESTELLT=$(date -u +%s)
          jq -n --argjson code "$V_CODE" --arg name "$(jq -r '.elements[0].versionName' "$META")" \
                --arg commit "$GITHUB_SHA" \
                --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/BrickInventory-${V_CODE}.apk" \
                --argjson size "$(stat -c%s "$APK_AUS")" --arg pruefsumme "$(sha256sum "$APK_AUS" | cut -d' ' -f1)" \
                --argjson ausgestellt "$AUSGESTELLT" --argjson gueltig "$((AUSGESTELLT + 30 * 86400))" \
                '{versionCode:$code, versionName:$name, commit:$commit, apkUrl:$url, apkSize:$size, apkSha256:$pruefsumme,
                  ausgestellt:$ausgestellt, gueltigBis:$gueltig}' \
                > "$AUS/version-daten.json"
          keytool -importkeystore -noprompt -srckeystore "$KS" -srcstorepass:env KS_PASS -srcalias "$KEY_ALIAS" \
            -srckeypass:env KEY_PASS -destkeystore "$S/schluessel.p12" -deststoretype PKCS12 \
            -deststorepass:env KS_PASS -destkeypass:env KS_PASS >/dev/null
          # Der Schlüssel bleibt auch als PEM verschlüsselt (sec10 H4): kein Klartext auf der Platte.
          openssl pkcs12 -in "$S/schluessel.p12" -nocerts -passin env:KS_PASS -passout env:KS_PASS -out "$S/schluessel.pem"
          openssl dgst -sha256 -sign "$S/schluessel.pem" -passin env:KS_PASS -out "$S/version.sig" "$AUS/version-daten.json"
          keytool -exportcert -rfc -keystore "$KS" -storepass:env KS_PASS -alias "$KEY_ALIAS" > "$AUS/signierzertifikat.pem"
          BSIG=""
          if [ -f "$S/beschreibung.pem" ]; then
            openssl dgst -sha256 -sign "$S/beschreibung.pem" -passin env:KS_PASS -out "$S/beschreibung.sig" "$AUS/version-daten.json"
            openssl pkey -in "$S/beschreibung.pem" -passin env:KS_PASS -pubout -out "$AUS/beschreibungsschluessel.pem"
            BSIG=$(base64 -w0 "$S/beschreibung.sig")
          fi
          jq -n --arg daten "$(base64 -w0 "$AUS/version-daten.json")" --arg signatur "$(base64 -w0 "$S/version.sig")" --arg bsig "$BSIG" \
                '{daten:$daten, signatur:$signatur} + (if $bsig == "" then {} else {beschreibungssignatur:$bsig} end)' \
                > "$AUS/version-signiert.json"

          if [ "$ECHT" = "true" ]; then
            install -m 644 "$RUNNER_TEMP/bundle.aab" "$AUS/bundle/release/app-release.aab"
            echo "signiert mit dem Release-Schlüssel"
          else
            install -m 644 "$EIN/bundle/release/app-release.aab" "$AUS/bundle/release/app-release.aab"
            echo "Probe-Signatur gelungen; geprüft wird das probe-signierte APK, veröffentlicht wird nichts."
          fi

      # Nur das Ergebnis geht weiter, nicht der Schlüssel: Prüfen und
      # Veröffentlichen laufen in eigenen Jobs ohne Secrets.
      - name: Signiertes APK übergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-signiert
          path: ${{ runner.temp }}/ausgang/
          if-no-files-found: error
          retention-days: 1

      # Das Bundle wird hier nur GEBAUT und gesichert, nicht veroeffentlicht.
      #
      # Hier stand, dass das Hochladen zu Play in android-playstore.yml stehe.
      # Diesen Workflow gibt es nicht mehr: Die App wird als APK ueber die
      # GitHub-Releases ausgeliefert (Schritt „BrickInventory.apk als Release
      # bereitstellen" im Job `release`) und aktualisiert sich daraus selbst
      # (util/AppUpdate.kt). Der Play-Weg war gebaut, aber nie benutzt.
      #
      # Der Bau hier bleibt trotzdem, und zwar aus dem Grund, der schon vorher
      # der zweite war: Er faellt auf, wenn das Bundle bricht, waehrend das APK
      # noch durchlaeuft. Das kommt vor — R8 und die Ressourcen-Aufteilung
      # arbeiten fuer die beiden Formate nicht gleich. Als Artefakt ist es
      # ausserdem da, falls der Play-Weg je wieder gewollt ist.
      - name: App-Bundle (.aab) sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BrickInventory-bundle
          path: ${{ runner.temp }}/ausgang/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

  # ── Das signierte Ergebnis prüfen: Projektcode ohne Secrets ──────────────
  #
  # Die Werkzeuge kommen aus dem Repository, deshalb hier und nicht im
  # Signierjob. Geprüft wird das APK, das gleich veröffentlicht wird.
  apk-pruefen:
    needs: signieren
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Signiertes APK holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-signiert
          path: Android-App/app/build/outputs

      # Das Release-Zertifikat steht fest in tools/release-zertifikat.sha256: Ein
      # ausgetauschter Schlüssel in der Environment fiele sonst erst auf, wenn
      # Updates scheitern, und eine Neuinstallation nähme ihn still an. Ein
      # Probe-signiertes APK muss genau an dieser Prüfung scheitern (Rückgabe 1);
      # so läuft sie bei jedem Bau gegen eine echte Ausgabe von apksigner.
      - name: APK prüfen
        env:
          ECHT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          ls -la
          WERKZEUGE=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$WERKZEUGE/apksigner" verify --print-certs BrickInventory.apk > "$RUNNER_TEMP/zertifikat.txt"
          head -3 "$RUNNER_TEMP/zertifikat.txt"
          cd "$GITHUB_WORKSPACE/Android-App"
          ERGEBNIS=0
          python3 tools/release-pruefen.py zertifikat "$RUNNER_TEMP/zertifikat.txt" tools/release-zertifikat.sha256 || ERGEBNIS=$?
          if [ "$ECHT" = "true" ] && [ "$ERGEBNIS" != 0 ]; then
            echo "::error::Das APK ist nicht mit dem hinterlegten Release-Zertifikat signiert (tools/release-zertifikat.sha256). Nichts wird veröffentlicht."
            exit 1
          fi
          if [ "$ECHT" != "true" ] && [ "$ERGEBNIS" != 1 ]; then
            echo "::error::Das Probe-signierte APK muss am Release-Zertifikat scheitern, die Prüfung gab $ERGEBNIS zurück."
            exit 1
          fi

      # Die signierte Beschreibung (sec8 N4): vom selben Zertifikat wie das APK
      # signiert, und sie beschreibt genau dieses APK. Nennt die App Beschreibungs-
      # schlüssel (sec11 H1), muss ein Etikett mit einem davon signiert sein. Sonst böte
      # die App nichts an oder lehnte das geladene APK ab, und beides fiele erst auf
      # den Geräten auf.
      - name: Signierte Beschreibung prüfen
        env:
          ECHT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          set -euo pipefail
          A=app/build/outputs
          T="$RUNNER_TEMP/beschreibung"; mkdir -p "$T"
          ZERT=$(openssl x509 -in "$A/signierzertifikat.pem" -outform DER | sha256sum | cut -d' ' -f1)
          if ! grep -qi "certificate SHA-256 digest: $ZERT" "$RUNNER_TEMP/zertifikat.txt"; then
            echo "::error::Die Beschreibung ist mit einem anderen Zertifikat signiert als das APK."
            exit 1
          fi
          openssl x509 -in "$A/signierzertifikat.pem" -pubkey -noout > "$T/schluessel.pem"
          jq -r .daten "$A/version-signiert.json" | base64 -d > "$T/daten.json"
          jq -r .signatur "$A/version-signiert.json" | base64 -d > "$T/daten.sig"
          openssl dgst -sha256 -verify "$T/schluessel.pem" -signature "$T/daten.sig" "$T/daten.json"
          if jq -e .beschreibungssignatur "$A/version-signiert.json" >/dev/null; then
            jq -r .beschreibungssignatur "$A/version-signiert.json" | base64 -d > "$T/beschreibung.sig"
            openssl dgst -sha256 -verify "$A/beschreibungsschluessel.pem" -signature "$T/beschreibung.sig" "$T/daten.json"
          fi
          if [ "$ECHT" = "true" ] && ! python3 tools/release-pruefen.py schluessel "$A/beschreibungsschluessel.pem" \
              core-ressourcen/src/main/res/raw/beschreibungs_schluessel.pem; then
            echo "::error::Die App verlangt einen Beschreibungsschlüssel, die Beschreibung trägt keinen davon (Secret BESCHREIBUNG_SCHLUESSEL). Nichts wird veröffentlicht."
            exit 1
          fi
          python3 tools/release-pruefen.py beschreibung "$T/daten.json" "$A/apk/release/BrickInventory.apk" \
            "$A/apk/release/output-metadata.json" "$GITHUB_SHA" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      # Ein Etikett auf einem älteren Commit von main brächte einen älteren Stand
      # als „neustes APK“ zu jeder Neuinstallation. versionCode zählt die Commits.
      - name: versionCode über dem veröffentlichten
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V_CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)
          ALT=-
          # Verglichen wird mit der signierten Beschreibung; version.json nur, solange
          # apk-neuste noch keine trägt (sie fällt nach dem Stichtag weg, Job `release`).
          if gh release view apk-neuste --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ALT="$RUNNER_TEMP/version-alt.json"
            if gh release download apk-neuste --repo "$GITHUB_REPOSITORY" -p version-signiert.json -O "$RUNNER_TEMP/alt-signiert.json"; then
              jq -r .daten "$RUNNER_TEMP/alt-signiert.json" | base64 -d > "$ALT"
            else
              gh release download apk-neuste --repo "$GITHUB_REPOSITORY" -p version.json -O "$ALT"
            fi
          fi
          if ! python3 tools/release-pruefen.py fassung "$ALT" "$V_CODE" "$GITHUB_SHA"; then
            echo "::error::versionCode $V_CODE liegt nicht über dem veröffentlichten APK. Nichts wird veröffentlicht."
            exit 1
          fi

      # ── Das fertige APK gegen R8 prüfen ─────────────────────────────────────
      #
      # Der Unit-Test-Lauf oben ist `testDebugUnitTest` — auf der JVM, ohne R8.
      # Zwischen "470 Tests grün" und "auf dem Gerät passiert etwas" lag damit
      # niemand, und genau dort ging es schief: Im APK von main (120c998) hatte
      # PreisalarmWorker nur noch seinen Konstruktor, doWork() war weg. Der
      # Preisalarm konnte nie laufen, und kein Test hat es gemerkt.
      #
      # Diese Prüfung liest das APK, das gleich hochgeladen wird — nicht den
      # Quelltext, aus dem es entstanden ist. Das ist der Punkt: Was R8 gemacht
      # hat, steht nur im Ergebnis.
      - name: APK gegen R8-Verluste prüfen
        run: |
          python3 tools/apk-pruefen.py \
            app/build/outputs/apk/release/BrickInventory.apk \
            */src/main/java

      # ── 16-KB-Speicherseiten am ERGEBNIS messen ─────────────────────────────
      #
      # Bis hierher stand die 16-KB-Tauglichkeit auf einer ZAHL: datastore war
      # auf 1.1.7 festgenagelt, weil 1.2.0 wieder 4-KB-ausgerichtet war, und
      # ein Test verlangte genau diese Nummer.
      #
      # Das prüft die Nummer, nicht die Ausrichtung — und war in der
      # Entwicklungsumgebung gar nicht nachprüfbar: Die AARs liegen auf
      # dl.google.com, das von dort nicht erreichbar ist. Hier liegt das
      # gebaute APK, also wird hier gemessen. Dieselbe Umkehrung wie beim
      # Schritt darüber, der R8s Ergebnis liest statt des Quelltexts.
      - name: Native Bibliotheken auf 16 KB ausgerichtet?
        run: |
          python3 tools/apk-ausrichtung.py \
            app/build/outputs/apk/release/BrickInventory.apk

  # ── Veröffentlichen: der einzige Job mit Schreibrecht ─────────────────────
  #
  # Was hier landet, holt sich jede installierte App als Update. Darum hängt
  # auch dieser Job an der Environment `release`: Ihre Pflichtprüfer geben die
  # Veröffentlichung frei, nicht schon das Etikett allein. id-token und
  # attestations nur für die Herkunftsbescheinigung des APK.
  release:
    needs: [signieren, apk-pruefen]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    environment: release
    runs-on: ubuntu-latest
    # Zwei Etiketten zugleich: Sonst prüften beide gegen dieselbe alte Fassung,
    # und das ältere könnte nach dem neueren hochladen.
    concurrency:
      group: apk-neuste
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Signiertes APK holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk-signiert
          path: Android-App/app/build/outputs

      # ── Warum ein Release und kein Artefakt ─────────────────────────────────
      #
      # Marcos Wunsch: am Ende kein Zip, sondern direkt das APK. Als Artefakt
      # geht das NICHT — nachgelesen in der Anleitung von upload-artifact,
      # nicht aus dem Gedaechtnis:
      #
      #   "When an Artifact is uploaded, all the files are assembled into an
      #    immutable Zip archive. There is currently no way to download
      #    artifacts in a format other than a Zip [...]"
      #
      # GitHub packt also selbst ein, auch bei einer einzigen Datei, und es gibt
      # keinen Schalter dagegen. Ein Release-ANHANG wird dagegen roh
      # ausgeliefert: ein Klick, und es ist das APK.
      #
      # Zwei Dinge kommen dazu: Ein Release-Anhang braucht KEIN GitHub-Konto
      # (das Repository ist oeffentlich), und er verfaellt nicht nach 90 Tagen.
      # Genau das waren die beiden Gruende fuer die frueher hier angehaengte
      # Google-Drive-Ablage — sie ist deshalb entfallen (Marcos Entscheidung).
      #
      # ── Ein Etikett, nicht eins je Lauf ─────────────────────────────────────
      #
      # Die Datei wird ERSETZT, damit der Link stabil bleibt. Sonst braucht
      # jeder nach jedem Bau einen neuen.
      #
      # Das Etikett bleibt auf dem Commit stehen, auf dem es angelegt wurde.
      # Verschieben hiesse, ein Etikett umzuschreiben, das jemand schon
      # ausgecheckt haben kann — woher das APK stammt, steht deshalb im TEXT
      # des Release und wird bei jedem Lauf neu geschrieben.
      #
      # NUR aus einem Etikett android-v… auf main, auch nicht von Hand auf einem
      # Zweig: Sonst ueberschriebe ein ungeprueftes APK die Datei hinter dem
      # stabilen Link, und die App holte es sich als Update.
      # Bescheinigt, aus welchem Lauf, Commit und Workflow das signierte APK
      # stammt (Sigstore, öffentlich prüfbar mit `gh attestation verify`).
      - name: Herkunft des APK bescheinigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Android-App/app/build/outputs/apk/release/BrickInventory.apk

      - name: BrickInventory.apk als Release bereitstellen
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ETIKETT=apk-neuste
          APK=app/build/outputs/apk/release/BrickInventory.apk
          LINK="https://github.com/$GITHUB_REPOSITORY/releases/download/$ETIKETT/BrickInventory.apk"
          TEXT="Gebaut aus dem Etikett \`$GITHUB_REF_NAME\` ($GITHUB_SHA) am $(date -u '+%d.%m.%Y %H:%M UTC').
          Herkunft prüfen: gh attestation verify BrickInventory.apk --repo $GITHUB_REPOSITORY

          Direkter Download (immer die neuste Fassung, kein Zip):
          $LINK"

          # Vor dem Hochladen, nicht danach: Die Werte bestimmen, ob überhaupt
          # hochgeladen wird.
          META=app/build/outputs/apk/release/output-metadata.json
          if [ ! -f "$META" ]; then
            echo "::error::$META fehlt — ohne die Werte von AGP koennte hier nur geraten werden."
            exit 1
          fi
          V_CODE=$(jq -r '.elements[0].versionCode' "$META")
          V_NAME=$(jq -r '.elements[0].versionName' "$META")
          if ! printf '%s' "$V_CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::versionCode aus $META ist \"$V_CODE\" — keine Zahl."
            exit 1
          fi
          if [ -z "$V_NAME" ] || [ "$V_NAME" = null ]; then
            echo "::error::versionName aus $META ist leer."
            exit 1
          fi

          # Dieselbe Regel wie im Job apk-pruefen (tools/release-pruefen.py fassung),
          # hier unter der concurrency-Gruppe unmittelbar vor dem Hochladen. Ohne
          # Werkzeug aus dem Repository: Dieser Job hat Schreibrecht.
          if gh release view "$ETIKETT" >/dev/null 2>&1; then
            if gh release download "$ETIKETT" -p version-signiert.json -O "$RUNNER_TEMP/alt-signiert.json"; then
              jq -r .daten "$RUNNER_TEMP/alt-signiert.json" | base64 -d > "$RUNNER_TEMP/version-alt.json"
            else
              gh release download "$ETIKETT" -p version.json -O "$RUNNER_TEMP/version-alt.json"
            fi
            ALT_CODE=$(jq -r '.versionCode' "$RUNNER_TEMP/version-alt.json")
            ALT_COMMIT=$(jq -r '.commit' "$RUNNER_TEMP/version-alt.json")
            if ! printf '%s' "$ALT_CODE" | grep -Eq '^[0-9]+$' || [ "$V_CODE" -lt "$ALT_CODE" ] ||
               { [ "$V_CODE" -eq "$ALT_CODE" ] && [ "$ALT_COMMIT" != "$GITHUB_SHA" ]; }; then
              echo "::error::versionCode $V_CODE folgt nicht auf das veröffentlichte $ALT_CODE ($ALT_COMMIT). Nichts wird veröffentlicht."
              exit 1
            fi
            gh release edit "$ETIKETT" --notes "$TEXT"
          else
            gh release create "$ETIKETT" --title "BrickInventory — neustes APK" --notes "$TEXT"
          fi
          # ── Unveränderlich je Fassung (sec8 N4) ───────────────────────────
          #
          # Die signierte Beschreibung zeigt auf BrickInventory-<versionCode>.apk
          # im Release dieses Etiketts. Der Anhang wird nie ersetzt; ein erneuter
          # Lauf findet ihn und vergleicht nur. Im Repository zusätzlich
          # „Immutable releases“ einschalten (README).
          FASSUNG="BrickInventory-${V_CODE}.apk"
          cp "$APK" "$RUNNER_TEMP/$FASSUNG"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "BrickInventory $V_NAME" --notes "Fassung $V_CODE aus $GITHUB_SHA. $LINK zeigt immer auf die neuste."
          fi
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qxF "$FASSUNG"; then
            gh release download "$GITHUB_REF_NAME" -p "$FASSUNG" -O "$RUNNER_TEMP/vorhanden.apk"
            if ! cmp -s "$RUNNER_TEMP/vorhanden.apk" "$APK"; then
              echo "::error::$GITHUB_REF_NAME trägt schon ein anderes $FASSUNG; ein Fassungsanhang wird nie ersetzt."
              exit 1
            fi
          else
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$FASSUNG"
          fi

          # Der stabile Link für Neuinstallationen: Hier darf ersetzt werden, die App
          # lädt ihre Updates vom Fassungsanhang oben.
          gh release upload "$ETIKETT" "$APK" --clobber
          # Signiert im Job signieren; ersetzt wird nur der Zeiger auf die neuste.
          gh release upload "$ETIKETT" app/build/outputs/version-signiert.json --clobber

          # ── version.json: nur noch bis zum Stichtag (sec10 N1) ───────────────
          #
          # Unsigniert und ohne Frist: Wer Schreibrecht hat, hält damit alte
          # Fassungen still fest. Sie bleibt nur, damit Geräte mit einer Fassung vor
          # sec8 N4 das nächste Update noch finden (danach lesen sie die signierte);
          # ohne sie blieben diese ohne jede Meldung stehen. Werte aus AGPs
          # output-metadata.json, das Feld `commit` ist eine Herkunft, keine Prüfsumme.
          if [ "$(date -u +%Y%m%d)" -lt 20270201 ]; then
            jq -n --argjson code "$V_CODE" --arg name "$V_NAME" \
                  --arg commit "$GITHUB_SHA" --arg url "$LINK" \
                  --argjson size "$(stat -c%s "$APK")" \
                  '{versionCode:$code, versionName:$name, commit:$commit, apkUrl:$url, apkSize:$size}' \
                  > version.json
            gh release upload "$ETIKETT" version.json --clobber
            # Zurückfragen statt `gh` zu glauben: Halbes JSON meldete auf alten Geräten einen Fehler.
            ZURUECK=$(gh release view "$ETIKETT" --json assets \
              --jq '.assets[] | select(.name=="version.json") | .size')
            if [ "$ZURUECK" != "$(stat -c%s version.json)" ]; then
              echo "::error::version.json unvollstaendig hochgeladen ($ZURUECK Bytes draussen)."
              exit 1
            fi
          elif gh release view "$ETIKETT" --json assets --jq '.assets[].name' | grep -xF version.json >/dev/null; then
            gh release delete-asset "$ETIKETT" version.json --yes
          fi

          # Gegenprobe: nicht der Ausgabe von `gh` glauben, sondern den Anhang
          # ZURUECK fragen und die Groesse vergleichen. Ein abgebrochener
          # Upload liefert sonst eine gueltig aussehende Antwort und einen
          # Link auf ein halbes APK.
          LOKAL=$(stat -c%s "$APK")
          DRAUSSEN=$(gh release view "$ETIKETT" --json assets \
            --jq '.assets[] | select(.name=="BrickInventory.apk") | .size')
          if [ "$DRAUSSEN" != "$LOKAL" ]; then
            echo "::error::Das Release meldet $DRAUSSEN Bytes, lokal sind es $LOKAL. Anhang unvollstaendig."
            exit 1
          fi

          {
            echo "## APK zum direkten Herunterladen"
            echo ""
            echo "**$LINK**"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Groesse | $LOKAL Bytes |"
            echo "| Gebaut aus | \`$GITHUB_REF_NAME\` ($GITHUB_SHA) |"
            echo ""
            echo "> Kein Zip: Ein Release-Anhang wird roh ausgeliefert. Der Link"
            echo "> bleibt ueber alle Builds derselbe und braucht kein GitHub-Konto."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Gegenproben ────────────────────────────────────────────────────────────
  #
  # Jeder Patch unter Android-App/gegenproben/ macht etwas kaputt; die Test-
  # klasse aus seinem Kopf muss danach ROT sein (tools/gegenproben.py). Für
  # Robolectric-Tests ist das nur hier messbar. Bleibt eine grün oder läuft der
  # Test gar nicht, ist der Job rot: Ein Test, der nie rot war, ist unbewiesen.
  gegenproben:
    if: ${{ !inputs.pruefsummen && !inputs.bildschirmfotos }}
    runs-on: ubuntu-latest
    # Jede Gegenprobe ist ein eigener Gradle-Lauf (~0,7 min); grüne Läufe brauchten
    # 66–118 Minuten. 180 hält die 6-Stunden-Grenze von GitHub fern und lässt Raum
    # für rund 80 weitere Patches; reicht das nicht, gehört der Job aufgeteilt.
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/gradle-wrapper-pruefen.py gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Gegenproben messen
        run: |
          chmod +x gradlew
          python3 tools/gegenproben.py gegenproben

  # ── Prüfsummen der Abhängigkeiten ──────────────────────────────────────────
  #
  # gradle/verification-metadata.xml hält für jede Abhängigkeit die SHA-256
  # fest; Gradle bricht ab, wenn ein Repository etwas anderes liefert. Erzeugen
  # lässt sie sich nur mit Zugang zu dl.google.com, also hier. Nach jedem
  # Versionssprung (Renovate) von Hand anstossen und die Datei aus dem Artefakt
  # einchecken; der Bau oben scheitert bis dahin an der Prüfung.
  pruefsummen:
    if: github.event_name == 'workflow_dispatch' && inputs.pruefsummen
    runs-on: ubuntu-latest
    # Löst alles ohne Cache neu auf und holt jede Signatur; gemessen 31 Minuten.
    # Was mehr als doppelt so lange läuft, hängt.
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/gradle-wrapper-pruefen.py gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Dieselben Aufgaben wie der Bau oben: Nur was aufgelöst wird, bekommt
      # eine Prüfsumme, und Lint holt eigene Pakete.
      # Lint ist wie im Bau oben nur ein Befund (dort continue-on-error); hier
      # zählt allein, dass jede Abhängigkeit einmal aufgelöst wurde.
      - name: Prüfsummen erzeugen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --continue --write-verification-metadata sha256,pgp --export-keys \
            testDebugUnitTest :core-model:test recordRoborazziDebug assembleRelease bundleRelease :app:lintRelease detekt \
            || echo "::warning::Gradle meldete einen Fehler (Lint oder Test); die Prüfsummen sind trotzdem geschrieben."
          test -s gradle/verification-metadata.xml
          test -s gradle/verification-keyring.keys
      # Hier, ohne Schreibrecht: Das Werkzeug kommt aus dem Repository. Neu
      # vertraute Schlüssel mit Gruppen-Regex stehen hervorgehoben vorn.
      - name: Änderungen zusammenfassen
        if: ${{ !cancelled() }}
        run: |
          git show HEAD:Android-App/gradle/verification-metadata.xml > "$RUNNER_TEMP/alt.xml" 2>/dev/null || true
          python3 tools/pruefsummen-vergleich.py "$RUNNER_TEMP/alt.xml" gradle/verification-metadata.xml \
            > gradle/pruefsummen-zusammenfassung.md
          cat gradle/pruefsummen-zusammenfassung.md >> "$GITHUB_STEP_SUMMARY"
      # Auch nach einem roten Test: Gradle schreibt die Datei am Ende jedes
      # Laufs, und die Prüfsummen hängen nicht am Testergebnis.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: verification-metadata
          path: |
            Android-App/gradle/verification-metadata.xml
            Android-App/gradle/verification-keyring.*
            Android-App/gradle/pruefsummen-zusammenfassung.md
          if-no-files-found: error

  # Neue Prüfsummen kommen als Pull-Request, nie als Push: Sie entscheiden, welche
  # Bytes der Bau als echt annimmt, und ein Schlüssel mit Gruppen-Regex deckt
  # jedes künftige Paket der Gruppe. Das sieht ein Mensch im Review, bevor es gilt.
  pruefsummen-vorschlagen:
    needs: pruefsummen
    if: github.event_name == 'workflow_dispatch' && inputs.pruefsummen && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/pruefsummen
      # Ein eigener Zweig je Lauf; der Zweig des Laufs bleibt unberührt. Ein mit
      # GITHUB_TOKEN angelegter Pull-Request startet keine CI von selbst.
      - name: Zweig und Pull-Request anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEU="$RUNNER_TEMP/pruefsummen"
          install -m 644 "$NEU/verification-metadata.xml" Android-App/gradle/verification-metadata.xml
          for f in "$NEU"/verification-keyring.*; do install -m 644 "$f" Android-App/gradle/; done
          git add Android-App/gradle/verification-metadata.xml Android-App/gradle/verification-keyring.*
          if git diff --cached --quiet; then echo "Prüfsummen unverändert." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ZWEIG="pruefsummen/$GITHUB_RUN_ID"
          git switch -c "$ZWEIG"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Gradle-Prüfsummen erneuert (Lauf $GITHUB_RUN_ID)"
          git push origin "HEAD:refs/heads/$ZWEIG"
          { head -c 60000 "$NEU/pruefsummen-zusammenfassung.md"
            printf '\n\nDie CI startet für diesen Zweig nicht von selbst: Pull-Request schliessen und wieder öffnen oder den Workflow auf dem Zweig von Hand anstossen.\n'
          } > "$RUNNER_TEMP/text.md"
          if gh pr create --base "$GITHUB_REF_NAME" --head "$ZWEIG" \
              --title "Gradle-Prüfsummen erneuern (Lauf $GITHUB_RUN_ID)" --body-file "$RUNNER_TEMP/text.md"; then
            echo "Pull-Request für $ZWEIG angelegt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Zweig $ZWEIG liegt bereit, der Pull-Request liess sich nicht anlegen (Settings → Actions → General: Allow GitHub Actions to create and approve pull requests). Von Hand vorschlagen."
          fi

  # ── Referenzbilder für die Bildschirmfotos ──────────────────────────────────
  # Aufnehmen kann nur ein Lauf mit Android-SDK, also die CI. Der erste Job nimmt
  # mit Lesezugriff auf, der zweite checkt die Bilder direkt auf dem Zweig ein —
  # nie auf main. Anders als bei den Prüfsummen ohne eigenen Pull-Request: PNGs
  # werden nie ausgeführt und entscheiden nicht, was der Bau annimmt; der Merge
  # nach main zeigt sie ohnehin im Review. Eingecheckt wird nur, was PNG ist.
  bildschirmfotos:
    if: github.event_name == 'workflow_dispatch' && inputs.bildschirmfotos
    runs-on: ubuntu-latest
    # Gemessen 8–17 Minuten; was mehr als doppelt so lange läuft, hängt und
    # soll den Runner nicht bis zur 6-Stunden-Grenze halten.
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/gradle-wrapper-pruefen.py gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Alte Referenzen weg, damit ein umbenannter Fall keine Leiche hinterlässt.
      - name: Bildschirmfotos aufnehmen
        run: |
          chmod +x gradlew
          rm -f app/src/test/bildschirmfotos/*.png
          ./gradlew --no-daemon :app:recordRoborazziDebug
          anzahl=$(ls app/src/test/bildschirmfotos/*.png 2>/dev/null | wc -l)
          echo "$anzahl Bilder aufgenommen."
          test "$anzahl" -gt 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bildschirmfotos-referenz
          path: Android-App/app/src/test/bildschirmfotos/*.png
          if-no-files-found: error

  bildschirmfotos-einchecken:
    needs: bildschirmfotos
    if: github.event_name == 'workflow_dispatch' && inputs.bildschirmfotos && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Alte Referenzen entfernen
        run: git rm -q --ignore-unmatch 'Android-App/app/src/test/bildschirmfotos/*.png'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bildschirmfotos-referenz
          path: Android-App/app/src/test/bildschirmfotos
      - name: Einchecken
        run: |
          set -euo pipefail
          for f in Android-App/app/src/test/bildschirmfotos/*; do
            [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" ] || { echo "::error::$f ist kein PNG"; exit 1; }
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android-App/app/src/test/bildschirmfotos/*.png
          if git diff --cached --quiet; then echo "Bildschirmfotos unverändert."; exit 0; fi
          echo "## Bildschirmfotos" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git commit -m "Bildschirmfotos als Referenz eingecheckt (Lauf $GITHUB_RUN_ID)"
          git push origin "HEAD:$GITHUB_REF_NAME"
