name: Android-App

# Läuft bei jedem Push auf main und bei jedem Pull-Request, der die App
# berührt — und von Hand über den Knopf "Run workflow".
#
# Zweck: Der Übersetzungs- und Testbefund kommt automatisch, ohne dass jemand
# lokal bauen muss. Am Ende steht eine installierbare BrickInventory.apk.
on:
  push:
    branches: [main]
    paths:
      - 'Android-App/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android-App/**'
  workflow_dispatch:

# Ein neuer Push bricht einen noch laufenden Bau desselben Zweigs ab — sonst
# stehen bei mehreren Pushes drei Läufe in der Schlange und der erste ist
# längst uninteressant.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android-App

    # Der `secrets`-Kontext steht in einem `if:` auf SCHRITTEBENE nicht zur
    # Verfügung — `env` schon. Deshalb wird die Frage "gibt es einen
    # Schlüsselspeicher?" hier einmal beantwortet und unten über env geprüft.
    env:
      HAT_SCHLUESSEL: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # Aus demselben Grund wie oben: Der Drive-Schritt haengt an einem Secret,
      # und ein `if:` auf Schrittebene kann `secrets` nicht lesen. Das eigene
      # `env:` DES SCHRITTES hilft dabei nicht — dessen `if:` wird ausgewertet,
      # bevor es gilt. Also hier.
      HAT_DRIVE: ${{ secrets.GDRIVE_REFRESH_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6

      # JDK 17 — passt zu sourceCompatibility/targetCompatibility und jvmTarget
      # im app/build.gradle.kts. Verlangt AGP eine neuere Fassung, steht das
      # klar im Protokoll; dann hier auf '21' stellen. Die Zahlen im
      # Buildskript bleiben trotzdem auf 17.
      - name: JDK einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── Vorabprüfung ────────────────────────────────────────────────────────
      #
      # Der Gradle-Wrapper besteht aus DREI Dateien, und zwei davon sind binär:
      # `gradle-wrapper.jar` kommt beim Zippen eines Projekts oft nicht mit, und
      # dann fehlt sie im Repository, ohne dass es jemandem auffällt.
      #
      # Ohne diese Prüfung scheitert der Lauf ein paar Schritte später mit einer
      # Meldung, die nicht sagt, was fehlt — `setup-gradle` prüft ab v4 die
      # Prüfsumme der Wrapper-JAR und bricht ab, `chmod` findet die Datei nicht,
      # oder Java meldet "Could not find or load main class
      # org.gradle.wrapper.GradleWrapperMain". Drei verschiedene Fehlerbilder für
      # dieselbe Ursache.
      - name: Gradle-Wrapper vorhanden?
        run: |
          set -eu
          fehlt=""
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] || fehlt="$fehlt $f"
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Im Repository fehlen:$fehlt"
            echo ""
            echo "Diese Dateien gehören ins Repository — ohne sie kann niemand bauen."
            echo "Aus dem lokalen Projekt nach Android-App/ kopieren und committen:"
            echo "  gradlew"
            echo "  gradlew.bat"
            echo "  gradle/wrapper/gradle-wrapper.jar"
            echo ""
            echo "Was tatsächlich da ist:"
            ls -la . gradle/wrapper 2>/dev/null || true
            exit 1
          fi
          echo "Wrapper vollständig."

      # Legt den Gradle-Cache an. Ohne das lädt jeder Lauf alle Abhängigkeiten
      # neu — mehrere Minuten pro Bau.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6

      # Auf Windows committete Dateien tragen das Ausführbar-Bit oft nicht.
      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      # Zuerst die Tests: rund fünfzig Testdateien, die in Sekunden laufen und
      # das meiste abfangen, bevor der lange Übersetzungslauf beginnt.
      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # ── Signatur ────────────────────────────────────────────────────────────
      #
      # Der Schlüsselspeicher liegt als Base64 in einem Repository-Secret und
      # wird hier in eine Datei ausserhalb des Arbeitsverzeichnisses geschrieben
      # (RUNNER_TEMP) — so kann er nicht versehentlich ins APK oder in ein
      # Artefakt geraten.
      #
      # Fehlt das Secret, wird der Schritt übersprungen. Der Bau läuft dann
      # trotzdem durch und liefert ein UNSIGNIERTES APK; der letzte Schritt sagt
      # das deutlich, statt still etwas Uninstallierbares hochzuladen.
      - name: Schlüsselspeicher bereitstellen
        if: env.HAT_SCHLUESSEL == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/brick.jks"

      - name: Release bauen
        env:
          # Immer gesetzt, auch ohne Secret: Das Buildskript prüft, ob die
          # Datei EXISTIERT, und baut sonst unsigniert. Eine Fallunterscheidung
          # an zwei Stellen wäre eine mehr, als es braucht.
          BRICK_KEYSTORE_PFAD: ${{ runner.temp }}/brick.jks
          BRICK_KEYSTORE_PASSWORT: ${{ secrets.KEYSTORE_PASSWORT }}
          BRICK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BRICK_KEY_PASSWORT: ${{ secrets.KEY_PASSWORT }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      # ── Warum ZUSÄTZLICH ein Bundle (.aab) ──────────────────────────────────
      #
      # Play nimmt seit August 2021 für neue Apps kein APK mehr an, nur noch ein
      # Android App Bundle. Das APK bleibt trotzdem: Es ist das, was man sich
      # hier aus den Artefakten zieht und direkt aufs Gerät schiebt. Ein .aab
      # lässt sich NICHT installieren — daraus schneidet erst Play die
      # geräte-passenden APKs.
      #
      # Beides entsteht im selben Gradle-Aufruf oben, damit der lange
      # Übersetzungslauf nur einmal stattfindet.

      # R8 läuft nur im Release-Build (isMinifyEnabled = true). Der Lint-Bericht
      # ist deshalb gerade hier interessant; abbrechen soll er nicht, das
      # entspricht abortOnError = false im Buildskript.
      - name: Lint
        run: ./gradlew --no-daemon lintRelease
        continue-on-error: true

      # Umbenennen passiert HIER und nicht in Gradle: Der Ausgabename lässt sich
      # dort nur über interne AGP-Klassen setzen, die zwischen Versionen
      # wechseln. Ein `mv` ist langweilig und hält.
      - name: APK umbenennen
        run: |
          set -eu
          cd app/build/outputs/apk/release
          ls -la
          if [ -f app-release.apk ]; then
            mv app-release.apk BrickInventory.apk
            echo "signiert: ja"
          elif [ -f app-release-unsigned.apk ]; then
            mv app-release-unsigned.apk BrickInventory.apk
            echo "::warning::APK ist UNSIGNIERT und lässt sich nicht installieren. Die vier Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORT, KEY_ALIAS und KEY_PASSWORT fehlen oder sind unvollständig."
          else
            echo "::error::Kein APK gefunden."
            exit 1
          fi

      # `always()`: Die Berichte sind gerade dann interessant, wenn der Lauf rot
      # ist. Ohne das lädt GitHub sie bei einem Fehlschlag nicht hoch.
      # upload-artifact auf v6 (vorher v4).
      #
      # v4 läuft auf Node 20 und erzeugt seit dessen Abkündigung bei jedem Lauf
      # die Warnung "being forced to run on Node.js 24". Nachgesehen statt
      # geraten — und das Nachsehen hat sich gelohnt:
      #
      #     v4 -> runs.using: node20      (warnt)
      #     v5 -> runs.using: node20      (warnt EBENFALLS)
      #     v6 -> runs.using: node24      (still)
      #
      # Der naheliegende Sprung auf die nächste Hauptversion hätte die Warnung
      # also NICHT beseitigt. Wer hier wieder anfasst: Die Fassung am Tag
      # abrufen und in action.yml unter runs.using nachsehen, welches Node sie
      # startet — die Versionsnummer allein sagt es nicht.
      #
      #     curl https://raw.githubusercontent.com/actions/upload-artifact/v6/action.yml
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testberichte
          path: |
            Android-App/app/build/reports/tests/
            Android-App/app/build/reports/lint-results-release.html
          # Scheitert der Lauf VOR den Tests, gibt es keine Berichte. Das ist
          # dann kein zusätzlicher Fehler, sondern nur eine Folge — ohne diese
          # Zeile schreibt GitHub eine irreführende Warnung ins Protokoll.
          if-no-files-found: ignore
          retention-days: 14

      - name: BrickInventory.apk sichern
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: BrickInventory
          path: Android-App/app/build/outputs/apk/release/BrickInventory.apk
          retention-days: 90

      # Das Bundle wird hier nur GEBAUT und gesichert, nicht veroeffentlicht.
      # Das Hochladen zu Play steht in einem eigenen Workflow, der von Hand
      # gestartet wird (android-playstore.yml) — eine Veroeffentlichung soll
      # nicht bei jedem Push auf main passieren.
      #
      # Der Bau hier hat trotzdem einen Zweck: Er faellt auf, wenn das Bundle
      # bricht, waehrend das APK noch durchlaeuft. Das kommt vor — R8 und die
      # Ressourcen-Aufteilung arbeiten fuer die beiden Formate nicht gleich.
      - name: App-Bundle (.aab) sichern
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: BrickInventory-bundle
          path: Android-App/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      # ── APK nach Google Drive ───────────────────────────────────────────────
      #
      # Warum ueberhaupt: Ein Artefakt hier laesst sich nur herunterladen, wer
      # bei GitHub ANGEMELDET ist, und es verfaellt nach 90 Tagen. Wer die App
      # jemandem zum Ausprobieren geben will, kann damit nichts anfangen.
      # Ein Drive-Link geht an jeden.
      #
      # ── Warum ein Refresh-Token und KEIN Dienstkonto ────────────────────────
      #
      # Der Weg, den fast jede Anleitung im Netz vorschlaegt, funktioniert bei
      # einem privaten Google-Konto NICHT: Ein Dienstkonto hat in Drive kein
      # Speicherkontingent und kann keine Dateien besitzen. Der Upload endet in
      # `storageQuotaExceeded`. Der offizielle Ausweg sind "Geteilte Ablagen",
      # und die gibt es nur mit Google Workspace.
      #
      # Deshalb hier ein Refresh-Token eines echten Kontos: Die Datei gehoert
      # dann dir und zaehlt gegen deine 15 GB. Einrichtung: Android-App/GDRIVE.md
      #
      # ── Warum curl und keine fertige Action ─────────────────────────────────
      #
      # Das Token gibt Schreibzugriff auf Drive. Eine Action aus dritter Hand
      # bekaeme es in die Hand, bei jedem Lauf, mit jeder kuenftigen Fassung.
      # Zwanzig Zeilen curl sind nachlesbar; ein npm-Buendel ist es nicht.
      #
      # Der Scope ist `drive.file`: Damit sieht dieses Token AUSSCHLIESSLICH
      # Dateien, die es selbst angelegt hat — nicht dein uebriges Drive. Das ist
      # der Unterschied zwischen "darf ein APK ablegen" und "darf alles lesen".
      - name: APK nach Google Drive
        if: success() && env.HAT_DRIVE == 'true'
        env:
          CLIENT_ID:     ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          ORDNER_ID:     ${{ secrets.GDRIVE_ORDNER_ID }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/BrickInventory.apk
          NAME=BrickInventory.apk

          # 1) Refresh-Token gegen ein kurzlebiges Zugriffstoken tauschen.
          #    --fail-with-body: sonst laeuft curl bei HTTP 400 mit Exitcode 0
          #    weiter und der Fehler faellt erst drei Schritte spaeter auf.
          ANTWORT=$(curl -sS --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token) || {
              echo "::error::Zugriffstoken nicht erhalten. Haeufigste Ursache: Der"
              echo "OAuth-Zustimmungsbildschirm steht noch auf 'Testing' — dann"
              echo "verfaellt das Refresh-Token nach 7 Tagen. Siehe Android-App/GDRIVE.md."
              exit 1
            }
          TOKEN=$(printf '%s' "$ANTWORT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          # Der Wert darf nie im Protokoll landen, auch nicht versehentlich
          # ueber ein `set -x` weiter unten.
          echo "::add-mask::$TOKEN"

          # 2) Gibt es die Datei schon? Dann wird sie AKTUALISIERT statt neu
          #    angelegt. Das ist der Kern: Die Datei-ID bleibt, damit bleibt der
          #    Freigabe-Link stabil. Sonst braeuchten die Testenden nach jedem
          #    Bau einen neuen Link.
          Q="name='$NAME' and trashed=false"
          [ -n "${ORDNER_ID:-}" ] && Q="$Q and '$ORDNER_ID' in parents"
          VORHANDEN=$(curl -sS --fail-with-body -G https://www.googleapis.com/drive/v3/files \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "q=$Q" \
            --data-urlencode "fields=files(id)" \
            | python3 -c 'import sys,json; f=json.load(sys.stdin).get("files",[]); print(f[0]["id"] if f else "")')

          if [ -n "$VORHANDEN" ]; then
            echo "Datei existiert ($VORHANDEN) — Inhalt wird ersetzt, Link bleibt."
            ERGEBNIS=$(curl -sS --fail-with-body -X PATCH \
              "https://www.googleapis.com/upload/drive/v3/files/$VORHANDEN?uploadType=media&fields=id,name,size" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK")
          else
            echo "Datei noch nicht vorhanden — wird angelegt."
            ELTERN="[]"
            [ -n "${ORDNER_ID:-}" ] && ELTERN="[\"$ORDNER_ID\"]"
            printf '{"name":"%s","parents":%s}' "$NAME" "$ELTERN" > "$RUNNER_TEMP/meta.json"
            ERGEBNIS=$(curl -sS --fail-with-body -X POST \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size" \
              -H "Authorization: Bearer $TOKEN" \
              -F "metadata=@$RUNNER_TEMP/meta.json;type=application/json;charset=UTF-8" \
              -F "file=@$APK;type=application/vnd.android.package-archive") || {
                echo "::error::Upload abgelehnt. Steht in der Meldung 'storageQuotaExceeded',"
                echo "gehoert das Token einem DIENSTKONTO — die haben in Drive kein"
                echo "Kontingent. Es braucht ein Refresh-Token eines echten Kontos."
                exit 1
              }
          fi

          ID=$(printf '%s' "$ERGEBNIS" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          GROESSE=$(printf '%s' "$ERGEBNIS" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("size","?"))')

          # Gegenprobe: Nicht der Antwort glauben, sondern die Datei ZURUECK
          # fragen und die Groesse mit der lokalen vergleichen. Ein abgebrochener
          # Upload liefert sonst eine gueltig aussehende Antwort und einen Link
          # auf ein halbes APK.
          LOKAL=$(stat -c%s "$APK")
          if [ "$GROESSE" != "$LOKAL" ]; then
            echo "::error::Drive meldet $GROESSE Bytes, lokal sind es $LOKAL. Upload unvollstaendig."
            exit 1
          fi
          echo "Hochgeladen: $GROESSE Bytes, vollstaendig."

          {
            echo "## APK liegt in Google Drive"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Datei | \`$NAME\` |"
            echo "| Groesse | $GROESSE Bytes |"
            echo "| Link | https://drive.google.com/file/d/$ID/view |"
            echo ""
            echo "> Der Link bleibt ueber alle Builds hinweg derselbe — die Datei"
            echo "> wird ersetzt, nicht neu angelegt. Einmal freigeben genuegt."
          } >> "$GITHUB_STEP_SUMMARY"
