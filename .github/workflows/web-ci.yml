# CI der Web-App: frisch ausgecheckt, aus der Lockfile installiert, neu gebaut,
# gegen ein leeres PostgreSQL. REQUIRE_DB und REQUIRE_BROWSER machen aus einer
# fehlenden Datenbank oder einem fehlenden Chrome einen Fehler statt eines
# stillen Überspringens. Kein paths-Filter: Die Suite liest auch Android-App/
# (Retrofit-Schnittstelle, Setnummer-Regel).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Ein neuer Push auf denselben Zweig bricht den vorherigen Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nur lesen: Pakete und Testdateien eines Pull-Requests bekommen kein Schreibrecht.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Regulär rund 12 Minuten, davon gut 6 für die Browser-Dateien (zwei zugleich).
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Web-App

    services:
      postgres:
        # Dieselbe Hauptversion wie im Betrieb (compose.yaml); Sperren und
        # Planer unterscheiden sich zwischen Hauptversionen.
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: cattest
        ports:
          - 5432:5432
        # Erst testen, wenn die Datenbank Verbindungen annimmt.
        options: >-
          --health-cmd "pg_isready -U tester -d cattest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://tester:tester@localhost:5432/cattest
      REQUIRE_DB: '1'
      # Ohne Chrome schlagen die Browser-Tests fehl statt zu überspringen
      # (ubuntu-latest bringt google-chrome mit).
      REQUIRE_BROWSER: '1'
      # Einige Suiten bauen eine echte Session auf. Der Wert ist beliebig, muss
      # aber die Mindestlänge aus server.ts erfüllen (32 Zeichen).
      SESSION_SECRET: ci-secret-nur-fuer-den-testlauf-lang-genug
      # npm test (scripts/test-lauf.js) gibt jeder Testdatei eine eigene Kopie
      # der Vorlage-Datenbank; vier zugleich passen zu den vier Kernen des
      # Runners und bleiben unter max_connections=100 des Dienstes.
      TEST_PARALLEL: '4'
      # Browser-Dateien haben je eigene DB, Port und Chrome-Profil; zwei zugleich.
      TEST_PARALLEL_BROWSER: '2'
      # Die Caddyfile-Tests laufen immer (Caddy aus dem Image in compose.yaml).
      REQUIRE_CADDY: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pg_dump/psql auf dem Runner für backup-restore-db. pg_dump verweigert
      # einen neueren Server, und der Runner bringt eine ältere Fassung mit;
      # die Hauptversion wird aus dem Dienst oben gelesen, damit es nur eine
      # Zahl gibt.
      - name: PostgreSQL-Klienten in der Version des Dienstes bereitstellen
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # awk statt `grep | head`: head schlösse die Leitung (SIGPIPE).
          haupt=$(awk -F'image: postgres:' '/image: postgres:/ { split($2, a, /[^0-9]/); print a[1]; exit }' .github/workflows/web-ci.yml)
          [ -n "$haupt" ] || { echo "::error::Hauptversion des Postgres-Dienstes nicht gefunden"; exit 1; }
          if pg_dump --version 2>/dev/null | grep -qE "\\) ${haupt}\\."; then
            echo "pg_dump passt bereits: $(pg_dump --version)"
          else
            echo "Vorhanden: $(pg_dump --version 2>/dev/null || echo 'kein pg_dump') — gebraucht wird $haupt"
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq "postgresql-client-${haupt}"
            # Sonst gewinnt weiterhin der ältere /usr/bin/pg_dump.
            echo "/usr/lib/postgresql/${haupt}/bin" >> "$GITHUB_PATH"
          fi

      # Eigener Schritt: $GITHUB_PATH wirkt erst im nächsten.
      - name: pg_dump passt zum Dienst
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          haupt=$(awk -F'image: postgres:' '/image: postgres:/ { split($2, a, /[^0-9]/); print a[1]; exit }' .github/workflows/web-ci.yml)
          echo "pg_dump: $(pg_dump --version)"
          pg_dump --version | grep -qE "\\) ${haupt}\\." || {
            echo "::error::pg_dump ist nicht Version ${haupt} — backup-restore-db kann nicht laufen"
            exit 1
          }

      # Caddy aus demselben Image wie im Betrieb (Digest in compose.yaml); die
      # statische Programmdatei läuft auch auf dem Läufer.
      - name: Caddy bereitstellen
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bild=$(awk '/image: caddy:/ { print $2; exit }' Web-App/compose.yaml)
          [ -n "$bild" ] || { echo "::error::Caddy-Image in compose.yaml nicht gefunden"; exit 1; }
          id=$(docker create "$bild")
          docker cp "$id:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$id" >/dev/null
          "$RUNNER_TEMP/caddy" version
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"

      # age für test/backup-verschluesselt.test.js (scripts/backup.sh mit BACKUP_AGE_EMPFAENGER).
      - name: age bereitstellen
        run: command -v age || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Wie im Dockerfile: geprüft wird, was ausgeliefert wird
          # (test/build-tooling.test.js hält beide zusammen).
          node-version: '26'
          cache: npm
          # working-directory gilt nur für run-Schritte, nicht für Actions.
          cache-dependency-path: Web-App/package-lock.json

      # npm ci scheitert, wenn package.json und Lockfile auseinanderlaufen.
      # Install-Skripte nur für esbuild, wie im Dockerfile.
      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts && npm rebuild esbuild

      # Registry-Signaturen und, wo vorhanden, Herkunftsnachweise jedes
      # installierten Pakets: Ein Tarball, den die Registry nicht signiert hat, ist rot.
      - name: Signaturen der Pakete
        run: npm audit signatures

      - name: Typprüfung
        run: npx tsc --noEmit

      # Rot bei neuer Schuld oder bei einem verwaisten Eintrag der
      # Ausnahmeliste in scripts/check-noimplicitany.js.
      - name: Typprüfung (noImplicitAny, gestaffelt)
        run: npm run typecheck:strict

      # Die Oberfläche (public/js, i18n.js) hat eigene Konfigurationen: ES-Module
      # und die zwei klassischen Skripte. Beide müssen ohne Meldung durchlaufen.
      - name: Typprüfung Oberfläche
        run: npm run typecheck:frontend

      # Tests mit checkJs, ohne strict; Ratsche in scripts/lint-schranken.json.
      - name: Typprüfung Tests
        run: npm run typecheck:tests

      # Biome als Ratsche: rot erst, wenn Funde oder unformatierte Dateien
      # über die Schranke in scripts/lint-schranken.json steigen.
      - name: Lint
        run: npm run lint

      - name: Formatierung
        run: npm run format:pruefen

      # Eigener Schritt, damit ein Baufehler nicht als roter Test erscheint.
      - name: Bauen
        run: npm run build

      - name: Bündel passt zu den Quellen
        run: git diff --exit-code -- public/js/app.bundle.js

      # Mitschnitt für den Schritt danach: Am Jobende überdeckt das Protokoll
      # des Postgres-Dienstes die roten Zeilen. pipefail, sonst bestimmt tee
      # den Rückgabewert und der Schritt wäre bei roten Tests grün.
      - name: Tests
        run: |
          set -o pipefail
          npm test -- --abdeckung 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Zeilenabdeckung je Bereich gegen scripts/abdeckung-schranken.json.
      - name: Abdeckung
        run: node scripts/abdeckung.js pruefen

      - name: Abdeckungsbericht
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: abdeckung
          path: |
            Web-App/coverage/lcov.info
            Web-App/coverage/coverage-summary.json
            Web-App/coverage/bereiche.json
          if-no-files-found: ignore

      - name: Rote Tests auflisten
        if: failure()
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/test.log" ] || { echo "Kein Testprotokoll — der Lauf ist vorher gescheitert."; exit 0; }

          # Beide Reporter-Formen: TAP („not ok“) und spec („✖ “); welcher
          # schreibt, hängt an der Node-Fassung.
          ROT_MUSTER='^(not ok|✖ )'
          {
            echo "## Rote Tests"
            echo ""
            echo '```'
            grep -E "$ROT_MUSTER" "$RUNNER_TEMP/test.log" || echo "(keine — der Lauf ist an etwas anderem gescheitert)"
            echo '```'
            echo ""
            grep -E '^(#|ℹ) (tests|pass|fail) ' "$RUNNER_TEMP/test.log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "── Rote Tests samt Begruendung ──"
          # `-m 20` statt `| head`: keine Kette, deren letztes Glied nur durchreicht.
          grep -E -m 20 -A 12 "$ROT_MUSTER" "$RUNNER_TEMP/test.log" || true

          # Annotationen stehen oben im Joblog und sind über die API lesbar;
          # das rohe Protokoll ist von aussen nicht zu holen.
          grep -E -m 20 "$ROT_MUSTER" "$RUNNER_TEMP/test.log" | while IFS= read -r zeile; do
            echo "::error title=Roter Test::${zeile}"
          done

          # Auch der Fall „rot ohne einzelnen roten Test“ (Modul lädt nicht,
          # Prozess stirbt) bekommt eine Annotation, sonst schwiege die Diagnose.
          rot=$(grep -E -c "$ROT_MUSTER" "$RUNNER_TEMP/test.log" || true)
          if [ "${rot:-0}" -gt 0 ]; then
            # Mit Begründung, nicht nur dem Namen; das Auslesen steht in
            # .github/rote-tests.awk, damit es prüfbar ist (ci-rote-tests.test.js).
            awk -f "$GITHUB_WORKSPACE/.github/rote-tests.awk" "$RUNNER_TEMP/test.log" || true
          else
            # Rot ohne roten Test: das Ende des Protokolls als Annotation.
            ende=$(tail -n 40 "$RUNNER_TEMP/test.log" | tr '\n' '~' | sed 's/%/%25/g; s/\r/%0D/g; s/~/%0A/g')
            echo "::error title=Testlauf ohne einzelnen Fehlschlag::$ende"
          fi
          # Die Summenzeile immer: Sie sagt, ob überhaupt etwas gelaufen ist.
          summe=$(grep -E '^(#|ℹ) (tests|pass|fail) ' "$RUNNER_TEMP/test.log" | tr '\n' ' ' || true)
          echo "::notice title=Testsumme::${summe:-keine Summenzeile — der Lauf ist vor dem ersten Test gescheitert}"

      # Eigener Schritt, damit ein Befund nicht in den Testausgaben untergeht.
      # --omit=dev: Was nur beim Bauen läuft, erreicht den Dienst nicht. Rot ab
      # „moderate“: Bei einem kleinen Baum ist jeder Befund ein Update.
      - name: Sicherheitsprüfung der Abhängigkeiten
        env:
          BERICHT: ${{ runner.temp }}/audit.json
          FEHLER: ${{ runner.temp }}/audit.err
        run: |
          set -uo pipefail
          # Die Antwort wird gelesen, nicht nur der Rückgabewert: Eine hängende
          # Registry und eine echte Lücke sind sonst nicht zu unterscheiden.
          # Kurze Frist und genau eine Wiederholung, und nur für eine unlesbare
          # Antwort; ein Befund wird nicht so lange abgefragt, bis er passt.
          for versuch in 1 2; do
            npm audit --omit=dev --json --fetch-timeout=60000 \
              > "$BERICHT" 2> "$FEHLER" || true
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).metadata.vulnerabilities' "$BERICHT" 2>/dev/null; then
              break
            fi
            echo "Versuch $versuch: keine auswertbare Antwort von der Registry."
            [ "$versuch" = 1 ] || {
              ende=$(tail -c 1500 "$FEHLER" | tr '\n' '~' | sed 's/%/%25/g; s/\r/%0D/g; s/~/%0A/g')
              echo "::error title=npm audit ohne auswertbare Antwort::${ende:-keine Fehlerausgabe}"
              exit 1
            }
          done
          # pdfjs-dist und qrcodejs sind devDependencies, werden aber an den Browser
          # ausgeliefert (public/vendor/): Ihr Befund zählt wie ein Laufzeitpaket.
          npm audit --json --fetch-timeout=60000 > "$RUNNER_TEMP/audit-voll.json" 2>/dev/null || true
          node -e '
            let r; try { r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); }
            catch { console.log("::warning title=npm audit (vendor)::keine auswertbare Antwort"); process.exit(0); }
            let rot = false;
            for (const name of ["pdfjs-dist", "qrcodejs"]) {
              const v = (r.vulnerabilities || {})[name];
              if (v && ["moderate", "high", "critical"].includes(v.severity)) {
                console.log("::error title=Schwachstelle (" + v.severity + ")::" + name + " (public/vendor)");
                rot = true;
              }
            }
            if (rot) process.exit(1);
          ' "$RUNNER_TEMP/audit-voll.json" || exit 1
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.BERICHT, "utf8"));
            const m = r.metadata.vulnerabilities;
            const stand = Object.entries(m).map(([k, v]) => k + "=" + v).join(" ");
            const schwer = (m.moderate || 0) + (m.high || 0) + (m.critical || 0);
            if (schwer === 0) {
              console.log("::notice title=npm audit::keine Luecke ab \"moderate\" — " + stand);
            } else {
              // Jede einzeln als Annotation: „5 Luecken" allein zwingt wieder
              // zum Protokoll, das von hier aus nicht zu holen ist.
              for (const [name, v] of Object.entries(r.vulnerabilities || {})) {
                if (!["moderate", "high", "critical"].includes(v.severity)) continue;
                const woher = (v.via || [])
                  .map(x => typeof x === "string" ? x : x.title).join("; ");
                console.log("::error title=Schwachstelle (" + v.severity + ")::" + name + " — " + woher);
              }
              console.log("::error title=npm audit::" + schwer + " Luecken ab \"moderate\" — " + stand);
              process.exit(1);
            }
          '
