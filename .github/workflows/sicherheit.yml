# Sicherheitsprüfungen: CodeQL (Web und App), Trivy (Abhängigkeiten, eigenes
# Image und die Images aus compose.yaml) und ein ZAP-Baseline-Lauf gegen einen
# hier gestarteten Server.
# `npm audit --omit=dev` läuft als eigener Schritt in web-ci.yml.
#
# Jede Prüfung ist ein eigener Job: Ein Befund in einem Teil soll die
# anderen nicht verdecken. Bedrohungsmodell: docs/SICHERHEIT.md.
name: Sicherheit

on:
  push:
    branches: ['**']
  pull_request:
  # Wöchentlich auch ohne Änderung: Neue Lücken in alten Abhängigkeiten
  # erscheinen, ohne dass sich der Code bewegt.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: sicherheit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.sprache }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - sprache: javascript-typescript
            bau: none
          - sprache: java-kotlin
            bau: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: JDK einrichten
        if: matrix.bau == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-Prüfsumme gegen die amtliche
        if: matrix.bau == 'manual'
        working-directory: Android-App
        run: python3 tools/gradle-wrapper-pruefen.py gradle/wrapper/gradle-wrapper.properties

      # Nur lesen: Den Gradle-Cache schreibt allein der Baujob von android.yml (sec17 M1).
      - name: Gradle einrichten
        if: matrix.bau == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.sprache }}
          build-mode: ${{ matrix.bau }}
          queries: security-extended

      # Kotlin braucht einen echten Übersetzungslauf, sonst sieht CodeQL nichts:
      # ohne Build-Cache (sonst kommt compileKotlin FROM-CACHE) und mit dem
      # Übersetzer im Gradle-Prozess, den CodeQL mitschneidet.
      - name: App übersetzen
        if: matrix.bau == 'manual'
        working-directory: Android-App
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            -Pkotlin.compiler.execution.strategy=in-process assembleDebug

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.sprache }}

  trivy:
    name: Trivy (Abhängigkeiten und Image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Lockfiles im Baum, praktisch Web-App/package-lock.json: Die App hat keine
      # gradle.lockfile (siehe Job android-abhaengigkeiten). Nur behebbare
      # Lücken ab „high“ sind rot.
      - name: Abhängigkeiten im Dateisystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Image bauen
        run: docker build -t brickinventory:sicherheit Web-App

      - name: Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: brickinventory:sicherheit
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # Trivy ist vom ersten Schritt schon eingerichtet.
          skip-setup-trivy: true

  # ── Fremde Images aus compose.yaml ────────────────────────────────────────
  # Die Liste kommt aus compose.yaml, damit Renovate (docker-compose) die
  # einzige Stelle pflegt. Eine behebbare Lücke ab high macht den Lauf rot:
  # Behoben wird sie mit dem nächsten Digest. Bis dahin steht sie mit Grund und
  # Ablaufdatum in .github/trivy-betrieb.ignore — danach ist sie wieder rot.
  compose-images:
    name: Images aus compose.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.lesen.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Festgenagelte Images lesen
        id: lesen
        run: |
          sed -n 's/^[[:space:]]*image:[[:space:]]*\([^[:space:]#]*@sha256:[0-9a-f]\{64\}\).*/\1/p' Web-App/compose.yaml | sort -u > images.txt
          [ -s images.txt ] || { echo "::error title=compose.yaml::Kein Image per Digest gefunden."; exit 1; }
          echo "images=$(jq -R . images.txt | jq -sc .)" >> "$GITHUB_OUTPUT"
      # Meldet einen Tag, der weitergezogen ist, ohne dass ein Renovate-PR kam.
      - name: Digests gegen die aktuellen Tags
        run: |
          while read -r ref; do
            tag=${ref%@*}; fest=${ref#*@}
            aktuell=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest) || {
              echo "::warning title=Digest unbekannt::$tag liess sich nicht abfragen."; continue; }
            if [ "$aktuell" = "$fest" ]; then echo "$tag: aktuell"
            else echo "::warning title=Digest veraltet::$tag steht auf $fest, der Tag zeigt auf $aktuell."; fi
          done < images.txt

  trivy-compose:
    name: Trivy (${{ matrix.image }})
    needs: compose-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.compose-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Bekannte Lücken
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image.txt
          trivyignores: .github/trivy-betrieb.ignore
          exit-code: '1'
      - name: Bericht
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          [ -f trivy-image.txt ] || exit 0
          cat trivy-image.txt
          { echo "## $IMAGE (Trivy)"; echo '```'; cat trivy-image.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'Total: [1-9]' trivy-image.txt; then
            echo "::warning title=Lücken in ${IMAGE%%@*}::Trivy meldet behebbare Lücken ab high, siehe Zusammenfassung."
          fi

  # ── Hier gebaute Betriebs-Images (Caddy aus Dockerfile.caddy) ─────────────
  # Ohne Ausnahmeliste: Für einen eigenen Bau gibt es keinen Grund, auf einen
  # fremden Digest zu warten.
  trivy-eigenbau:
    name: Trivy (Caddy, eigener Bau)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Caddy bauen
        run: docker build -f Web-App/Dockerfile.caddy -t brickinventory-caddy:pruefung Web-App
      - name: Bekannte Lücken
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: brickinventory-caddy:pruefung
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  zap:
    name: ZAP-Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Web-App
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: zap
          POSTGRES_PASSWORD: zap-nur-im-lauf
          POSTGRES_DB: zap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zap -d zap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: Web-App/package-lock.json

      - name: Bauen
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm run build

      # Wie im Betrieb: NODE_ENV=production (Startverbote, Cookies, CSP).
      # Das Protokoll geht in eine Datei, damit ein Fehlstart lesbar ist.
      # Der Dienstcontainer kennt nur den Superuser; ZAP prüft die HTTP-Seite,
      # die Datenbankrolle prüft db-rolle-db.test.js.
      - name: Server starten
        env:
          NODE_ENV: production
          DB_SUPERUSER_ERLAUBT: '1'
          PORT: '3000'
          WEB_WORKERS: '1'
          DATABASE_URL: postgres://zap:zap-nur-im-lauf@localhost:5432/zap
          SESSION_SECRET: zap-lauf-geheimnis-lang-genug-fuer-den-start
          ADMIN_PASSWORD: zap-lauf-verwalter-passwort
          # Ohne Adresse verweigert der Betrieb den Start; so prüft ZAP auch den Host-Filter mit.
          APP_BASE_URL: http://localhost:3000
        run: |
          nohup node dist/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then echo "Server bereit nach ${i}x2 s"; exit 0; fi
            sleep 2
          done
          echo "::error title=Server startet nicht::$(tail -c 1500 "$RUNNER_TEMP/server.log" | tr '\n' ' ')"
          exit 1

      # Passiver Lauf ohne Anmeldung. -I: Warnungen allein machen den Lauf
      # nicht rot; was ihn rot macht, steht in .github/zap-regeln.tsv.
      - name: ZAP-Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          docker_name: zaproxy/zap-stable:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
          rules_file_name: .github/zap-regeln.tsv
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-bericht

      - name: Serverprotokoll bei Fehlschlag
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/server.log" ] || exit 0
          echo "::error title=Serverprotokoll::$(tail -c 3000 "$RUNNER_TEMP/server.log" | tr '\n' '~' | sed 's/%/%25/g; s/~/%0A/g')"

  # ── Abhängigkeiten der App ────────────────────────────────────────────────
  # Trivy liest Gradle nur aus gradle.lockfile, und der Bau hat kein Locking.
  # Ein Init-Skript schreibt die Lockfiles hier für die Laufzeit-Klassenpfade
  # (dieselben Auflösungen wie das Release, also deckt verification-metadata
  # sie ab). Sperrend wie die Prüfung der Web-App (sec17 M2): Eine behebbare
  # Lücke ab „high“ ist rot, und der Signierjob in android.yml signiert kein
  # Etikett, dessen Commit hier nicht grün war. Ausnahmen mit Grund und Frist:
  # .github/trivy-android.ignore.
  android-abhaengigkeiten:
    name: Trivy (Android-Abhängigkeiten)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android-App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/gradle-wrapper-pruefen.py gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      - name: Lockfiles schreiben
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --init-script tools/abhaengigkeiten-sperren.init.gradle \
            abhaengigkeitenSperren --write-locks
          ls */gradle.lockfile

      # Gegenprobe in jedem Lauf: Ein Lockfile mit einer bekannt verwundbaren Fassung
      # (log4j-core 2.14.1, CVE-2021-44228) muss rot sein. Sonst prüfte der Schritt
      # darunter nichts — etwa weil Trivy das Format nicht mehr liest.
      - name: Gegenprobe vorbereiten
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/gegenprobe/modul"
          printf '%s\n' 'org.apache.logging.log4j:log4j-core:2.14.1=releaseRuntimeClasspath' 'empty=' \
            > "$RUNNER_TEMP/gegenprobe/modul/gradle.lockfile"
      - name: Gegenprobe (muss rot sein)
        id: gegenprobe
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/gegenprobe
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Gegenprobe war rot
        working-directory: .
        env:
          ERGEBNIS: ${{ steps.gegenprobe.outcome }}
        run: |
          if [ "$ERGEBNIS" != failure ]; then
            echo "::error title=Lückenprüfung blind::Ein Lockfile mit log4j-core 2.14.1 blieb grün ($ERGEBNIS); die Prüfung der App-Abhängigkeiten sieht nichts."
            exit 1
          fi

      - name: Bekannte Lücken
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Android-App
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-android.txt
          exit-code: '1'
          trivyignores: .github/trivy-android.ignore
          # Trivy ist von der Gegenprobe schon eingerichtet.
          skip-setup-trivy: true
      - name: Bericht
        if: always()
        working-directory: .
        run: |
          [ -f trivy-android.txt ] || exit 0
          cat trivy-android.txt
          { echo '## Android-Abhängigkeiten (Trivy)'; echo '```'; cat trivy-android.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
