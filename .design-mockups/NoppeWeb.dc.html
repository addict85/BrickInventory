<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
    /* Die Grundplatte: ein Noppenraster, so schwach, dass es Textur ist und
       kein Muster, ueber das man lesen muss. */
    .np-platte {
      background-color: #eef1f6;
      background-image: radial-gradient(circle at 10px 10px, rgba(20,24,33,.055) 4px, transparent 4.6px);
      background-size: 20px 20px;
    }
    /* Der harte Versatzschatten statt eines weichen: Kunststoff wirft keine
       Wolke, er liegt auf. Derselbe Ton wie die Rahmen, damit die Karte eine
       Kante hat und keinen Nebel. */
    .np-karte { background: #fff; border: 2.5px solid #161a21; border-radius: 14px; box-shadow: 0 4px 0 #161a21; overflow: hidden; }
    .np-knopf { border: 2.5px solid #161a21; border-radius: 10px; box-shadow: 0 3px 0 #161a21; font-weight: 800; }
  </style>
</helmet>

<div class="np-platte" style="width: 1440px; height: 900px; color: #161a21; display: flex; flex-direction: column; overflow: hidden">

  <!-- Kopfleiste: der Stein selbst. Die Noppen sitzen OBEN auf der Leiste,
       der schwarze Abschluss unten ist die Kante. -->
  <div style="flex-shrink: 0; background: #d91f26; border-bottom: 3px solid #161a21">
    <div style="display: flex; gap: 9px; padding: 5px 28px 0">
      <sc-for list="{{noppen}}" as="n" hint-placeholder-count="14">
        <div style="width: 15px; height: 7px; border-radius: 4px 4px 0 0; background: #f4575d"></div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 22px; padding: 0 28px; height: 58px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="12" rx="1.5"></rect>
          <path d="M7 8V6.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V8"></path>
          <path d="M14 8V6.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V8"></path>
        </svg>
        <span style="font-weight: 900; font-size: 17px; color: #fff; letter-spacing: -.01em">BrickInventory</span>
      </div>
      <div style="display: flex; gap: 4px">
        <div style="padding: 7px 15px; border-radius: 9px; background: #fff; color: #161a21; font-size: 14px; font-weight: 900; border: 2.5px solid #161a21">Galerie</div>
        <div style="padding: 7px 15px; border-radius: 9px; color: #ffd9da; font-size: 14px; font-weight: 700">Katalog</div>
        <div style="padding: 7px 15px; border-radius: 9px; color: #ffd9da; font-size: 14px; font-weight: 700">Teile</div>
        <div style="padding: 7px 15px; border-radius: 9px; color: #ffd9da; font-size: 14px; font-weight: 700">Minifiguren</div>
        <div style="padding: 7px 15px; border-radius: 9px; color: #ffd9da; font-size: 14px; font-weight: 700">Finanzen</div>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; align-items: center; gap: 8px; background: #fff; border: 2.5px solid #161a21; border-radius: 10px; padding: 7px 12px; width: 248px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6a7280" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="color: #6a7280; font-size: 13.5px; font-weight: 600">Set, Nummer oder Thema …</span>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 999px; background: #f5c400; border: 2.5px solid #161a21; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px">MB</div>
    </div>
  </div>

  <!-- Kennzahlen: vier Steine. Die Farbe traegt hier KEINE Auskunft, sie gibt
       Takt — deshalb sind die Zahlen selbst durchgehend schwarz und stehen in
       derselben Mono-Schrift wie ueberall im Baum. -->
  <div style="display: flex; gap: 14px; padding: 20px 28px 0">
    <sc-for list="{{kennzahlen}}" as="k" hint-placeholder-count="4">
      <div class="np-karte" style="flex-grow: 1; padding: 0">
        <div style="background: {{k.farbe}}; padding: 5px 13px 0; display: flex; gap: 7px">
          <div style="width: 13px; height: 6px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.45)"></div>
          <div style="width: 13px; height: 6px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.45)"></div>
          <div style="width: 13px; height: 6px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.45)"></div>
        </div>
        <div style="background: {{k.farbe}}; padding: 9px 14px 11px">
          <div style="font-size: 12px; font-weight: 800; color: {{k.schrift}}; letter-spacing: .05em; text-transform: uppercase">{{k.titel}}</div>
        </div>
        <div style="padding: 11px 14px 13px; border-top: 2.5px solid #161a21">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 25px; font-weight: 700">{{k.wert}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- Filterzeile -->
  <div style="display: flex; align-items: center; gap: 9px; padding: 20px 28px 16px">
    <div class="np-knopf" style="padding: 6px 15px; background: #f5c400; font-size: 13px">Alle</div>
    <div style="padding: 6px 15px; border-radius: 10px; border: 2.5px solid #161a21; background: #fff; font-size: 13px; font-weight: 700">Star Wars</div>
    <div style="padding: 6px 15px; border-radius: 10px; border: 2.5px solid #161a21; background: #fff; font-size: 13px; font-weight: 700">Creator Expert</div>
    <div style="padding: 6px 15px; border-radius: 10px; border: 2.5px solid #161a21; background: #fff; font-size: 13px; font-weight: 700">Technic</div>
    <div style="padding: 6px 15px; border-radius: 10px; border: 2.5px solid #161a21; background: #fff; font-size: 13px; font-weight: 700">Architecture</div>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 13px; font-weight: 800; color: #4a525e">312 Sets</span>
  </div>

  <!-- Kachelraster: sechs Spalten wie im Baum (.sgrid, minmax(185px)). -->
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; padding: 0 28px 28px">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
      <div class="np-karte" style="position: relative">
        <!-- Der Steindeckel mit vier Noppen. -->
        <div style="background: {{s.farbe}}; padding: 6px 12px 0; display: flex; gap: 8px; border-bottom: 2.5px solid #161a21">
          <div style="width: 14px; height: 7px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
          <div style="width: 14px; height: 7px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
          <div style="width: 14px; height: 7px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
          <div style="width: 14px; height: 7px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
        </div>
        <div style="aspect-ratio: 1; background: #f7f9fc; display: flex; align-items: center; justify-content: center; border-bottom: 2.5px solid #161a21">
          <svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="{{s.farbe}}" stroke-width="2.2" stroke-linejoin="round">
            <rect x="7" y="18" width="34" height="20" rx="2"></rect>
            <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M7 27h34"></path>
          </svg>
        </div>
        <div style="padding: 11px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.2px; font-weight: 700; color: #5a6270; margin-bottom: 3px">{{s.nummer}}</div>
          <div style="font-size: 13.4px; font-weight: 800; line-height: 1.3; margin-bottom: 8px">{{s.name}}</div>
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 11.4px; font-weight: 700; color: #6a7280">{{s.jahr}} · {{s.thema}}</span>
            <span style="background: #161a21; color: #fff; font-weight: 700; font-size: 10.6px; padding: 3px 8px; border-radius: 999px; font-family: 'JetBrains Mono', monospace">{{s.teile}}</span>
          </div>
        </div>
        <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; top: 34px; right: 9px; background: #00a94f; color: #fff; font-weight: 900; font-size: 10.6px; padding: 3px 9px; border-radius: 999px; border: 2px solid #161a21">✓ ×{{s.anzahl}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (nummer, name, jahr, thema, teile, besitz, anzahl, farbe) =>
      ({ nummer, name, jahr, thema, teile, besitz, anzahl, farbe });
    const K = (titel, wert, farbe, schrift) => ({ titel, wert, farbe, schrift });
    return {
      // Die Steinfarben laufen im Kreis und bedeuten NICHTS — siehe die Notiz
      // zu H auf der Flaeche. Das ist der Haken dieser Richtung.
      sets: [
        S('10276-1', 'Kolosseum',         2020, 'Creator Expert', '9036', true,  1, '#d91f26'),
        S('75192-1', 'Millennium Falcon', 2017, 'Star Wars',      '7541', true,  2, '#f5c400'),
        S('21058-1', 'Cheops-Pyramide',   2022, 'Architecture',   '1476', false, 0, '#1a6fd4'),
        S('42115-1', 'Lamborghini Sián',  2020, 'Technic',        '3696', true,  1, '#00a94f'),
        S('10497-1', 'Galaxy Explorer',   2022, 'Icons',          '1254', false, 0, '#ff7a00'),
        S('71043-1', 'Schloss Hogwarts',  2018, 'Harry Potter',   '6020', true,  1, '#8a4fbf'),
      ],
      kennzahlen: [
        K('Sets',        '312',        '#d91f26', '#fff'),
        K('Teile',       '148 902',    '#f5c400', '#161a21'),
        K('Minifiguren', '571',        '#1a6fd4', '#fff'),
        K('Marktwert',   'CHF 41 280', '#00a94f', '#fff'),
      ],
      noppen: Array.from({ length: 14 }, (_, i) => i),
    };
  }
}
</script>
</body>
</html>
