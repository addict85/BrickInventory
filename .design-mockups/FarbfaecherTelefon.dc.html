<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #2b2b2b; } a:hover { color: #6a6a6a; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fafafa; color: #2b2b2b; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #fff; border-bottom: 1px solid #e6e6e6; padding: 18px 16px 0; flex-shrink: 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 21px; font-weight: 800; letter-spacing: -.015em">Galerie</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a8a8a">312 · CHF 41 280</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; border: 1px solid #dcdcdc; border-radius: 9px; padding: 11px 12px; margin: 13px 0">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="color: #9a9a9a; font-size: 13.5px">Set, Nummer oder Thema …</span>
    </div>

    <!-- Der Faecher, auf dem Telefon als Streifen -->
    <div style="display: flex; gap: 6px; padding-bottom: 12px">
      <sc-for list="{{themen}}" as="t" hint-placeholder-count="5">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-height: 44px; justify-content: center">
          <div style="height: 5px; background: {{t.farbe}}; border-radius: 3px"></div>
          <span style="font-size: 9.5px; font-weight: 600; color: #6a6a6a; text-align: center">{{t.kurz}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 14px 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
        <div style="background: #fff; border: 1px solid #e6e6e6; border-radius: 10px; overflow: hidden; position: relative">
          <div style="height: 5px; background: {{s.farbe}}"></div>
          <div style="height: 113px; background: #f4f4f4; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee">
            <svg width="54" height="54" viewBox="0 0 48 48" fill="none" stroke="{{s.farbe}}" stroke-width="1.4" stroke-linejoin="round" opacity="0.9">
              <rect x="7" y="18" width="34" height="20" rx="2"></rect>
              <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
              <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
              <path d="M7 27h34"></path>
            </svg>
          </div>
          <div style="padding: 10px">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #8a8a8a; margin-bottom: 3px">{{s.nummer}}</div>
            <div style="font-size: 12.8px; font-weight: 600; line-height: 1.3; margin-bottom: 7px">{{s.name}}</div>
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span style="font-size: 10.5px; font-weight: 600; color: {{s.farbe}}">{{s.kurz}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #6a6a6a">{{s.teile}}</span>
            </div>
          </div>
          <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
            <div style="position: absolute; top: 12px; right: 8px; background: #fff; border: 1px solid #e0e0e0; font-weight: 600; font-size: 10px; padding: 2px 6px; border-radius: 999px">×{{s.anzahl}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; background: #fff; border-top: 1px solid #e6e6e6; padding: 0 6px 22px; flex-shrink: 0">
    <sc-for list="{{reiter}}" as="r" hint-placeholder-count="5">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 11px; font-weight: {{r.gewicht}}; color: {{r.farbe}}">{{r.name}}</div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      starwars: 'oklch(0.62 0.14 260)',
      creator:  'oklch(0.62 0.14 25)',
      arch:     'oklch(0.62 0.14 200)',
      technic:  'oklch(0.62 0.14 70)',
      icons:    'oklch(0.62 0.14 145)',
      potter:   'oklch(0.62 0.14 320)',
    };
    const S = (nummer, name, kurz, farbe, teile, besitz, anzahl) =>
      ({ nummer, name, kurz, farbe, teile, besitz, anzahl });
    const R = (name, aktiv) => ({ name, gewicht: aktiv ? 700 : 500, farbe: aktiv ? '#2b2b2b' : '#9a9a9a' });
    return {
      themen: [
        { kurz: 'SW', farbe: T.starwars }, { kurz: 'Creator', farbe: T.creator },
        { kurz: 'Arch', farbe: T.arch }, { kurz: 'Technic', farbe: T.technic },
        { kurz: 'Icons', farbe: T.icons },
      ],
      sets: [
        S('10276-1', 'Kolosseum', 'Creator', T.creator, '9036', true, 1),
        S('75192-1', 'Millennium Falcon', 'Star Wars', T.starwars, '7541', true, 2),
        S('21058-1', 'Cheops-Pyramide', 'Architecture', T.arch, '1476', false, 0),
        S('42115-1', 'Lamborghini Sián', 'Technic', T.technic, '3696', true, 1),
        S('10497-1', 'Galaxy Explorer', 'Icons', T.icons, '1254', false, 0),
        S('71043-1', 'Schloss Hogwarts', 'Harry Potter', T.potter, '6020', true, 1),
      ],
      reiter: [R('Galerie', true), R('Katalog', false), R('Teile', false), R('Figuren', false), R('Finanzen', false)],
    };
  }
}
</script>
</body>
</html>
