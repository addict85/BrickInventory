<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #2b2b2b; } a:hover { color: #6a6a6a; }
  </style>
</helmet>

<div style="width: 1100px; height: 760px; background: #fff; color: #2b2b2b; display: flex; flex-direction: column; overflow: hidden">

  <!-- Der Themenstreifen fuehrt die Farbe bis in den Detaildialog -->
  <div style="height: 6px; background: oklch(0.62 0.14 25); flex-shrink: 0"></div>

  <div style="display: flex; flex-grow: 1; overflow: hidden">
    <div style="width: 430px; background: #f4f4f4; display: flex; flex-direction: column; border-right: 1px solid #e6e6e6; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
        <svg width="200" height="200" viewBox="0 0 48 48" fill="none" stroke="oklch(0.62 0.14 25)" stroke-width="1" stroke-linejoin="round" opacity="0.9">
          <rect x="7" y="18" width="34" height="20" rx="2"></rect>
          <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
          <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
          <path d="M7 27h34"></path>
        </svg>
      </div>
      <div style="display: flex; gap: 8px; padding: 16px; border-top: 1px solid #e6e6e6; background: #fff">
        <div style="flex-grow: 1; padding: 11px; border-radius: 8px; background: #2b2b2b; color: #fff; font-size: 13px; font-weight: 700; text-align: center">In Galerie aufnehmen</div>
        <div style="padding: 11px 15px; border-radius: 8px; border: 1px solid #dcdcdc; color: #4a4a4a; font-size: 13px; font-weight: 600">BrickLink</div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 24px 28px 18px; border-bottom: 1px solid #eee">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a8a8a">10276-1</div>
        <div style="font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 5px">Kolosseum</div>
        <div style="display: flex; gap: 8px; margin-top: 13px; align-items: center">
          <span style="background: oklch(0.62 0.14 25); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px">Creator Expert</span>
          <span style="border: 1px solid #e0e0e0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px">✓ 1× im Bestand</span>
          <span style="border: 1px solid #e0e0e0; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px">Neu</span>
        </div>
      </div>

      <div style="padding: 2px 28px">
        <sc-for list="{{zeilen}}" as="z" hint-placeholder-count="6">
          <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #f2f2f2">
            <span style="font-size: 13px; color: #8a8a8a">{{z.k}}</span>
            <span style="font-size: 13.5px; font-weight: 600; font-family: {{z.schrift}}">{{z.v}}</span>
          </div>
        </sc-for>
      </div>

      <!-- Hier wird der Faecher zum Beweis: die Linien tragen die Themenfarbe
           NICHT — sie bedeuten Zustand, und der hat seine eigene Bedeutung. -->
      <div style="padding: 16px 28px 0">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px">
          <span style="font-size: 13px; font-weight: 600">Preisverlauf</span>
          <div style="display: flex; gap: 16px; font-size: 11.5px">
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 2.5px; background: #2563eb; display: inline-block"></span><span style="color: #8a8a8a">Neu</span></span>
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 2.5px; background: #d97706; display: inline-block"></span><span style="color: #8a8a8a">Gebraucht</span></span>
          </div>
        </div>
        <div style="border: 1px solid #e6e6e6; border-radius: 10px; padding: 14px 12px 10px; background: #fafafa">
          <svg width="100%" height="120" viewBox="0 0 560 120" preserveAspectRatio="none">
            <line x1="0" y1="30" x2="560" y2="30" stroke="#ebebeb" stroke-width="1"></line>
            <line x1="0" y1="60" x2="560" y2="60" stroke="#ebebeb" stroke-width="1"></line>
            <line x1="0" y1="90" x2="560" y2="90" stroke="#ebebeb" stroke-width="1"></line>
            <polyline points="0,88 70,82 140,84 210,70 280,64 350,58 420,44 490,38 560,26" fill="none" stroke="#2563eb" stroke-width="2.2"></polyline>
            <polyline points="0,104 70,101 140,99 210,96 280,92 350,88 420,84 490,79 560,74" fill="none" stroke="#d97706" stroke-width="2.2"></polyline>
          </svg>
          <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9a9a9a; padding-top: 6px">
            <span>Sep 25</span><span>Dez 25</span><span>Mär 26</span><span>Jun 26</span><span>Sep 26</span>
          </div>
        </div>
        <div style="font-size: 11.5px; color: #8a8a8a; padding: 9px 2px 0; line-height: 1.45">
          Zustandsfarben bleiben Blau und Bernstein — sie bedeuten etwas anderes als der Themenfächer und dürfen ihm nicht ähneln.
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1100,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const M = "'JetBrains Mono', monospace";
    const T = "'Plus Jakarta Sans', sans-serif";
    return {
      zeilen: [
        { k: 'Jahr', v: '2020', schrift: M },
        { k: 'Thema', v: 'Creator Expert', schrift: T },
        { k: 'Minifiguren', v: '0', schrift: M },
        { k: 'Kaufpreis', v: 'CHF 449.00', schrift: M },
        { k: 'Marktwert (neu)', v: 'CHF 612.00', schrift: M },
        { k: 'Aufgenommen am', v: '14.03.2021', schrift: M },
      ],
    };
  }
}
</script>
</body>
</html>
