<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #e8a33d; } a:hover { color: #f4bb63; }
    .wb-karte { transition: border-color .18s, transform .18s; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #14181d; color: #e6e9ed; display: flex; flex-direction: column; overflow: hidden">

  <!-- Kopfleiste -->
  <div style="display: flex; align-items: center; gap: 24px; padding: 0 28px; height: 60px; background: #191e25; border-bottom: 1px solid #262d36; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8a33d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="12" rx="1.5"></rect>
        <path d="M7 8V6.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V8"></path>
        <path d="M14 8V6.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V8"></path>
      </svg>
      <span style="font-weight: 800; font-size: 15px; letter-spacing: -.01em">BrickInventory</span>
    </div>
    <div style="display: flex; gap: 2px">
      <div style="padding: 7px 14px; border-radius: 7px; background: #232a33; color: #e8a33d; font-size: 13.5px; font-weight: 600">Galerie</div>
      <div style="padding: 7px 14px; border-radius: 7px; color: #8d96a3; font-size: 13.5px; font-weight: 500">Katalog</div>
      <div style="padding: 7px 14px; border-radius: 7px; color: #8d96a3; font-size: 13.5px; font-weight: 500">Teile</div>
      <div style="padding: 7px 14px; border-radius: 7px; color: #8d96a3; font-size: 13.5px; font-weight: 500">Minifiguren</div>
      <div style="padding: 7px 14px; border-radius: 7px; color: #8d96a3; font-size: 13.5px; font-weight: 500">Finanzen</div>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 8px; background: #232a33; border: 1px solid #2f3843; border-radius: 8px; padding: 7px 12px; width: 260px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f7986" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="color: #6f7986; font-size: 13px">Set, Nummer oder Thema …</span>
    </div>
    <div style="width: 32px; height: 32px; border-radius: 999px; background: #e8a33d; color: #14181d; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">MB</div>
  </div>

  <!-- Kennzahlen -->
  <div style="display: flex; gap: 12px; padding: 20px 28px 0">
    <div style="flex-grow: 1; background: #191e25; border: 1px solid #262d36; border-radius: 12px; padding: 14px 16px">
      <div style="font-size: 11.5px; color: #8d96a3; font-weight: 500; letter-spacing: .04em; text-transform: uppercase">Sets</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 4px">312</div>
    </div>
    <div style="flex-grow: 1; background: #191e25; border: 1px solid #262d36; border-radius: 12px; padding: 14px 16px">
      <div style="font-size: 11.5px; color: #8d96a3; font-weight: 500; letter-spacing: .04em; text-transform: uppercase">Teile</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 4px">148 902</div>
    </div>
    <div style="flex-grow: 1; background: #191e25; border: 1px solid #262d36; border-radius: 12px; padding: 14px 16px">
      <div style="font-size: 11.5px; color: #8d96a3; font-weight: 500; letter-spacing: .04em; text-transform: uppercase">Minifiguren</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 4px">571</div>
    </div>
    <div style="flex-grow: 1; background: #191e25; border: 1px solid #2f2a1c; border-radius: 12px; padding: 14px 16px">
      <div style="font-size: 11.5px; color: #8d96a3; font-weight: 500; letter-spacing: .04em; text-transform: uppercase">Marktwert</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 4px; color: #e8a33d">CHF 41 280</div>
    </div>
  </div>

  <!-- Filterzeile -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 18px 28px 14px">
    <div style="padding: 6px 13px; border-radius: 999px; background: #e8a33d; color: #14181d; font-size: 12.5px; font-weight: 700">Alle</div>
    <div style="padding: 6px 13px; border-radius: 999px; border: 1px solid #2f3843; color: #b6bec9; font-size: 12.5px; font-weight: 500">Star Wars</div>
    <div style="padding: 6px 13px; border-radius: 999px; border: 1px solid #2f3843; color: #b6bec9; font-size: 12.5px; font-weight: 500">Creator Expert</div>
    <div style="padding: 6px 13px; border-radius: 999px; border: 1px solid #2f3843; color: #b6bec9; font-size: 12.5px; font-weight: 500">Technic</div>
    <div style="padding: 6px 13px; border-radius: 999px; border: 1px solid #2f3843; color: #b6bec9; font-size: 12.5px; font-weight: 500">Architecture</div>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 12.5px; color: #8d96a3">312 Sets</span>
  </div>

  <!-- Kachelraster -->
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; padding: 0 28px 28px">

    <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
      <div class="wb-karte" style="background: #191e25; border: 1.5px solid #262d36; border-radius: 12px; overflow: hidden; position: relative">
        <div style="aspect-ratio: 1; background: #11151a; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #262d36">
          <svg width="62" height="62" viewBox="0 0 48 48" fill="none" stroke="{{s.strich}}" stroke-width="1.4" stroke-linejoin="round" opacity="0.85">
            <rect x="7" y="18" width="34" height="20" rx="2"></rect>
            <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M7 27h34"></path>
          </svg>
        </div>
        <div style="padding: 11px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.2px; color: #e8a33d; font-weight: 500; margin-bottom: 3px">{{s.nummer}}</div>
          <div style="font-size: 13.1px; font-weight: 600; line-height: 1.3; margin-bottom: 7px; color: #e6e9ed">{{s.name}}</div>
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 11.2px; color: #8d96a3">{{s.jahr}} · {{s.thema}}</span>
            <span style="background: #2a2418; color: #e8a33d; font-weight: 700; font-size: 10.7px; padding: 2px 7px; border-radius: 999px; font-family: 'JetBrains Mono', monospace">{{s.teile}}</span>
          </div>
        </div>
        <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; top: 9px; right: 9px; background: #1d2a20; color: #6fbf7f; font-weight: 600; font-size: 10.2px; padding: 3px 7px; border-radius: 999px; border: 1px solid #263a2b">✓ ×{{s.anzahl}}</div>
        </sc-if>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (nummer, name, jahr, thema, teile, besitz, anzahl, strich) =>
      ({ nummer, name, jahr, thema, teile, besitz, anzahl, strich });
    return {
      sets: [
        S('10276-1', 'Kolosseum', 2020, 'Creator Expert', '9036', true, 1, '#e8a33d'),
        S('75192-1', 'Millennium Falcon', 2017, 'Star Wars', '7541', true, 2, '#8d96a3'),
        S('21058-1', 'Cheops-Pyramide', 2022, 'Architecture', '1476', false, 0, '#c98f4a'),
        S('42115-1', 'Lamborghini Sián', 2020, 'Technic', '3696', true, 1, '#6f7986'),
        S('10497-1', 'Galaxy Explorer', 2022, 'Icons', '1254', false, 0, '#9aa4b1'),
        S('71043-1', 'Schloss Hogwarts', 2018, 'Harry Potter', '6020', true, 1, '#d8a05f'),
      ],
    };
  }
}
</script>
</body>
</html>
