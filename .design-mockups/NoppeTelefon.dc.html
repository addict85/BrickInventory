<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
    .np-platte {
      background-color: #eef1f6;
      background-image: radial-gradient(circle at 10px 10px, rgba(20,24,33,.055) 4px, transparent 4.6px);
      background-size: 20px 20px;
    }
    .np-karte { background: #fff; border: 2.5px solid #161a21; border-radius: 13px; box-shadow: 0 3px 0 #161a21; overflow: hidden; }
  </style>
</helmet>

<div class="np-platte" style="width: 390px; height: 844px; color: #161a21; display: flex; flex-direction: column; overflow: hidden">

  <!-- Kopf als Stein, wie in der Webansicht. Dieselbe Sprache auf beiden
       Oberflaechen — die Vorgabe dieses Projekts. -->
  <div style="flex-shrink: 0; background: #d91f26; border-bottom: 3px solid #161a21">
    <div style="display: flex; gap: 8px; padding: 5px 16px 0">
      <sc-for list="{{noppen}}" as="n" hint-placeholder-count="8">
        <div style="width: 14px; height: 7px; border-radius: 4px 4px 0 0; background: #f4575d"></div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 14px">
      <div>
        <div style="font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -.015em">Galerie</div>
        <div style="font-size: 12.5px; font-weight: 700; color: #ffd0d2; margin-top: 1px">312 Sets · CHF 41 280</div>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #f5c400; border: 2.5px solid #161a21; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px">MB</div>
    </div>
  </div>

  <div style="padding: 14px 16px 0; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 9px; background: #fff; border: 2.5px solid #161a21; border-radius: 11px; box-shadow: 0 3px 0 #161a21; padding: 11px 13px; margin-bottom: 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a7280" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="color: #6a7280; font-size: 14px; font-weight: 600">Set, Nummer oder Thema …</span>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 14px">
      <div style="padding: 7px 15px; border-radius: 10px; border: 2.5px solid #161a21; box-shadow: 0 3px 0 #161a21; background: #f5c400; font-size: 12.5px; font-weight: 900">Alle</div>
      <div style="padding: 7px 15px; border-radius: 10px; border: 2.5px solid #161a21; background: #fff; font-size: 12.5px; font-weight: 700">Star Wars</div>
      <div style="padding: 7px 15px; border-radius: 10px; border: 2.5px solid #161a21; background: #fff; font-size: 12.5px; font-weight: 700">Technic</div>
    </div>
  </div>

  <!-- Kacheln: zwei Spalten, Bildfeld 118dp wie CatalogSetCard im Baum. -->
  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
        <div class="np-karte" style="position: relative">
          <div style="background: {{s.farbe}}; padding: 5px 11px 0; display: flex; gap: 7px; border-bottom: 2.5px solid #161a21">
            <div style="width: 13px; height: 6px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
            <div style="width: 13px; height: 6px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
            <div style="width: 13px; height: 6px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.5)"></div>
          </div>
          <div style="height: 118px; background: #f7f9fc; display: flex; align-items: center; justify-content: center; border-bottom: 2.5px solid #161a21">
            <svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="{{s.farbe}}" stroke-width="2.2" stroke-linejoin="round">
              <rect x="7" y="18" width="34" height="20" rx="2"></rect>
              <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
              <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
              <path d="M7 27h34"></path>
            </svg>
          </div>
          <div style="padding: 10px">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.2px; font-weight: 700; color: #5a6270; margin-bottom: 3px">{{s.nummer}}</div>
            <div style="font-size: 13.1px; font-weight: 800; line-height: 1.3; margin-bottom: 7px">{{s.name}}</div>
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span style="font-size: 11.2px; font-weight: 700; color: #6a7280">{{s.jahr}}</span>
              <span style="background: #161a21; color: #fff; font-weight: 700; font-size: 10.4px; padding: 2px 7px; border-radius: 999px; font-family: 'JetBrains Mono', monospace">{{s.teile}}</span>
            </div>
          </div>
          <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
            <div style="position: absolute; top: 30px; right: 8px; background: #00a94f; color: #fff; font-weight: 900; font-size: 10.2px; padding: 2px 8px; border-radius: 999px; border: 2px solid #161a21">✓ ×{{s.anzahl}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Reiterleiste: wieder ein Stein, Noppen nach oben. Der aktive Reiter ist
       eine aufgesetzte Platte, nicht nur eine andere Farbe — auf Rot allein
       waere „aktiv" sonst schwer zu sehen. -->
  <div style="flex-shrink: 0; background: #d91f26; border-top: 3px solid #161a21">
    <div style="display: flex; gap: 8px; padding: 5px 16px 0">
      <sc-for list="{{noppen}}" as="n" hint-placeholder-count="8">
        <div style="width: 14px; height: 7px; border-radius: 4px 4px 0 0; background: #f4575d"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-around; align-items: center; padding: 9px 8px 20px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; background: #fff; border: 2.5px solid #161a21; border-radius: 10px; padding: 6px 13px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#161a21" stroke-width="2.3" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="1.5"></rect><path d="M7 8V6.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V8"></path><path d="M14 8V6.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V8"></path></svg>
        <span style="font-size: 10.4px; font-weight: 900">Galerie</span>
      </div>
      <sc-for list="{{reiter}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffd0d2" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.pfad}}"></path></svg>
          <span style="font-size: 10.4px; font-weight: 800; color: #ffd0d2">{{r.name}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (nummer, name, jahr, teile, besitz, anzahl, farbe) =>
      ({ nummer, name, jahr, teile, besitz, anzahl, farbe });
    return {
      sets: [
        S('10276-1', 'Kolosseum',         2020, '9036', true,  1, '#d91f26'),
        S('75192-1', 'Millennium Falcon', 2017, '7541', true,  2, '#f5c400'),
        S('21058-1', 'Cheops-Pyramide',   2022, '1476', false, 0, '#1a6fd4'),
        S('42115-1', 'Lamborghini Sián',  2020, '3696', true,  1, '#00a94f'),
        S('10497-1', 'Galaxy Explorer',   2022, '1254', false, 0, '#ff7a00'),
        S('71043-1', 'Schloss Hogwarts',  2018, '6020', true,  1, '#8a4fbf'),
      ],
      reiter: [
        { name: 'Katalog',  pfad: 'M4 5h16M4 12h16M4 19h16' },
        { name: 'Teile',    pfad: 'M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z' },
        { name: 'Figuren',  pfad: 'M12 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM5 20a7 7 0 0 1 14 0' },
        { name: 'Finanzen', pfad: 'M4 18V9m5 9V5m5 13v-6m5 6V7' },
      ],
      noppen: Array.from({ length: 8 }, (_, i) => i),
    };
  }
}
</script>
</body>
</html>
