<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #2b2b2b; } a:hover { color: #6a6a6a; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #fafafa; color: #2b2b2b; display: flex; flex-direction: column; overflow: hidden">

  <!-- Die Bedienung bleibt grau. Farbe traegt hier AUSKUNFT, nicht Schmuck. -->
  <div style="display: flex; align-items: center; gap: 26px; padding: 0 30px; min-height: 56px; background: #fff; border-bottom: 1px solid #e6e6e6; flex-shrink: 0">
    <span style="font-weight: 800; font-size: 15px; letter-spacing: -.01em">BrickInventory</span>
    <div style="display: flex; gap: 20px">
      <span style="font-size: 13.5px; font-weight: 600">Galerie</span>
      <span style="font-size: 13.5px; color: #8a8a8a">Katalog</span>
      <span style="font-size: 13.5px; color: #8a8a8a">Teile</span>
      <span style="font-size: 13.5px; color: #8a8a8a">Minifiguren</span>
      <span style="font-size: 13.5px; color: #8a8a8a">Finanzen</span>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #dcdcdc; border-radius: 7px; padding: 7px 12px; width: 250px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="color: #9a9a9a; font-size: 13px">Set, Nummer oder Thema …</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8a8a8a">CHF 41 280</span>
  </div>

  <!-- Der Faecher: jedes Thema hat seinen Ton, und der gilt ueberall -->
  <div style="display: flex; align-items: stretch; gap: 0; padding: 18px 30px 0; flex-shrink: 0">
    <sc-for list="{{themen}}" as="t" hint-placeholder-count="6">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px; padding-right: 10px">
        <div style="height: 5px; background: {{t.farbe}}; border-radius: 3px"></div>
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 12px; font-weight: 600">{{t.name}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8a8a8a">{{t.anzahl}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 22px 30px 14px; display: flex; align-items: baseline; gap: 12px; flex-shrink: 0">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -.015em">312 Sets</span>
    <span style="font-size: 13px; color: #8a8a8a">nach Thema eingefärbt</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; padding: 0 30px">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
      <div style="background: #fff; border: 1px solid #e6e6e6; border-radius: 10px; overflow: hidden; position: relative">
        <div style="height: 5px; background: {{s.farbe}}"></div>
        <div style="aspect-ratio: 1; background: #f4f4f4; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee">
          <svg width="62" height="62" viewBox="0 0 48 48" fill="none" stroke="{{s.farbe}}" stroke-width="1.4" stroke-linejoin="round" opacity="0.9">
            <rect x="7" y="18" width="34" height="20" rx="2"></rect>
            <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M7 27h34"></path>
          </svg>
        </div>
        <div style="padding: 11px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11.2px; color: #8a8a8a; margin-bottom: 3px">{{s.nummer}}</div>
          <div style="font-size: 13.1px; font-weight: 600; line-height: 1.3; margin-bottom: 8px">{{s.name}}</div>
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 11px; font-weight: 600; color: {{s.farbe}}">{{s.thema}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.7px; color: #6a6a6a">{{s.teile}}</span>
          </div>
        </div>
        <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; top: 13px; right: 9px; background: #fff; border: 1px solid #e0e0e0; color: #2b2b2b; font-weight: 600; font-size: 10.2px; padding: 2px 7px; border-radius: 999px">×{{s.anzahl}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Gleiche Helligkeit, gleiche Buntheit, nur der Farbton wechselt — so
    // steht kein Thema lauter da als ein anderes.
    const T = {
      starwars:  'oklch(0.62 0.14 260)',
      creator:   'oklch(0.62 0.14 25)',
      arch:      'oklch(0.62 0.14 200)',
      technic:   'oklch(0.62 0.14 70)',
      icons:     'oklch(0.62 0.14 145)',
      potter:    'oklch(0.62 0.14 320)',
    };
    const S = (nummer, name, thema, farbe, teile, besitz, anzahl) =>
      ({ nummer, name, thema, farbe, teile, besitz, anzahl });
    return {
      themen: [
        { name: 'Star Wars', anzahl: 84, farbe: T.starwars },
        { name: 'Creator Expert', anzahl: 61, farbe: T.creator },
        { name: 'Architecture', anzahl: 38, farbe: T.arch },
        { name: 'Technic', anzahl: 47, farbe: T.technic },
        { name: 'Icons', anzahl: 52, farbe: T.icons },
        { name: 'Harry Potter', anzahl: 30, farbe: T.potter },
      ],
      sets: [
        S('10276-1', 'Kolosseum', 'Creator Expert', T.creator, '9036', true, 1),
        S('75192-1', 'Millennium Falcon', 'Star Wars', T.starwars, '7541', true, 2),
        S('21058-1', 'Cheops-Pyramide', 'Architecture', T.arch, '1476', false, 0),
        S('42115-1', 'Lamborghini Sián', 'Technic', T.technic, '3696', true, 1),
        S('10497-1', 'Galaxy Explorer', 'Icons', T.icons, '1254', false, 0),
        S('71043-1', 'Schloss Hogwarts', 'Harry Potter', T.potter, '6020', true, 1),
      ],
    };
  }
}
</script>
</body>
</html>
