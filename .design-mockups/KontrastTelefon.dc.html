<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #1f6f5c; } a:hover { color: #175647; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #eceef0; color: #111417; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #111417; color: #fff; padding: 16px 16px 14px; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-weight: 800; font-size: 18px; letter-spacing: .01em">GALERIE</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #9aa3ab">312 SETS</span>
    </div>
    <div style="display: flex; gap: 18px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px">
      <span><span style="color: #7a838c">TEILE</span> 148 902</span>
      <span><span style="color: #7a838c">FIG</span> 571</span>
      <span style="color: #3fbf9a; font-weight: 700">CHF 41 280</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-bottom: 1px solid #c9ced4; padding: 0 14px; min-height: 46px; flex-shrink: 0">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7a838c" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="color: #7a838c; font-size: 13.5px; font-family: 'JetBrains Mono', monospace">suchen …</span>
  </div>

  <div style="display: flex; background: #fff; border-bottom: 1px solid #c9ced4; flex-shrink: 0">
    <sc-for list="{{filter}}" as="f" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; justify-content: center; flex-grow: 1; min-height: 44px; font-size: 12.5px; font-weight: {{f.gewicht}}; color: {{f.farbe}}; border-bottom: {{f.linie}}; border-right: 1px solid #dfe3e7">{{f.name}}</div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #c9ced4; align-content: start">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
      <div style="background: #fff; position: relative">
        <div style="height: 118px; background: #f6f7f8; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #dfe3e7">
          <svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="{{s.strich}}" stroke-width="1.5" stroke-linejoin="round">
            <rect x="7" y="18" width="34" height="20" rx="1"></rect>
            <path d="M14 18v-3.2h5.6V18M28 18v-3.2h5.6V18"></path><path d="M7 27h34"></path>
          </svg>
        </div>
        <div style="padding: 9px 10px 11px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #1f6f5c; font-weight: 500">{{s.nummer}}</div>
          <div style="font-size: 12.5px; font-weight: 600; line-height: 1.25; margin: 3px 0 6px">{{s.name}}</div>
          <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7a838c">
            <span>{{s.jahr}}</span><span style="color: #111417; font-weight: 700">{{s.teile}}</span>
          </div>
        </div>
        <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; top: 0; left: 0; background: #1f6f5c; color: #fff; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 9.5px; padding: 2px 6px">×{{s.anzahl}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; background: #111417; padding: 0 0 22px; flex-shrink: 0">
    <sc-for list="{{reiter}}" as="r" hint-placeholder-count="5">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 11px; font-weight: {{r.gewicht}}; color: {{r.farbe}}; background: {{r.grund}}">{{r.name}}</div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (nummer, name, jahr, teile, besitz, anzahl, strich) =>
      ({ nummer, name, jahr, teile, besitz, anzahl, strich });
    const R = (name, aktiv) => ({
      name, gewicht: aktiv ? 700 : 500,
      farbe: aktiv ? '#fff' : '#9aa3ab', grund: aktiv ? '#1f6f5c' : 'transparent',
    });
    const F = (name, aktiv) => ({
      name, gewicht: aktiv ? 700 : 500, farbe: aktiv ? '#111417' : '#7a838c',
      linie: aktiv ? '2px solid #1f6f5c' : '2px solid transparent',
    });
    return {
      reiter: [R('Galerie', true), R('Katalog', false), R('Teile', false), R('Figuren', false), R('Finanzen', false)],
      filter: [F('Alle', true), F('Star Wars', false), F('Technic', false), F('Icons', false)],
      sets: [
        S('10276-1', 'Kolosseum', 2020, '9036', true, 1, '#1f6f5c'),
        S('75192-1', 'Millennium Falcon', 2017, '7541', true, 2, '#7a838c'),
        S('21058-1', 'Cheops-Pyramide', 2022, '1476', false, 0, '#a4acb4'),
        S('42115-1', 'Lamborghini Sián', 2020, '3696', true, 1, '#7a838c'),
        S('10497-1', 'Galaxy Explorer', 2022, '1254', false, 0, '#a4acb4'),
        S('71043-1', 'Schloss Hogwarts', 2018, '6020', true, 1, '#1f6f5c'),
      ],
    };
  }
}
</script>
</body>
</html>
