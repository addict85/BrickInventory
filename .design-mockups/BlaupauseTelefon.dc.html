<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    a { color: #63d2f5; } a:hover { color: #9ae4fa; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0d1b2a; color: #cfe6f2; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(99,210,245,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(99,210,245,.055) 1px, transparent 1px); background-size: 24px 24px"></div>
  <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(99,210,245,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(99,210,245,.09) 1px, transparent 1px); background-size: 120px 120px"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%">

    <div style="border-bottom: 1px solid #234156; padding: 18px 18px 14px; flex-shrink: 0">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700; letter-spacing: .08em">GALERIE</span>
        <span style="font-size: 10.5px; color: #6f93aa">BL. 1/4 · M 1:1</span>
      </div>
      <div style="display: flex; gap: 20px; margin-top: 12px; font-size: 11px">
        <span><span style="color: #6f93aa">SETS</span> 312</span>
        <span><span style="color: #6f93aa">TL</span> 148 902</span>
        <span style="color: #63d2f5; font-weight: 700">CHF 41 280</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; border-bottom: 1px solid #234156; padding: 0 18px; min-height: 46px; flex-shrink: 0">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6f93aa" stroke-width="1.5"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="font-size: 12.5px; color: #6f93aa">suchen …</span>
    </div>

    <div style="display: flex; border-bottom: 1px solid #234156; flex-shrink: 0">
      <sc-for list="{{filter}}" as="f" hint-placeholder-count="4">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 11px; letter-spacing: .04em; color: {{f.farbe}}; border-right: 1px solid #234156; border-bottom: {{f.linie}}">{{f.name}}</div>
      </sc-for>
    </div>

    <div style="flex-grow: 1; overflow: hidden; padding: 16px 18px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
          <div style="border: 1px solid #2c5570; background: rgba(13,27,42,.72); position: relative">
            <div style="height: 118px; display: flex; align-items: center; justify-content: center; border-bottom: 1px dashed #2c5570; position: relative">
              <svg width="70" height="70" viewBox="0 0 48 48" fill="none" stroke="{{s.strich}}" stroke-width="0.8" stroke-linejoin="round">
                <rect x="7" y="18" width="34" height="20"></rect>
                <path d="M14 18v-4h5.6v4M28 18v-4h5.6v4"></path><path d="M7 27h34"></path>
              </svg>
              <span style="position: absolute; bottom: 5px; right: 7px; font-size: 9px; color: #4d7f9c">{{s.teile}} TL</span>
            </div>
            <div style="padding: 9px 10px 11px">
              <div style="font-size: 10.5px; color: #63d2f5; letter-spacing: .04em">{{s.nummer}}</div>
              <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600; line-height: 1.25; margin: 4px 0 6px; color: #e2f1f8">{{s.name}}</div>
              <div style="font-size: 10px; color: #6f93aa">{{s.jahr}}</div>
            </div>
            <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
              <div style="position: absolute; top: -1px; right: -1px; border: 1px solid #63d2f5; color: #63d2f5; font-size: 9px; font-weight: 700; padding: 2px 5px; background: #0d1b2a">×{{s.anzahl}}</div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; border-top: 1px solid #234156; padding: 0 0 22px; flex-shrink: 0; background: rgba(13,27,42,.9)">
      <sc-for list="{{reiter}}" as="r" hint-placeholder-count="5">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 10px; letter-spacing: .05em; color: {{r.farbe}}; border-top: {{r.linie}}">{{r.name}}</div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (nummer, name, jahr, teile, besitz, anzahl, strich) =>
      ({ nummer, name, jahr, teile, besitz, anzahl, strich });
    const A = (name, aktiv) => ({
      name, farbe: aktiv ? '#63d2f5' : '#6f93aa',
      linie: aktiv ? '2px solid #63d2f5' : '2px solid transparent',
    });
    return {
      filter: [A('ALLE', true), A('STAR WARS', false), A('TECHNIC', false), A('ICONS', false)],
      reiter: [A('GALERIE', true), A('KATALOG', false), A('TEILE', false), A('FIG', false), A('FINANZ', false)],
      sets: [
        S('10276-1', 'Kolosseum', 2020, '9036', true, 1, '#63d2f5'),
        S('75192-1', 'Millennium Falcon', 2017, '7541', true, 2, '#4d7f9c'),
        S('21058-1', 'Cheops-Pyramide', 2022, '1476', false, 0, '#3d6a85'),
        S('42115-1', 'Lamborghini Sián', 2020, '3696', true, 1, '#4d7f9c'),
      ],
    };
  }
}
</script>
</body>
</html>
