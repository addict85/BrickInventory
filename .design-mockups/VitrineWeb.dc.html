<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #1a1a1a; } a:hover { color: #666; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #f7f6f4; color: #1a1a1a; display: flex; flex-direction: column; overflow: hidden">

  <!-- Kopf: fast nichts. Der Bestand ist der Inhalt, nicht die Bedienung. -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 34px 56px 0; flex-shrink: 0">
    <div style="display: flex; align-items: baseline; gap: 40px">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: .02em">BrickInventory</span>
      <div style="display: flex; gap: 26px">
        <span style="font-size: 13.5px; font-weight: 500; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px">Galerie</span>
        <span style="font-size: 13.5px; font-weight: 300; color: #8c8781">Katalog</span>
        <span style="font-size: 13.5px; font-weight: 300; color: #8c8781">Teile</span>
        <span style="font-size: 13.5px; font-weight: 300; color: #8c8781">Minifiguren</span>
        <span style="font-size: 13.5px; font-weight: 300; color: #8c8781">Finanzen</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 22px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8c8781">312 · 148 902 · 571</span>
      <div style="width: 30px; height: 30px; border-radius: 999px; border: 1px solid #d8d4ce; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 500">MB</div>
    </div>
  </div>

  <!-- Grosse Ueberschrift statt Kennzahlkacheln -->
  <div style="padding: 46px 56px 30px; display: flex; align-items: flex-end; justify-content: space-between; flex-shrink: 0">
    <div>
      <div style="font-size: 40px; font-weight: 300; letter-spacing: -.025em; line-height: 1">Sammlung</div>
      <div style="font-size: 13px; font-weight: 300; color: #8c8781; margin-top: 10px">312 Sets · zuletzt ergänzt am 8. September 2026</div>
    </div>
    <div style="display: flex; gap: 24px; align-items: center">
      <span style="font-size: 12.5px; font-weight: 500; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px">Alle</span>
      <span style="font-size: 12.5px; font-weight: 300; color: #8c8781">Star Wars</span>
      <span style="font-size: 12.5px; font-weight: 300; color: #8c8781">Creator Expert</span>
      <span style="font-size: 12.5px; font-weight: 300; color: #8c8781">Technic</span>
    </div>
  </div>

  <!-- Vier statt sechs Spalten: das Bild traegt die Kachel -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 44px 34px; padding: 0 56px">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="aspect-ratio: 4 / 3; background: #efedea; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,26,26,.05), 0 12px 28px rgba(26,26,26,.06)">
          <svg width="104" height="104" viewBox="0 0 48 48" fill="none" stroke="{{s.strich}}" stroke-width="0.9" stroke-linejoin="round">
            <rect x="7" y="18" width="34" height="20" rx="1.5"></rect>
            <path d="M14 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M28 18v-3.2a1.6 1.6 0 0 1 1.6-1.6h2.4a1.6 1.6 0 0 1 1.6 1.6V18"></path>
            <path d="M7 27h34"></path>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 17px; font-weight: 500; letter-spacing: -.01em; line-height: 1.25">{{s.name}}</div>
          <div style="display: flex; align-items: baseline; justify-content: space-between">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8c8781">{{s.nummer}}</span>
            <span style="font-size: 11.5px; font-weight: 300; color: #8c8781">{{s.jahr}} · {{s.teile}} Teile</span>
          </div>
          <sc-if value="{{s.besitz}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 11px; font-weight: 500; color: #1a1a1a; border-top: 1px solid #e4e1dc; padding-top: 7px; margin-top: 3px">×{{s.anzahl}} im Bestand</div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (nummer, name, jahr, teile, besitz, anzahl, strich) =>
      ({ nummer, name, jahr, teile, besitz, anzahl, strich });
    return {
      sets: [
        S('10276-1', 'Kolosseum', 2020, '9036', true, 1, '#5a5550'),
        S('75192-1', 'Millennium Falcon', 2017, '7541', true, 2, '#8c8781'),
        S('21058-1', 'Cheops-Pyramide', 2022, '1476', false, 0, '#a8a39d'),
        S('42115-1', 'Lamborghini Sián', 2020, '3696', true, 1, '#6f6a64'),
      ],
    };
  }
}
</script>
</body>
</html>
